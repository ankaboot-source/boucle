# boucle — MVP dev loop pipeline
# Spec: issue #1 (boucle MVP spec)
# Five jobs: triage, worker, reviewer, deploy, e2e
# Dispatcher: single entry, parses webhook payload, routes to triage
# Runner: shared shell executor (Atchoum) — before_script bootstraps tools

stages:
  - check
  - dispatch
  - triage
  - work
  - review
  - merge
  - deploy
  - verify

variables:
  BOUCLE_FORGE_HOST: framagit.org
  BOUCLE_BUILD_CMD: "npm ci && npm run build"
  BOUCLE_BUILD_OUTPUT: "public"
  # Deploy: swap to any deploy command. Use $$BRANCH (escaped so eval expands it at runtime with
  # the job-local BRANCH var: "master" for deploy, "boucle/$BOUCLE_ISSUE" for worker preview).
  # Examples:
  #   CF Pages:  "npx wrangler pages deploy $BOUCLE_BUILD_OUTPUT --project-name $BOUCLE_DEPLOY_PROJECT --branch $$BRANCH"
  #   Netlify:   "npx netlify deploy --dir $BOUCLE_BUILD_OUTPUT --alias $$BRANCH"
  #   Vercel:    "npx vercel deploy $BOUCLE_BUILD_OUTPUT --prod=false"
  #   GitLab Pages: "rsync -a $BOUCLE_BUILD_OUTPUT/ /srv/pages/$$BRANCH/"
  BOUCLE_DEPLOY_CMD: "npx wrangler pages deploy $BOUCLE_BUILD_OUTPUT --project-name $BOUCLE_DEPLOY_PROJECT --branch $$BRANCH"
  BOUCLE_DEPLOY_PROJECT: ""
  # Regex to extract the deployed URL from the deploy command's stdout
  BOUCLE_DEPLOY_URL_REGEX: "https://[a-z0-9.-]+\\.pages\\.dev"
  # Production URL (for e2e fallback when deploy doesn't pass a live URL)
  BOUCLE_PRODUCTION_URL: ""
  # Attachment policy: max size per attachment (bytes) and total per issue (bytes).
  # Applies to ALL uploads fetched by bin/fetch-issue-attachments (images, PDFs,
  # archives, etc.), not just images. Variable names retain the IMAGE prefix for
  # backward compatibility with consumers that override them via GitLab UI.
  # Defaults: 10 MiB per attachment, 50 MiB total. Attachments over either cap are skipped.
  BOUCLE_IMAGE_MAX_BYTES: "10485760"
  BOUCLE_IMAGE_TOTAL_MAX_BYTES: "52428800"
  # Concurrency: max issues allowed in boucle:working state simultaneously.
  # 0 = unlimited (GitLab runner tag + resource_group are the only limits).
  # When set, triage won't trigger a new worker if the cap is reached — the
  # issue stays at boucle:todo and the doctor re-triggers it when a slot frees.
  BOUCLE_MAX_PARALLEL_ISSUES: "0"
  # Iteration cap: max worker re-runs per issue (rebase conflicts, empty MRs,
  # reviewer FAIL). Default 3. Override per-project if you want more/fewer retries.
  BOUCLE_MAX_ITERATIONS: "3"
  # Doctor staleness threshold (seconds): how long before a boucle:working or
  # boucle:review issue is considered stuck and re-triggered. Default 2400
  # (40 min). MUST be strictly greater than the longest job timeout
  # (worker/reviewer = 30 min) plus a buffer, per ARCHITECTURE.md §9 —
  # otherwise the doctor fires while a job is legitimately still running,
  # producing parasitic duplicate triggers. Lower = faster recovery but
  # more false-positive re-triggers.
  BOUCLE_STALENESS_THRESHOLD: "2400"
  # Disable Chromium visual preview in triage (saves ~120 MiB per triage job).
  # true = skip preview rendering entirely. false = default (mandatory for UI/UX issues via RENDER_REQUEST).
  BOUCLE_PREVIEW_DISABLE: "false"
  # Provider fallback: when the primary provider (ollama-cloud) is down —
  # empty log / no agent activity, the exit-4 condition (AGENTS.md lesson #29) —
  # retry with this fallback provider before escalating to a human. Empty = disabled.
  # opencode-go mirrors the ollama-cloud catalog (same model names).
  # Per-role model overrides: BOUCLE_FALLBACK_MODEL_{TRIAGE,WORKER,REVIEWER,E2E}.
  BOUCLE_FALLBACK_PROVIDER: "opencode-go"
  # File-type CI variable: $PI_AUTH holds a path to the auth.json temp file

# ── Default: use node:22-slim (has node, npm, curl — much smaller than node:22) ─
# The shared runner is a docker executor. node:22-slim is ~250MB vs ~1GB.
# before_script installs glab + pi + wrangler (not in the image).
default:
  image: node:22-slim
  # Route to the project's dedicated runner. It's a shell executor (ignores
  # image:), so before_script self-installs node — but the install persists
  # across runs, making subsequent runs faster than docker (which reinstalls
  # every time). NOTE: the shared docker runner (Atchoum) has no matching tag,
  # so it CANNOT pick up these jobs — only the dedicated runner can.
  # Loop-critical control-plane jobs (dispatch, merger) override this with
  # `tags: []` so they run on any available runner (including Atchoum) and
  # are never blocked by a busy dedicated runner.
  # The tag is project-specific infrastructure — run `bin/setup --runner-tag
  # <tag>` to configure it for your project. Default placeholder: boucle.
  tags: [data]
  before_script:
    - |
      # Trace commands only when CI_DEBUG_TRACE is set (GitLab's native debug flag).
      # Default: silent — keeps logs readable and avoids dumping JSON/code in trace output.
      [[ "${CI_DEBUG_TRACE:-false}" == "true" ]] && set -x
      export PATH="$HOME/.local/bin:$PATH"
      export GITLAB_TOKEN="$BOUCLE_TOKEN"
      export GITLAB_HOST="$BOUCLE_FORGE_HOST"
      # Silence glab update notifier (spams stderr on every call otherwise).
      export GLAB_NO_UPDATE_NOTIFIER=true

      # ── curl + jq (slim image / shell host may lack both) ──────────
      if ! command -v curl &>/dev/null || ! command -v jq &>/dev/null || ! command -v git &>/dev/null; then
        echo "Installing curl + jq + git..."
        apt-get update -qq && apt-get install -y -qq curl jq git
      fi

      # ── node + npm (needed for wrangler/build/preview — and for pi) ──
      # Persists across runs on shell executor — only downloads once.
      # Only install if something actually needs node.
      _NEED_NODE=0
      echo "$BOUCLE_DEPLOY_CMD" | grep -q wrangler && _NEED_NODE=1
      echo "$BOUCLE_BUILD_CMD"  | grep -q npm      && _NEED_NODE=1
      [ "${BOUCLE_PREVIEW_DISABLE:-false}" != "true" ] && _NEED_NODE=1
      if [ "$_NEED_NODE" = "1" ] && { ! command -v node &>/dev/null || ! command -v npm &>/dev/null; }; then
        echo "Installing Node.js (shell executor has no image support)..."
        NODE_VER="v22.19.0"
        mkdir -p "$HOME/.local"
        curl -sL "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-linux-x64.tar.xz" -o /tmp/node.tar.xz
        tar xf /tmp/node.tar.xz -C "$HOME/.local" --strip-components=1
        rm -f /tmp/node.tar.xz
      fi
      unset _NEED_NODE

      # ── glab CLI ───────────────────────────────────────────────────
      # Install or upgrade: the shell executor caches $HOME/.local/bin across
      # runs, so a pinned old version would otherwise never update. Reinstall
      # when the cached version differs from GLAB_VER (cheap, ~3MB tarball).
      GLAB_VER="1.111.0"
      _GLAB_INSTALLED="$(glab version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
      if [ -z "$_GLAB_INSTALLED" ] || [ "$_GLAB_INSTALLED" != "$GLAB_VER" ]; then
        echo "Installing glab v${GLAB_VER} (was: ${_GLAB_INSTALLED:-MISSING})..."
        mkdir -p "$HOME/.local/bin"
        curl -sL "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VER}/downloads/glab_${GLAB_VER}_linux_amd64.tar.gz" -o /tmp/glab.tar.gz
        tar xzf /tmp/glab.tar.gz -C /tmp
        cp /tmp/bin/glab "$HOME/.local/bin/glab" 2>/dev/null || cp /tmp/glab "$HOME/.local/bin/glab"
        chmod +x "$HOME/.local/bin/glab"
        rm -f /tmp/glab.tar.gz /tmp/bin/glab
      fi
      unset _GLAB_INSTALLED

      # ── pi coding agent (npm install — pi needs node >=22.19) ──────
      # pi is a Node-based CLI: @earendil-works/pi-coding-agent is the runtime
      # and pi-agent-mode ships the custom agents in .pi/agents/.
      if ! command -v pi &>/dev/null; then
        echo "Installing pi coding agent + pi-agent-mode..."
        PI_VER="${PI_VERSION:-latest}"
        npm install -g --ignore-scripts @earendil-works/pi-coding-agent@$PI_VER pi-agent-mode
      fi

      # ── codebase-memory-mcp (codebase knowledge graph) ──
      # Static binary — no node needed. codebase-memory-mcp: installed for repo indexing only (pi has no MCP support)
      # Agents query it via CLI (`codebase-memory-mcp cli ...`) for code
      # discovery (search_graph, trace_path, get_code_snippet, etc.) — pi
      # does not load it as an MCP server.
      if ! command -v codebase-memory-mcp &>/dev/null; then
        echo "Installing codebase-memory-mcp..."
        curl -fsSL "https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh" | bash 2>/dev/null || true
      fi

      # ── wrangler (only if deploy uses it) ──────────────────────────
      if echo "$BOUCLE_DEPLOY_CMD" | grep -q "wrangler" && ! command -v wrangler &>/dev/null; then
        echo "Installing wrangler..."
        npm install -g wrangler 2>/dev/null || true
      fi

      # ── pi auth (file-type CI variable → expected path) ──────
      if [ -n "${PI_AUTH:-}" ] && [ -f "$PI_AUTH" ]; then
        mkdir -p "$HOME/.pi/agent" && chmod 700 "$HOME/.pi/agent"
        cp "$PI_AUTH" "$HOME/.pi/agent/auth.json"
        chmod 600 "$HOME/.pi/agent/auth.json"
      fi

      # ── Verify ────────────────────────────────────────────────────
      echo "=== Environment ==="
      node --version 2>/dev/null || echo "node: MISSING"
      npm --version 2>/dev/null || echo "npm: MISSING"
      glab version 2>/dev/null | head -1 || echo "glab: MISSING"
      pi --version 2>/dev/null || echo "pi: MISSING"
      echo "$BOUCLE_DEPLOY_CMD" | grep -q wrangler && { wrangler --version 2>/dev/null || echo "wrangler: MISSING"; } || echo "wrangler: not needed (deploy doesn't use it)"
      codebase-memory-mcp --version 2>/dev/null || echo "codebase-memory-mcp: MISSING"
      echo "==================="

      # ── Index repo for codebase-memory-mcp (agents query the graph) ──
      # Fast (<30s for this repo size). Agents call search_graph /
      # trace_path / get_code_snippet instead of grep/glob for code discovery.
      if command -v codebase-memory-mcp &>/dev/null; then
        echo "Indexing repo for codebase-memory-mcp..."
        codebase-memory-mcp cli index_repository --repo_path "${CI_PROJECT_DIR:-$(pwd)}" --json >/dev/null 2>&1 || true
      fi

# ── Quality gate (lint + unit tests) ─────────────────────────────────────
# Runs shellcheck + shfmt + bats on push/MR pipelines only. Never runs on
# webhook triggers (the autonomous loop) or schedules — those are the dev-loop
# pipeline and the doctor sweep, which don't touch the harness source.
# Uses the default node:22-slim image and installs its own tools (shellcheck,
# shfmt, bats) so it's self-contained and doesn't depend on the shell executor.
check:
  stage: check
  # Run on any available runner (including the shared docker runner) so a
  # busy data runner never blocks the quality gate. The job is lightweight.
  tags: []
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    # Skip on webhook/trigger pipelines (the autonomous loop) and schedules.
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Run on pushes and MRs to master.
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git make xz-utils jq python3
    # Initialize bats test helper submodules
    - git submodule update --init --recursive
    # shellcheck (static binary, pinned)
    - |
      SC_VER="v0.11.0"
      curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz" \
        | tar -xJ -C /tmp
      install -m 0755 "/tmp/shellcheck-${SC_VER}/shellcheck" /usr/local/bin/shellcheck
    # shfmt (static binary, pinned)
    - |
      SHFMT_VER="v3.13.1"
      curl -sSL -o /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VER}/shfmt_${SHFMT_VER}_linux_amd64"
      chmod +x /usr/local/bin/shfmt
    # bats-core (from source, pinned tag)
    - |
      git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats
      /tmp/bats/install.sh /usr/local
    - shellcheck --version
    - shfmt --version
    - bats --version
  script:
    - make check

# ── Dispatcher ──────────────────────────────────────────────────────────
dispatch:
  stage: dispatch
  # Loop-critical entry point: must run on ANY available runner (including
  # the shared docker runner Atchoum) so webhooks are never blocked waiting
  # for the single data runner to free up. Without this, a long-running
  # worker job can stall the entire loop by hogging the data runner.
  tags: []
  # Serialize dispatch jobs so a webhook storm (many issue/MR events firing
  # trigger pipelines in quick succession) cannot saturate the runner pool
  # with concurrent no-op dispatches. A no-op dispatch exits in seconds, so
  # the queue drains fast; without this, 40 concurrent no-ops paralyze the
  # shared runner for ~20 min (observed on up/urgence-palestine.fr, 2026-08).
  # Unlike worker/reviewer (boucle-issue-$BOUCLE_ISSUE), this is a STATIC
  # name — BOUCLE_ISSUE is not available at dispatch eval time, and ALL
  # dispatches should queue regardless of which issue they target.
  resource_group: boucle-dispatch
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    # Only run dispatch on webhook triggers (no BOUCLE_ROLE set).
    # Role-specific chains (worker/reviewer/e2e) set BOUCLE_ROLE and skip dispatch.
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
    # All other pipeline sources (push, schedule, web, etc.) → skip.
    # Without this final guard, GitLab adds the job by default on push
    # pipelines, creating dispatch+triage jobs that saturate the runner
    # pool and starve the deploy job (which legitimately runs on push).
    - when: never
  # Anti-accumulation: a no-op dispatch (bot event, MR action that chains
  # via API, unhandled event) exits 0 without writing .boucle-issue, then the
  # EXIT trap flips it to exit 1. We do NOT use allow_failure here because
  # GitLab treats allow_failure jobs as "soft success" and still runs
  # downstream jobs that need them. A hard failure on dispatch is the
  # signal that skips triage (needs: [dispatch] without optional). The
  # pipeline will show as "failed" on no-op webhook events — that's
  # expected and harmless: it just means "nothing to do".
  script:
    - ./bin/update
    - |
      # Disable pipefail: grep in $(...) exits 1 on no-match, killing the script under set -eo pipefail. Without pipefail, the var is just empty (which we handle).
      set +o pipefail
      # Anti-accumulation: if dispatch exits 0 without writing .boucle-issue,
      # fail instead so downstream triage (needs: [dispatch] without optional)
      # is skipped. This prevents no-op webhook pipelines (bot events, MR
      # actions that chain via API, unhandled events) from consuming the
      # data runner while triage bootstraps only to find no work to do.
      trap 'if [ $? -eq 0 ] && [ ! -f .boucle-issue ]; then exit 1; fi' EXIT

      ACTOR=$(jq -r '.user.username // empty' "$TRIGGER_PAYLOAD")
      OBJECT_KIND=$(jq -r '.object_kind // empty' "$TRIGGER_PAYLOAD")
      MR_ACTION=$(jq -r '.object_attributes.action // empty' "$TRIGGER_PAYLOAD")
      # Bot-originated events are filtered to prevent loops — EXCEPT for MR
      # merge webhooks. When the merger job (running as up-bot) merges a MR,
      # the merge webhook fires with ACTOR=up-bot. Without this exception,
      # the catchup is never triggered and the issue stays stuck at
      # boucle:merging forever (the merger job's e2e close path is unreliable
      # — it can fail, leaving no fallback close path).
      if [ "$ACTOR" = "up-bot" ] && [ "$MR_ACTION" != "merge" ]; then
        exit 0
      fi

      # ── Merge request events ──────────────────────────────────────────
      # GitLab emits a Merge Request Hook for each MR lifecycle action:
      #   open, update, close, reopen, approved, unapproved, merge
      # We route each to the appropriate loop stage:
      #   approved  → merger (existing behavior)
      #   update    → reviewer (MR was revised → re-review)
      #   close     → worker (MR rejected → re-run with feedback)
      #   reopen    → reviewer (MR reopened → re-review)
      #   unapproved→ reviewer (approval revoked → re-review)
      #   open/merge→ skip (worker chains to reviewer; merger handles merge)
      # Bot-originated events are filtered by the ACTOR guard above, except
      # merge actions (which trigger catchup to close the issue).
      if [ "$OBJECT_KIND" = "merge_request" ]; then
        SOURCE_BRANCH=$(jq -r '.object_attributes.source_branch // empty' "$TRIGGER_PAYLOAD")
        MR_IID=$(jq -r '.object_attributes.iid // empty' "$TRIGGER_PAYLOAD")
        # Extract issue IID from branch name boucle/<iid>
        MR_ISSUE_IID=$(printf '%s' "$SOURCE_BRANCH" | sed -n 's/^boucle\/\([0-9]\+\)$/\1/p')
        if [ -z "$MR_ISSUE_IID" ]; then
          echo "MR !${MR_IID} ($MR_ACTION) but source_branch '$SOURCE_BRANCH' is not a boucle branch, skipping"
          exit 0
        fi

        # Global guard: if the issue is already closed, skip ALL MR webhooks.
        # A closed issue is terminal from the loop's perspective; re-triggering
        # roles on it only produces pipeline noise (issue #35). The catchup
        # (merge action) is idempotent on a closed issue, and all other actions
        # are meaningless once the issue is closed.
        if [ -n "$MR_ISSUE_IID" ]; then
          ISSUE_STATE=$(glab api --hostname $BOUCLE_FORGE_HOST --method GET "/projects/$CI_PROJECT_ID/issues/$MR_ISSUE_IID" 2>/dev/null | jq -r '.state // empty' 2>/dev/null || true)
          if [ "$ISSUE_STATE" = "closed" ]; then
            echo "boucle: issue #$MR_ISSUE_IID is closed — skipping $MR_ACTION webhook (no-op)"
            exit 0
          fi
        fi

        case "$MR_ACTION" in
          approved)
            # Trigger merger if the issue is at boucle:approval (reviewer
            # PASS'd it) OR boucle:human (human override — the reviewer
            # failed/UNCERTAIN but the human manually approves the MR,
            # overriding the reviewer's verdict). Without this fallback,
            # a reviewer failure strands the issue at boucle:human with no
            # path forward even after the human approves the MR natively.
            MR_LABELS=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$MR_ISSUE_IID" | jq -r '.labels | join(",")')
            if ! echo "$MR_LABELS" | grep -qE "boucle:(approval|human)"; then
              echo "Issue #$MR_ISSUE_IID not at boucle:approval or boucle:human (labels: $MR_LABELS) — ignoring MR approval, skipping"
              exit 0
            fi
            if echo "$MR_LABELS" | grep -q "boucle:human"; then
              echo "MR !${MR_IID} approved (native GitLab approval) for issue #$MR_ISSUE_IID — human override of reviewer verdict, triggering merger"
            else
              echo "MR !${MR_IID} approved (native GitLab approval) for issue #$MR_ISSUE_IID — triggering merger"
            fi
            curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
              -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
              -F "variables[BOUCLE_ISSUE]=$MR_ISSUE_IID" -F "variables[BOUCLE_ROLE]=merger" > /dev/null
            exit 0
            ;;
          update)
            # MR branch updated (new commits pushed by a human). Re-trigger
            # the reviewer so it re-reviews the revised MR. If the issue was
            # already at boucle:approval (approved before the update), the
            # update invalidates the approval — revert to boucle:review first.
            MR_LABELS=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$MR_ISSUE_IID" | jq -r '.labels | join(",")')
            if echo "$MR_LABELS" | grep -q "boucle:approval"; then
              echo "MR !${MR_IID} updated after approval — reverting issue #$MR_ISSUE_IID to boucle:review"
              # Preserve non-boucle labels, set boucle:review + bot status
              NON_BOUCLE=$(echo "$MR_LABELS" | tr ',' '\n' | grep -v '^boucle:' | tr '\n' ',' | sed 's/,$//')
              # Idempotence: skip the PUT when the target labels are already set
              # (GitLab records a Resource Label Event on every PUT, even no-ops).
              if ! (echo "$MR_LABELS" | tr ',' '\n' | grep -qx "boucle:review" && echo "$MR_LABELS" | tr ',' '\n' | grep -qx "boucle::status::bot"); then
                glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$MR_ISSUE_IID" \
                  -f labels="${NON_BOUCLE:+$NON_BOUCLE,}boucle:review,boucle::status::bot" > /dev/null
              fi
            fi
            echo "MR !${MR_IID} updated — re-triggering reviewer for issue #$MR_ISSUE_IID"
            curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
              -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
              -F "variables[BOUCLE_ISSUE]=$MR_ISSUE_IID" -F "variables[BOUCLE_ROLE]=reviewer" > /dev/null
            exit 0
            ;;
          close)
            # MR closed (not merged). The semantics depend on the issue's
            # current boucle label (issue #34):
            #   - terminal (done, human): the loop considers this issue
            #     settled; a close webhook is a no-op.
            #   - approval: the user closed the MR without merging while
            #     awaiting approval — a human decision, escalate to
            #     boucle:human rather than restarting the worker.
            #   - any other state (todo, working, review, merging, …): a
            #     real rejection — revert to boucle:todo and re-trigger
            #     the worker with feedback.
            MR_LABELS=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$MR_ISSUE_IID" | jq -r '.labels | join(",")')
            CURRENT_BOUCLE=$(echo "$MR_LABELS" | tr ',' '\n' | grep -E '^boucle:(triage|needs-info|spec-review|todo|working|review|approval|merging|done|human|split|blocked)$' | head -1)
            case "$CURRENT_BOUCLE" in
              boucle:done|boucle:human)
                echo "boucle: issue #$MR_ISSUE_IID is already at $CURRENT_BOUCLE (terminal) — close webhook ignored"
                exit 0
                ;;
              boucle:approval)
                # User closed the MR without merging while it was awaiting
                # approval. This is a human decision, not a rejection to
                # redo. Escalate to human instead of restarting the worker
                # loop (issue #34).
                echo "boucle: MR !${MR_IID} closed while at $CURRENT_BOUCLE — escalating to boucle:human (user decision)"
                NON_BOUCLE_HUMAN=$(echo "$MR_LABELS" | tr ',' '\n' | grep -v '^boucle:' | tr '\n' ',' | sed 's/,$//')
                HUMAN_LABELS="${NON_BOUCLE_HUMAN:+$NON_BOUCLE_HUMAN,}boucle:human,boucle::status::human"
                # Idempotence: skip the PUT when the target labels are already
                # set (GitLab records a Resource Label Event on every PUT,
                # even no-ops).
                if ! (echo "$MR_LABELS" | tr ',' '\n' | grep -qx "boucle:human" && echo "$MR_LABELS" | tr ',' '\n' | grep -qx "boucle::status::human"); then
                  glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$MR_ISSUE_IID" \
                    -f "labels=$HUMAN_LABELS" >/dev/null 2>&1 || true
                fi
                glab api --hostname $BOUCLE_FORGE_HOST --method POST "/projects/$CI_PROJECT_ID/issues/$MR_ISSUE_IID/notes" \
                  -f "body=:warning: MR !${MR_IID} was closed while awaiting approval. Escalated to **boucle:human** (user decision, not auto-redo)." >/dev/null 2>&1 || true
                exit 0
                ;;
            esac
            # Legitimate rejection: revert the issue to boucle:todo so the
            # worker re-runs and produces a new MR addressing the rejection
            # feedback. Preserve non-boucle labels.
            echo "MR !${MR_IID} closed (rejected) — reverting issue #$MR_ISSUE_IID to boucle:todo for worker re-run"
            NON_BOUCLE=$(echo "$MR_LABELS" | tr ',' '\n' | grep -v '^boucle:' | tr '\n' ',' | sed 's/,$//')
            # Idempotence: skip the PUT when the target labels are already set
            # (GitLab records a Resource Label Event on every PUT, even no-ops).
            if ! (echo "$MR_LABELS" | tr ',' '\n' | grep -qx "boucle:todo" && echo "$MR_LABELS" | tr ',' '\n' | grep -qx "boucle::status::bot"); then
              glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$MR_ISSUE_IID" \
                -f labels="${NON_BOUCLE:+$NON_BOUCLE,}boucle:todo,boucle::status::bot" > /dev/null
            fi
            curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
              -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
              -F "variables[BOUCLE_ISSUE]=$MR_ISSUE_IID" -F "variables[BOUCLE_ROLE]=worker" > /dev/null
            exit 0
            ;;
          reopen)
            # MR reopened — re-trigger the reviewer to re-review it.
            echo "MR !${MR_IID} reopened — re-triggering reviewer for issue #$MR_ISSUE_IID"
            curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
              -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
              -F "variables[BOUCLE_ISSUE]=$MR_ISSUE_IID" -F "variables[BOUCLE_ROLE]=reviewer" > /dev/null
            exit 0
            ;;
          unapproved)
            # Author revoked approval — revert to boucle:review and re-trigger
            # the reviewer so the MR gets re-reviewed before re-approval.
            echo "MR !${MR_IID} unapproved — reverting issue #$MR_ISSUE_IID to boucle:review"
            MR_LABELS=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$MR_ISSUE_IID" | jq -r '.labels | join(",")')
            NON_BOUCLE=$(echo "$MR_LABELS" | tr ',' '\n' | grep -v '^boucle:' | tr '\n' ',' | sed 's/,$//')
            # Idempotence: skip the PUT when the target labels are already set
            # (GitLab records a Resource Label Event on every PUT, even no-ops).
            if ! (echo "$MR_LABELS" | tr ',' '\n' | grep -qx "boucle:review" && echo "$MR_LABELS" | tr ',' '\n' | grep -qx "boucle::status::bot"); then
              glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$MR_ISSUE_IID" \
                -f labels="${NON_BOUCLE:+$NON_BOUCLE,}boucle:review,boucle::status::bot" > /dev/null
            fi
            curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
              -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
              -F "variables[BOUCLE_ISSUE]=$MR_ISSUE_IID" -F "variables[BOUCLE_ROLE]=reviewer" > /dev/null
            exit 0
            ;;
          merge)
            # A boucle/<iid> MR was merged directly (human clicked Merge in the
            # GitLab UI, bypassing the approval circuit → merger job). The
            # push to master already triggered deploy → smoke e2e (no issue
            # context). Catch up: trigger the catchup job to close the issue
            # + cascade the parent, so it doesn't stay stuck at boucle:approval.
            # MR_ISSUE_IID was extracted from the branch name above (line 173);
            # non-boucle branches already exited at line 174-176.
            echo "MR !${MR_IID} merged directly (action=merge) for issue #$MR_ISSUE_IID — triggering catchup"
            curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
              -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
              -F "variables[BOUCLE_ISSUE]=$MR_ISSUE_IID" \
              -F "variables[BOUCLE_ROLE]=catchup" > /dev/null
            exit 0
            ;;
          open)
            # open: the worker creates the MR and chains to reviewer itself —
            # no dispatch action needed.
            echo "MR !${MR_IID} action=$MR_ACTION — handled by worker, skipping"
            exit 0
            ;;
          *)
            echo "MR !${MR_IID} action=$MR_ACTION — not handled, skipping"
            exit 0
            ;;
        esac
      fi

      # For note events, .object_attributes.iid is the note's DB id, not the issue IID.
      # The issue IID lives in the sibling key: .issue.iid (classic issues),
      # .work_item.iid (work items), or .epic.iid (epics).
      # Notes on a MR live in .merge_request.iid — handled separately below.
      if [ "$OBJECT_KIND" = "note" ] || [ "$OBJECT_KIND" = "emoji" ]; then
        # Skip system notes (assignee changes, label changes, branch
        # additions, status changes). GitLab fires a note webhook with
        # .object_attributes.system = true for these. They are NOT human
        # replies and must not trigger the loop — otherwise creating an
        # issue + assigning the bot in the same form fires BOTH an `issue`
        # webhook (open → triage) AND a `note` webhook (system "assigned
        # to @up-bot" → triage again), double-triggering triage. The
        # BOT_JUST_ASSIGNED path already handles assignment via the issue
        # update webhook, so the system note is pure redundancy. Emoji
        # events have no `system` field and are unaffected.
        if [ "$OBJECT_KIND" = "note" ]; then
          NOTE_SYSTEM=$(jq -r '.object_attributes.system // false' "$TRIGGER_PAYLOAD" 2>/dev/null)
          if [ "$NOTE_SYSTEM" = "true" ]; then
            echo "System note (non-human) — skipping"
            exit 0
          fi
        fi
        # ── Notes on a MR: human comment → re-trigger worker with feedback ──
        # When a human comments on a boucle MR, they're reviewing it and
        # providing feedback. Re-trigger the worker so it re-runs and can
        # address the comments. Bot notes are filtered by the ACTOR guard.
        MR_NOTE_IID=$(jq -r '.merge_request.iid // empty' "$TRIGGER_PAYLOAD")
        if [ -n "$MR_NOTE_IID" ] && [ "$OBJECT_KIND" = "note" ]; then
          MR_NOTE_SOURCE_BRANCH=$(jq -r '.merge_request.source_branch // empty' "$TRIGGER_PAYLOAD")
          MR_NOTE_ISSUE_IID=$(printf '%s' "$MR_NOTE_SOURCE_BRANCH" | sed -n 's/^boucle\/\([0-9]\+\)$/\1/p')
          if [ -z "$MR_NOTE_ISSUE_IID" ]; then
            echo "Note on MR !${MR_NOTE_IID} but source_branch '$MR_NOTE_SOURCE_BRANCH' is not a boucle branch, skipping"
            exit 0
          fi
          echo "Note on MR !${MR_NOTE_IID} (issue #$MR_NOTE_ISSUE_IID) — re-triggering worker with feedback"
          # Revert to boucle:todo so the worker re-runs (preserving non-boucle labels)
          MR_NOTE_LABELS=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$MR_NOTE_ISSUE_IID" | jq -r '.labels | join(",")')
          NON_BOUCLE=$(echo "$MR_NOTE_LABELS" | tr ',' '\n' | grep -v '^boucle:' | tr '\n' ',' | sed 's/,$//')
          # Idempotence: skip the PUT when the target labels are already set
          # (GitLab records a Resource Label Event on every PUT, even no-ops).
          if ! (echo "$MR_NOTE_LABELS" | tr ',' '\n' | grep -qx "boucle:todo" && echo "$MR_NOTE_LABELS" | tr ',' '\n' | grep -qx "boucle::status::bot"); then
            glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$MR_NOTE_ISSUE_IID" \
              -f labels="${NON_BOUCLE:+$NON_BOUCLE,}boucle:todo,boucle::status::bot" > /dev/null
          fi
          curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
            -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
            -F "variables[BOUCLE_ISSUE]=$MR_NOTE_ISSUE_IID" -F "variables[BOUCLE_ROLE]=worker" > /dev/null
          exit 0
        fi
        IID=$(jq -r '.issue.iid // .work_item.iid // .epic.iid // empty' "$TRIGGER_PAYLOAD")
      else
        IID=$(jq -r '.object_attributes.iid // .issue.iid // empty' "$TRIGGER_PAYLOAD")
      fi

      if [ -z "$IID" ]; then
        # Recovery path: allow manual triage trigger via BOUCLE_ISSUE variable
        if [ -n "${BOUCLE_ISSUE:-}" ]; then
          echo "No IID in payload, but BOUCLE_ISSUE=$BOUCLE_ISSUE set via trigger. Using it."
          IID="$BOUCLE_ISSUE"
        else
          echo "No issue IID in payload, skipping"
          exit 0
        fi
      fi

      # Closed-issue guard for issue webhooks (update/note/emoji). A closed
      # issue is terminal — label changes and notes on it must NOT re-trigger
      # the loop, otherwise the dispatch no-ops and the EXIT trap flips the
      # exit 0 to exit 1, producing a cascade of failed pipelines. The one
      # exception is BOT_JUST_ASSIGNED: a human assigning the bot to a closed
      # issue is an explicit re-trigger signal (the human wants to reopen and
      # resume work), so we let that path through and check state there.
      # MR webhooks already have their own guard at lines 307-313.
      if [ "$OBJECT_KIND" != "merge_request" ]; then
        ISSUE_STATE_FOR_GUARD=$(glab api --hostname $BOUCLE_FORGE_HOST --method GET "/projects/$CI_PROJECT_ID/issues/$IID" 2>/dev/null | jq -r '.state // "unknown"' 2>/dev/null || echo "unknown")
        if [ "$ISSUE_STATE_FOR_GUARD" = "closed" ]; then
          # Check if this is a BOT_JUST_ASSIGNED event — if so, let it through
          # (the human explicitly assigned the bot to reopen the issue).
          GUARD_ACTION=$(jq -r '.object_attributes.action // empty' "$TRIGGER_PAYLOAD")
          GUARD_BOT_ASSIGNED=false
          if [ "$OBJECT_KIND" = "issue" ] && [ "$GUARD_ACTION" = "update" ]; then
            if [ -n "${BOUCLE_BOT_ID:-}" ] && [[ "$BOUCLE_BOT_ID" =~ ^[0-9]+$ ]]; then
              GUARD_BOT_IN_CURRENT=$(jq -r --arg bid "$BOUCLE_BOT_ID" '.changes.assignees.current // [] | map(.id | tostring) | index($bid) != null' "$TRIGGER_PAYLOAD" 2>/dev/null)
              GUARD_BOT_IN_PREVIOUS=$(jq -r --arg bid "$BOUCLE_BOT_ID" '.changes.assignees.previous // [] | map(.id | tostring) | index($bid) != null' "$TRIGGER_PAYLOAD" 2>/dev/null)
            else
              GUARD_BOT_IN_CURRENT=$(jq -r '.changes.assignees.current // [] | map(.username) | index("up-bot") != null' "$TRIGGER_PAYLOAD" 2>/dev/null)
              GUARD_BOT_IN_PREVIOUS=$(jq -r '.changes.assignees.previous // [] | map(.username) | index("up-bot") != null' "$TRIGGER_PAYLOAD" 2>/dev/null)
            fi
            if [ "$GUARD_BOT_IN_CURRENT" = "true" ] && [ "$GUARD_BOT_IN_PREVIOUS" != "true" ]; then
              GUARD_BOT_ASSIGNED=true
            fi
          fi
          if [ "$GUARD_BOT_ASSIGNED" != "true" ]; then
            echo "boucle: issue #$IID is closed — skipping $OBJECT_KIND webhook (no-op on closed issue)"
            exit 0
          fi
          echo "boucle: issue #$IID is closed but bot was just assigned — letting through (human re-trigger)"
        fi
      fi

      # Label helper: preserve non-boucle labels when writing a boucle label.
      # The jq filter uses startswith("boucle:") which catches BOTH the detail
      # axis (boucle:triage) AND the gross axis (boucle::status::bot, also
      # starts with "boucle:"), so we strip all boucle-managed labels when
      # writing a new pair. Caller passes detail as $2 and gross as $3.
      set_boucle_label() {
        local iid="$1" new="$2" gross="$3"
        local current resp current_all
        resp=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid")
        if echo "$new" | grep -q "size:"; then
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") or startswith("size:") | not)) | join(",")')
        else
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") | not)) | join(",")')
        fi
        current_all=$(echo "$resp" | jq -r '.labels | join(",")')
        # Idempotence: skip the PUT when every label in "$new,$gross" is already
        # on the issue. GitLab records a Resource Label Event on every PUT even
        # if the label set is unchanged — this guard prevents the no-op writes
        # that surface as spurious "status changes" on the board.
        local all_present=true lbl
        for lbl in $(echo "$new,$gross" | tr ',' ' '); do
          [ -z "$lbl" ] && continue
          echo "$current_all" | tr ',' '\n' | grep -qx "$lbl" || { all_present=false; break; }
        done
        [ "$all_present" = true ] && return 0
        local merged="${current:+$current,}$new,$gross"
        glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$iid" -f labels="$merged" > /dev/null
        # When the issue moves to the bot side, assign it to the bot user so
        # the board reflects who owns the next action and humans aren't spammed.
        # BOUCLE_BOT_ID is the GitLab user ID of the bot (set via bin/setup).
        # Best-effort: skip silently if unset (backward compat with setups
        # that haven't run bin/setup --bot-id yet).
        if [ "$gross" = "boucle::status::bot" ] && [ -n "${BOUCLE_BOT_ID:-}" ]; then
          curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$iid" \
            --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
            --data-urlencode "assignee_ids[]=$BOUCLE_BOT_ID" 2>/dev/null || true
        fi
      }

      # Get current labels
      LABELS=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$IID" | jq -r '.labels | join(",")')

      # Resolve: issue opened, body edited in triage/needs-info/todo, or author reply on needs-info
      ACTION=$(jq -r '.object_attributes.action // empty' "$TRIGGER_PAYLOAD")

      # Parent issue split into sub-issues — waiting for them to close.
      # Do not re-triage or re-work; the doctor closes it when sub-issues complete.
      if echo "$LABELS" | grep -q "boucle:split"; then
        echo "Issue #$IID has boucle:split — waiting for sub-issues, skipping"
        exit 0
      fi

      # Emoji reactions that count as spec approval (GitLab internal alpha codes).
      # Skin-tone modifiers are ignored — GitLab stores the base name regardless.
      BOUCLE_SPEC_APPROVAL_EMOJIS="thumbsup|white_check_mark|ballot_box_with_check|heavy_check_mark|ok|ok_hand"

      # Detect if the bot was just assigned to this issue (update action with
      # an assignee change). This lets a human trigger boucle by assigning the
      # issue to the bot, without needing to add a boucle: label. The ACTOR
      # guard above already filters bot-originated events, so this only fires
      # when a HUMAN assigns the bot — no loop risk.
      BOT_JUST_ASSIGNED=false
      if [ "$OBJECT_KIND" = "issue" ] && [ "$ACTION" = "update" ]; then
        if [ -n "${BOUCLE_BOT_ID:-}" ] && [[ "$BOUCLE_BOT_ID" =~ ^[0-9]+$ ]]; then
          BOT_IN_CURRENT=$(jq -r --arg bid "$BOUCLE_BOT_ID" '.changes.assignees.current // [] | map(.id | tostring) | index($bid) != null' "$TRIGGER_PAYLOAD" 2>/dev/null)
          BOT_IN_PREVIOUS=$(jq -r --arg bid "$BOUCLE_BOT_ID" '.changes.assignees.previous // [] | map(.id | tostring) | index($bid) != null' "$TRIGGER_PAYLOAD" 2>/dev/null)
        else
          # Fallback: detect by bot username "up-bot" when BOUCLE_BOT_ID is unset
          BOT_IN_CURRENT=$(jq -r '.changes.assignees.current // [] | map(.username) | index("up-bot") != null' "$TRIGGER_PAYLOAD" 2>/dev/null)
          BOT_IN_PREVIOUS=$(jq -r '.changes.assignees.previous // [] | map(.username) | index("up-bot") != null' "$TRIGGER_PAYLOAD" 2>/dev/null)
        fi
        if [ "$BOT_IN_CURRENT" = "true" ] && [ "$BOT_IN_PREVIOUS" != "true" ]; then
          BOT_JUST_ASSIGNED=true
          echo "Issue #$IID: bot was just assigned — will trigger triage"
        fi
      fi

      # If the bot was just assigned by a human, trigger triage — unless the
      # loop is already actively processing or has finished this issue. Active
      # states (working/review/approval/merging) and terminal states (done/split)
      # are skipped to avoid disrupting in-progress work. This takes precedence
      # over label-based routing so assigning the bot works from ANY idle state
      # (boucle:human, boucle:needs-info without reply, unlabeled, etc.).
      if [ "$BOT_JUST_ASSIGNED" = "true" ]; then
        if echo "$LABELS" | grep -qE 'boucle:(working|review|approval|merging|done)'; then
          echo "Issue #$IID: bot assigned but issue is at an active/terminal boucle state ($LABELS) — skipping"
          exit 0
        fi
        echo "Issue #$IID: bot assigned by human — triggering triage"
        echo "$IID" > .boucle-issue
        if ! echo "$LABELS" | grep -q "boucle:triage"; then
          set_boucle_label "$IID" "boucle:triage" "boucle::status::bot"
        fi
        # Skip the label-based routing below — triage is already triggered.
        # The triage job (needs: dispatch, optional) picks up .boucle-issue.
        exit 0
      fi

      SHOULD_TRIAGE=false
      SHOULD_WORK=false
      if echo "$LABELS" | grep -q "boucle:triage"; then
        SHOULD_TRIAGE=true
      elif echo "$LABELS" | grep -q "boucle:needs-info"; then
        # Check if author replied (note event by non-bot)
        if [ "$OBJECT_KIND" = "note" ] && [ "$ACTOR" != "up-bot" ]; then
          SHOULD_TRIAGE=true
        fi
      elif echo "$LABELS" | grep -q "boucle:todo"; then
        # If boucle:todo was just added (by triage), triage already triggered
        # the worker — skip to avoid a duplicate worker pipeline. Detect by
        # checking whether boucle:todo was in the previous labels (before
        # this webhook event). If it was already there, this is a re-trigger
        # (body edit, note, manual label toggle) → trigger worker directly.
        PREV_LABELS=$(jq -r '.changes.labels.previous // [] | join(",")' "$TRIGGER_PAYLOAD" 2>/dev/null)
        if echo "$PREV_LABELS" | grep -q "boucle:todo"; then
          SHOULD_WORK=true
        else
          echo "boucle:todo just added (likely by triage) — worker already triggered, skipping"
          exit 0
        fi
      elif echo "$LABELS" | grep -q "boucle:spec-review"; then
        # Author approved the spec (added a non-bot note to an issue that
        # was at boucle:spec-review). The boucle:spec-approved label was
        # removed — authors now approve by replying instead. Trigger the
        # worker — it will relabel to boucle:working (replacing all boucle:
        # labels, including the stale boucle:spec-review). We do NOT strip
        # boucle:spec-review here.
        if [ "$OBJECT_KIND" = "note" ] && [ "$ACTOR" != "up-bot" ]; then
          SHOULD_WORK=true
        elif [ "$OBJECT_KIND" = "emoji" ] && [ "$ACTOR" != "up-bot" ]; then
          EMOJI_NAME=$(jq -r '.object_attributes.name // empty' "$TRIGGER_PAYLOAD")
          EMOJI_ACTION=$(jq -r '.object_attributes.action // empty' "$TRIGGER_PAYLOAD")
          AWARDABLE_TYPE=$(jq -r '.object_attributes.awardable_type // empty' "$TRIGGER_PAYLOAD")
          if [ "$EMOJI_ACTION" = "award" ] \
             && [ "$AWARDABLE_TYPE" = "Note" ] \
             && echo "$EMOJI_NAME" | grep -Eq "^($BOUCLE_SPEC_APPROVAL_EMOJIS)$"; then
            SHOULD_WORK=true
          fi
        fi
      elif [ -z "$LABELS" ] || [ "$ACTION" = "open" ]; then
        # New issue with no boucle label → triage
        SHOULD_TRIAGE=true
      fi

      if [ "$SHOULD_TRIAGE" = "true" ]; then
        echo "Triggering triage for issue #$IID"
        # Chain to triage job by writing to a file that downstream jobs read
        echo "$IID" > .boucle-issue
        # Apply boucle:triage + boucle::status::bot if not present (preserving any non-boucle labels)
        if ! echo "$LABELS" | grep -q "boucle:triage"; then
          set_boucle_label "$IID" "boucle:triage" "boucle::status::bot"
        fi
      elif [ "$SHOULD_WORK" = "true" ]; then
        echo "Triggering worker for issue #$IID (boucle:todo re-trigger)"
        curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
          -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
          -F "variables[BOUCLE_ISSUE]=$IID" -F "variables[BOUCLE_ROLE]=worker" > /dev/null
        exit 0
      else
        echo "No action needed for issue #$IID (labels: $LABELS)"
        exit 0
      fi
  artifacts:
    paths:
      - .boucle-issue

# ── Triage ──────────────────────────────────────────────────────────────
triage:
  stage: triage
  # resource_group omitted — BOUCLE_ISSUE not available at pipeline eval time for triage
  needs:
    - job: dispatch
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    # Only run triage on webhook triggers (no BOUCLE_ROLE set).
    # Role-specific chains (worker/reviewer/e2e) set BOUCLE_ROLE and skip triage.
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
    # All other pipeline sources (push, schedule, web, etc.) → skip.
    # See dispatch rules for the rationale (runner pool starvation).
    - when: never
  variables:
    BOUCLE_ITERATION: 1
  script:
    - |
      # Disable pipefail: grep in $(...) exits 1 on no-match, killing the script under set -eo pipefail. Without pipefail, the var is just empty (which we handle).
      set +o pipefail
      # Guard: if dispatch skipped (bot note event, anti-loop), no .boucle-issue artifact
      if [ ! -f .boucle-issue ]; then
        # Recovery path: allow manual triage trigger via BOUCLE_ISSUE variable
        if [ -n "${BOUCLE_ISSUE:-}" ]; then
          echo "No .boucle-issue artifact, but BOUCLE_ISSUE=$BOUCLE_ISSUE set via trigger. Using it."
          IID="$BOUCLE_ISSUE"
        else
          echo "No .boucle-issue artifact (dispatch skipped) and no BOUCLE_ISSUE variable. Nothing to triage."
          exit 0
        fi
      else
        IID=$(cat .boucle-issue)
      fi
      export BOUCLE_ISSUE="$IID"

      # Label helper: preserve non-boucle labels when writing a boucle label.
      # The jq filter uses startswith("boucle:") which catches BOTH the detail
      # axis (boucle:triage) AND the gross axis (boucle::status::bot, also
      # starts with "boucle:"), so we strip all boucle-managed labels when
      # writing a new pair. Caller passes detail as $2 and gross as $3.
      set_boucle_label() {
        local iid="$1" new="$2" gross="$3"
        local current resp current_all
        resp=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid")
        if echo "$new" | grep -q "size:"; then
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") or startswith("size:") | not)) | join(",")')
        else
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") | not)) | join(",")')
        fi
        current_all=$(echo "$resp" | jq -r '.labels | join(",")')
        # Idempotence: skip the PUT when every label in "$new,$gross" is already
        # on the issue. GitLab records a Resource Label Event on every PUT even
        # if the label set is unchanged — this guard prevents the no-op writes
        # that surface as spurious "status changes" on the board.
        local all_present=true lbl
        for lbl in $(echo "$new,$gross" | tr ',' ' '); do
          [ -z "$lbl" ] && continue
          echo "$current_all" | tr ',' '\n' | grep -qx "$lbl" || { all_present=false; break; }
        done
        [ "$all_present" = true ] && return 0
        local merged="${current:+$current,}$new,$gross"
        glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$iid" -f labels="$merged" > /dev/null
        # When the issue moves to the bot side, assign it to the bot user so
        # the board reflects who owns the next action and humans aren't spammed.
        # BOUCLE_BOT_ID is the GitLab user ID of the bot (set via bin/setup).
        # Best-effort: skip silently if unset (backward compat with setups
        # that haven't run bin/setup --bot-id yet).
        if [ "$gross" = "boucle::status::bot" ] && [ -n "${BOUCLE_BOT_ID:-}" ]; then
          curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$iid" \
            --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
            --data-urlencode "assignee_ids[]=$BOUCLE_BOT_ID" 2>/dev/null || true
        fi
      }

      # Resolve the human reporter to notify on NEEDS-INFO. For a sub-issue
      # created by the bot via NEEDS-SPLIT, the issue's own author is up-bot
      # (useless to assign). The human who must answer is the PARENT issue's
      # author. Parse the "## Parent issue\n#N" link from the sub-issue body
      # (same format maybe_close_parent uses) and fetch the parent's author.
      # For a top-level issue, use its own author.
      # NOTE: use printf '%s' (not echo) to feed JSON to jq — echo in some
      # shells (zsh) interprets backslash escapes and corrupts JSON whose
      # description contains literal control characters.
      resolve_reporter_id() {
        local iid="$1" data parent_iid parent_data reporter_id
        data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid" 2>/dev/null) || { echo ""; return; }
        parent_iid=$(printf '%s' "$data" | jq -r '.description // empty' | awk '/^## Parent issue[[:space:]]*$/{f=1;next}/^## /{f=0}f' | grep -oE '#[0-9]+' | head -1 | tr -d '#')
        if [ -n "$parent_iid" ]; then
          parent_data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$parent_iid" 2>/dev/null) || { echo ""; return; }
          reporter_id=$(printf '%s' "$parent_data" | jq -r '.author.id // empty')
        else
          reporter_id=$(printf '%s' "$data" | jq -r '.author.id // empty')
        fi
        echo "$reporter_id"
      }

      # Fetch the global work-item ID for an issue (needed as parent_id for
      # the child-items hierarchy API). Issues and work items share the same
      # IID space since 16.0, so /work_items/:iid works for issues too.
      # Returns empty string on failure (loop must not break).
      # NOTE: glab may exit 0 on HTTP 403 (e.g. when the work_item_rest_api
      # feature flag is disabled) and print the error JSON to stdout, so we
      # validate the response shape rather than rely on the exit code.
      get_work_item_global_id() {
        local iid="$1" wi_data out
        wi_data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/-/work_items/$iid" 2>/dev/null) || { echo ""; return; }
        # Only accept a JSON object that actually has an .id field; anything
        # else (403 error object, empty, non-JSON) is treated as a miss.
        out=$(printf '%s' "$wi_data" | jq -r 'if (type == "object" and has("id")) then .id else empty end' 2>/dev/null)
        printf '%s' "$out"
      }

      # List child work items of a parent. Returns JSON array (empty array on
      # failure). Each child has .iid, .state ("opened"|"closed"), .title.
      # NOTE: glab may exit 0 on HTTP 403 (e.g. when the work_item_rest_api
      # feature flag is disabled) and print the error JSON to stdout. A 403
      # error object like {"message":"403 Forbidden ..."} is a JSON OBJECT,
      # not an array — jq 'length' on an object returns its key count (1),
      # which would falsely trip the idempotency guard. We therefore validate
      # that the response is a JSON ARRAY and return [] otherwise.
      get_work_item_children() {
        local parent_iid="$1" children out
        children=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/-/work_items/$parent_iid/children" 2>/dev/null) || { echo "[]"; return; }
        # Only pass through genuine arrays; coerce anything else (403 error
        # object, empty, non-JSON) to []. Capture jq output so empty input
        # (jq emits nothing, exits 0) still yields [].
        out=$(printf '%s' "$children" | jq -c 'if type == "array" then . else [] end' 2>/dev/null)
        printf '%s' "${out:-[]}"
      }

      # Download attachments uploaded to the issue (capped per BOUCLE_IMAGE_*_BYTES).
      # Makes them available to the triage agent via BOUCLE_ISSUE_ATTACHMENTS.
      ./bin/fetch-issue-attachments || echo "[boucle] WARN: attachment fetch failed — continuing without attachments"

      # Fetch the issue body and export it so the triage agent does not
      # waste steps calling glab issue view / gh issue view (minimax-m3
      # burned 4+ steps on failed fetches before posting its comment).
      export BOUCLE_ISSUE_BODY
      BOUCLE_ISSUE_BODY=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$IID" 2>/dev/null | jq -r '.description // empty' 2>/dev/null || echo "")
      if [ -z "$BOUCLE_ISSUE_BODY" ]; then
        echo "[boucle] WARN: could not fetch issue #$IID body — agent will fall back to glab issue view."
      fi

      # Fetch the issue notes (comments) and export them so the triage
      # agent can see prior triage Questions AND the author's answers.
      # Without this, every re-triage re-asks questions the author already
      # answered (issue #27: 6 repeated triage notes on up/urgence-palestine.fr).
      # GitLab notes API returns newest-first; we reverse to oldest-first
      # and format each note as "[<author>] <body>". We keep ALL notes
      # (including prior triage comments) so the agent can see what it
      # already asked and avoid re-asking. System/internal notes are
      # excluded (type != null). The current run's about-to-be-posted
      # note does not exist yet at fetch time, so it is naturally absent.
      export BOUCLE_ISSUE_NOTES
      BOUCLE_ISSUE_NOTES=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$IID/notes?per_page=100" 2>/dev/null \
        | jq -r '[.[] | select(.system == false or .system == null) | "[\(.author.username // .author.name // "unknown")] \(.body)"] | reverse | .[]' 2>/dev/null || echo "")
      if [ -z "$BOUCLE_ISSUE_NOTES" ]; then
        echo "[boucle] INFO: no prior notes for issue #$IID (first triage run)."
      fi

      # Run the agent. Use `|| rc=$?` to suppress set -e so the script
      # continues to comment parsing even if the agent exits non-zero
      # (step limit, crash, etc.).
      # Record the newest triage note ID BEFORE running the agent, so we can
      # distinguish a NEW triage comment (posted by this run) from OLD ones.
      # Without this, a run where the agent doesn't post a new comment would
      # re-parse the OLD triage comment and re-apply its disposition, causing
      # a label bounce with no new question asked.
      PRE_RUN_TRIAGE_ID=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
        | jq -r '[.[] | select(.body | contains("<!-- boucle:triage")) | select(.body | test("## TL;DR")) | select(.body | test("## Disposition"))] | first | .id // 0')
      rc=0
      ./bin/oc triage || rc=$?
      if [ "$rc" -ne 0 ]; then
        echo "WARN: ./bin/oc triage exited $rc — checking if a triage comment was posted anyway."
      fi

      # Parse the triage comment for Disposition and Size
      # GitLab notes API returns notes newest-first, so `first` = newest.
      # Only consider triage comments NEWER than the one present before this
      # run (PRE_RUN_TRIAGE_ID). If the agent didn't post a new comment, this
      # returns empty, which we handle below by leaving the issue at
      # boucle:triage instead of re-applying the OLD disposition.
      COMMENT=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
        | jq -r --argjson pre "$PRE_RUN_TRIAGE_ID" \
          '[.[] | select(.body | contains("<!-- boucle:triage")) | select(.body | test("## TL;DR")) | select(.body | test("## Disposition")) | select(.id > $pre)] | first | .body // ""')

      # Parse Disposition and Size from their SECTIONS only, not the whole body.
      # Scoping prevents false matches: e.g. "already" in an acceptance criterion
      # contains "ready" and would match a whole-body grep for READY.
      DISPOSITION=$(echo "$COMMENT" | awk '/^## Disposition[[:space:]]*$/{f=1;next}/^## /{f=0}f' | grep -oiE '^(READY|NEEDS-INFO|NEEDS-SPLIT)[[:space:]]*$' | head -1 | tr '[:lower:]' '[:upper:]')
      SIZE=$(echo "$COMMENT" | awk '/^## Classification[[:space:]]*$/{f=1;next}/^## /{f=0}f' | grep -oiE 'Size:[[:space:]]*[SML]' | grep -oiE '[SML][[:space:]]*$' | tr -d '[:space:]' | head -1 | tr '[:lower:]' '[:upper:]')

      # ── Log-scraping fallback (step-limit recovery) ──────────────────
      # If the agent drafted a triage comment but ran out of steps before
      # posting it (DISPOSITION empty), scrape the drafted comment from the
      # agent's stdout log and post it ourselves. The agent's post-early
      # prompt rule should prevent this, but this catches the residual case.
      if [ -z "$DISPOSITION" ]; then
        AGENT_LOG="$CI_PROJECT_DIR/.boucle/$IID/agent-output.log"
        if [ -f "$AGENT_LOG" ]; then
          # Extract the drafted triage comment: from the boucle:triage marker
          # to the end of the fenced block. The agent prints the full comment
          # (often inside a ``` fence) in its stdout when it can't call glab.
          DRAFTED_COMMENT=$(awk '
            /^<!-- boucle:triage v=1 -->/ { found=1 }
            found { print; if (/^## Disposition/) { disp=1 } }
            disp && /^(READY|NEEDS-INFO|NEEDS-SPLIT)[[:space:]]*$/ { exit }
          ' "$AGENT_LOG" 2>/dev/null || echo "")
          # If no boucle:triage found, try the boucle:draft marker (first-pass
          # draft posted early per the post-early rule). Promote it to a
          # triage comment by replacing the draft marker with the triage marker.
          if [ -z "$DRAFTED_COMMENT" ]; then
            DRAFTED_COMMENT=$(awk '
              /^<!-- boucle:draft role=triage -->/ { found=1 }
              found { print; if (/^## Disposition/) { disp=1 } }
              disp && /^(READY|NEEDS-INFO|NEEDS-SPLIT)[[:space:]]*$/ { exit }
            ' "$AGENT_LOG" 2>/dev/null || echo "")
            if [ -n "$DRAFTED_COMMENT" ]; then
              echo "[boucle] WARN: no boucle:triage in log — promoting boucle:draft to triage (step-limit fallback)."
              DRAFTED_COMMENT=$(printf '%s' "$DRAFTED_COMMENT" | sed 's|<!-- boucle:draft role=triage -->|<!-- boucle:triage v=1 -->|')
            fi
          fi
          if [ -n "$DRAFTED_COMMENT" ] && echo "$DRAFTED_COMMENT" | grep -qiE '^## Disposition'; then
            echo "[boucle] Recovering drafted triage comment from agent log (step-limit fallback)."
            # Strip leading/trailing ``` fences if the agent wrapped the comment.
            DRAFTED_COMMENT=$(echo "$DRAFTED_COMMENT" | sed '/^```$/d')
            glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
              -f body="$DRAFTED_COMMENT" > /dev/null 2>&1 || true
            # Re-fetch and re-parse the now-posted comment.
            # Same PRE_RUN_TRIAGE_ID filter: only consider comments newer than
            # the pre-run one (the just-posted fallback comment qualifies).
            COMMENT=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
              | jq -r --argjson pre "$PRE_RUN_TRIAGE_ID" \
                '[.[] | select(.body | contains("<!-- boucle:triage")) | select(.body | test("## TL;DR")) | select(.body | test("## Disposition")) | select(.id > $pre)] | first | .body // ""')
            DISPOSITION=$(echo "$COMMENT" | awk '/^## Disposition[[:space:]]*$/{f=1;next}/^## /{f=0}f' | grep -oiE '^(READY|NEEDS-INFO|NEEDS-SPLIT)[[:space:]]*$' | head -1 | tr '[:lower:]' '[:upper:]')
            SIZE=$(echo "$COMMENT" | awk '/^## Classification[[:space:]]*$/{f=1;next}/^## /{f=0}f' | grep -oiE 'Size:[[:space:]]*[SML]' | grep -oiE '[SML][[:space:]]*$' | tr -d '[:space:]' | head -1 | tr '[:lower:]' '[:upper:]')
            if [ -n "$DISPOSITION" ]; then
              echo "[boucle] Step-limit fallback succeeded: recovered disposition=$DISPOSITION size=${SIZE:-?}."
            else
              echo "[boucle] Step-limit fallback failed: drafted comment had no parsable Disposition."
            fi
          fi
        fi
      fi

      # If no NEW triage comment was posted by this run (agent crashed, hit
      # step limit, or decided no new triage was needed), leave the issue at
      # boucle:triage and exit without changing labels. Re-applying the OLD
      # disposition would bounce the label (e.g. triage→needs-info) with no
      # new question asked — the exact "retour à une review humaine alors
      # qu'aucune question n'est posée" symptom.
      if [ -z "$DISPOSITION" ]; then
        # ── Circuit breaker (silent-failure escalation) ─────────────────
        # bin/oc exits 3 when the agent produced NO posted comment AND NO
        # drafted comment (silent failure — e.g. hit OUTPUT_TOKEN_MAX
        # mid-comment before reaching the glab tool call). If we leave the
        # issue at boucle:triage, the doctor re-triggers it every 10 min
        # and the agent fails identically every time → infinite loop
        # (issue #27 on up/urgence-palestine.fr). Escalate to human instead
        # so a human can investigate. The issue keeps its boucle:triage
        # label for traceability but moves to boucle::status::human.
        if [ "$rc" -eq 3 ]; then
          echo "[boucle] Silent triage failure (bin/oc exit 3) — escalating issue #$IID to human to break doctor re-trigger loop."
          set_boucle_label "$IID" "boucle:human" "boucle::status::human"
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
            -f body=":rotating_light: Triage a échoué en silence (l'agent n'a produit aucun commentaire). Passage en revue humaine pour casser la boucle de re-déclenchement. Voir les logs du job $CI_JOB_URL." > /dev/null 2>&1 || true
          exit 1
        fi
        echo "[boucle] No new triage comment posted by this run — leaving issue #$IID at boucle:triage, no label change."
        exit 0
      fi

      # Collapse duplicate triage comments (agent may post a v2; CI replaces the first).
      ./bin/collapse-duplicate-notes triage "$CI_PROJECT_ID" "$IID" "$PRE_RUN_TRIAGE_ID" "$BOUCLE_FORGE_HOST"

      # Route based on disposition
      case "$DISPOSITION" in
        READY)
          if [ "$SIZE" = "L" ]; then
            set_boucle_label "$IID" "boucle:human,size:l" "boucle::status::human"
          else
            # Spec-validation gate (configurable via BOUCLE_SPEC_PROFILE).
            # Default "product" gates M, skips S. "off" never gates (legacy).
            # "strict" gates all sizes. An unknown profile falls back to "product".
            SPEC_PROFILE="${BOUCLE_SPEC_PROFILE:-product}"
            SHOULD_GATE=false
            case "$SPEC_PROFILE" in
              off) SHOULD_GATE=false ;;
              strict) SHOULD_GATE=true ;;
              product) [ "$SIZE" = "M" ] && SHOULD_GATE=true ;;
              *) echo "WARN: unknown BOUCLE_SPEC_PROFILE '$SPEC_PROFILE' — treating as product"
                 [ "$SIZE" = "M" ] && SHOULD_GATE=true ;;
            esac
            # Do-Not-Disturb: during the configured quiet window the spec gate
            # is auto-validated so the loop runs autonomously up to the MR
            # without contacting the human. See bin/dnd + ARCHITECTURE.md.
            # Two paths flip SHOULD_GATE=false:
            #   1. boucle:autonomous label on the issue (per-issue opt-in,
            #      applied at creation — takes precedence, intentional).
            #   2. DND window active (time-based, global).
            AUTONOMOUS=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$IID" 2>/dev/null \
              | jq -r '(.labels // []) | map(select(. == "boucle:autonomous")) | length' 2>/dev/null || echo 0)
            if [ "$SHOULD_GATE" = "true" ] && [ "${AUTONOMOUS:-0}" -gt 0 ] 2>/dev/null; then
              echo "[boucle] 🤖 Issue flagged autonomous — auto-validating spec gate for #$IID"
              SHOULD_GATE=false
              glab api --hostname $BOUCLE_FORGE_HOST -X POST \
                "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
                -f body="🤖 **Issue flaguée autonome** — spec auto-validé. La boucle continue jusqu'à la MR sans contact humain." \
                > /dev/null 2>&1 || true
            fi
            if [ "$SHOULD_GATE" = "true" ] && ./bin/dnd 2>/dev/null; then
              echo "[boucle] 🌙 DND active — auto-validating spec gate for #$IID"
              SHOULD_GATE=false
              glab api --hostname $BOUCLE_FORGE_HOST -X POST \
                "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
                -f body="🌙 **Do-Not-Disturb actif** — spec auto-validé. La boucle continue jusqu'à la MR sans contact humain." \
                > /dev/null 2>&1 || true
            fi
            if [ "$SHOULD_GATE" = "true" ]; then
              # Pause for author to validate the spec (acceptance criteria) before
              # the worker runs. Assign to the reporter (handles sub-issues via
              # the parent's author — resolve_reporter_id defined above) and post
              # a comment with clear next-action instructions. Do NOT trigger worker.
              set_boucle_label "$IID" "boucle:spec-review" "boucle::status::human"
              AUTHOR_ID=$(resolve_reporter_id "$IID")
              if [ -n "$AUTHOR_ID" ] && [ "$AUTHOR_ID" != "null" ]; then
                curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$IID" \
                  --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
                  --data-urlencode "assignee_ids[]=$AUTHOR_ID"
              fi
              # Append validation instructions to the triage comment itself so
              # the human has ONE message to read/approve (instead of a separate
              # note). Falls back to a standalone POST if the triage note cannot
              # be resolved or the PUT fails — approval detection tolerates both
              # shapes (doctor polls "React with" across all notes).
              SPEC_MSG=$(printf '## Validation\n\nReview the **TL;DR** above. If it matches what you want:\n- React with 👍 ✅ ☑️ ✔️ 🆗 or 👌 on this comment to approve, OR\n- Reply to this issue with any comment.\nIf not, reply with corrections.')
              TRIAGE_NOTE_ID=$(glab api --hostname "$BOUCLE_FORGE_HOST" \
                "/projects/$CI_PROJECT_ID/issues/$IID/notes" 2>/dev/null \
                | jq -r '[.[] | select(.body | contains("<!-- boucle:triage") and contains("## TL;DR") and contains("## Disposition"))]
                    | sort_by(.created_at) | last | .id' 2>/dev/null || echo "")
              SPEC_MSG_APPENDED=false
              if [ -n "$TRIAGE_NOTE_ID" ]; then
                EXISTING_BODY=$(glab api --hostname "$BOUCLE_FORGE_HOST" \
                  "/projects/$CI_PROJECT_ID/issues/$IID/notes/$TRIAGE_NOTE_ID" 2>/dev/null \
                  | jq -r '.body' 2>/dev/null)
                # Idempotency guard: skip if the validation section is already
                # present (re-runs of triage on the same issue).
                if [ -n "$EXISTING_BODY" ] && ! echo "$EXISTING_BODY" | grep -q "## Validation"; then
                  UPDATED_BODY=$(printf '%s\n\n%s' "$EXISTING_BODY" "$SPEC_MSG")
                  if glab api --hostname "$BOUCLE_FORGE_HOST" -X PUT \
                    "/projects/$CI_PROJECT_ID/issues/$IID/notes/$TRIAGE_NOTE_ID" \
                    -f body="$UPDATED_BODY" > /dev/null 2>&1; then
                    SPEC_MSG_APPENDED=true
                  fi
                elif [ -n "$EXISTING_BODY" ]; then
                  SPEC_MSG_APPENDED=true
                fi
              fi
              if [ "$SPEC_MSG_APPENDED" != "true" ]; then
                glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
                  -f body="$SPEC_MSG" > /dev/null
              fi
            else
              set_boucle_label "$IID" "boucle:todo,size:$(echo $SIZE | tr '[:upper:]' '[:lower:]')" "boucle::status::bot"
              # Concurrency cap: defer worker trigger if too many issues are already working.
              MAX_PARALLEL="${BOUCLE_MAX_PARALLEL_ISSUES:-0}"
              WORKING_COUNT=0
              if [ "$MAX_PARALLEL" -gt 0 ] 2>/dev/null; then
                WORKING_COUNT=$(glab api --hostname "$BOUCLE_FORGE_HOST" "/projects/$CI_PROJECT_ID/issues?state=opened&labels=boucle:working&per_page=100" 2>/dev/null | jq 'length' 2>/dev/null || echo 0)
                if [ "$WORKING_COUNT" -ge "$MAX_PARALLEL" ]; then
                  echo "[boucle] Max parallel issues ($MAX_PARALLEL) reached — $WORKING_COUNT already working. Deferring #$IID (stays at boucle:todo, doctor will re-trigger when a slot frees)."
                  glab api --hostname "$BOUCLE_FORGE_HOST" -X POST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
                    -f body="⏳ Worker deferred — $WORKING_COUNT issues already in progress (cap: $MAX_PARALLEL). Will start automatically when a slot frees up." > /dev/null 2>&1 || true
                  # Do NOT chain to worker — leave at boucle:todo. Doctor recovers it.
                else
                  # Chain to worker
                  curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
                    -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
                    -F "variables[BOUCLE_ISSUE]=$IID" -F "variables[BOUCLE_ROLE]=worker" > /dev/null
                fi
              else
                # Chain to worker (cap disabled)
                curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
                  -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
                  -F "variables[BOUCLE_ISSUE]=$IID" -F "variables[BOUCLE_ROLE]=worker" > /dev/null
              fi
            fi
          fi

          # ── Aperçu visuel (systematic for UI/UX issues) ────────────────
          # Fires for ALL READY dispositions (Size S/M/L, gated or not).
          # The triage agent writes RENDER_REQUEST + preview.html for
          # UI/UX issues (mandatory per triage.md). Non-UI/UX issues have
          # no RENDER_REQUEST → block is a no-op (zero Chromium cost).
          # Failure is isolated: fallback note, never blocks the loop.
          # Idempotent: RENDER_REQUEST deleted after successful embed.
          PREVIEW_HTML="$CI_PROJECT_DIR/.boucle/$IID/preview.html"
          RENDER_REQUEST_FILE="$CI_PROJECT_DIR/.boucle/$IID/RENDER_REQUEST"

          if [ "${BOUCLE_PREVIEW_DISABLE:-false}" != "true" ] && [ -s "$RENDER_REQUEST_FILE" ] && [ -s "$PREVIEW_HTML" ]; then
            echo "[boucle] RENDER_REQUEST found — attempting visual preview"

            # 1. Resolve the triage comment note_id (separate fetch so we
            #    don't disturb the existing comment parse).
            TRIAGE_NOTE_ID=$(glab api --hostname "$BOUCLE_FORGE_HOST" \
              "/projects/$CI_PROJECT_ID/issues/$IID/notes" 2>/dev/null \
              | jq -r '[.[] | select(.body | contains("<!-- boucle:triage") and contains("## TL;DR") and contains("## Disposition"))]
                  | sort_by(.created_at) | last | .id' 2>/dev/null || echo "")

            if [ -z "$TRIAGE_NOTE_ID" ]; then
              echo "[boucle] WARN: triage comment not found — cannot embed preview"
            else
              # 2. Install Chromium + puppeteer-core (only now, in /tmp).
              if npm install --prefix /tmp puppeteer-core @sparticuz/chromium >/dev/null 2>&1; then
                # 3. Render preview.html → preview.png (1280x800, fullPage).
                #    NODE_PATH=/tmp/node_modules so the script (bin/) resolves
                #    the modules installed in /tmp.
                PREVIEW_PNG="$CI_PROJECT_DIR/.boucle/$IID/preview.png"
                if NODE_PATH=/tmp/node_modules node "$CI_PROJECT_DIR/bin/render-preview.cjs" "$PREVIEW_HTML" "$PREVIEW_PNG" 2>/dev/null; then
                  # 4. Upload the PNG via the GitLab uploads API.
                  UPLOAD_RESP=$(curl -s --request POST \
                    --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
                    --form "file=@$PREVIEW_PNG" \
                    "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/uploads" 2>/dev/null)
                  IMG_URL=$(echo "$UPLOAD_RESP" | jq -r '.markdown // empty' 2>/dev/null)

                  if [ -n "$IMG_URL" ]; then
                    # 5. Fetch the existing comment, append Aperçu section, PUT.
                    #    Guard: if EXISTING_BODY is empty (fetch failed), do NOT
                    #    PUT — otherwise we overwrite the entire triage comment
                    #    (losing the boucle:triage marker + criteria + disposition).
                    EXISTING_BODY=$(glab api --hostname "$BOUCLE_FORGE_HOST" \
                      "/projects/$CI_PROJECT_ID/issues/$IID/notes/$TRIAGE_NOTE_ID" 2>/dev/null \
                      | jq -r '.body' 2>/dev/null)
                    if [ -n "$EXISTING_BODY" ]; then
                      NEW_BODY=$(printf '%s\n\n## Aperçu\n%s\n' "$EXISTING_BODY" "$IMG_URL")
                      if glab api --hostname "$BOUCLE_FORGE_HOST" -X PUT \
                        "/projects/$CI_PROJECT_ID/issues/$IID/notes/$TRIAGE_NOTE_ID" \
                        -f body="$NEW_BODY" >/dev/null 2>&1; then
                        # 6. Idempotence: delete RENDER_REQUEST (no re-render on retry).
                        rm -f "$RENDER_REQUEST_FILE"
                        echo "[boucle] Visual preview embedded in triage comment #$TRIAGE_NOTE_ID"
                      else
                        echo "[boucle] WARN: PUT notes failed — RENDER_REQUEST kept for retry"
                      fi
                    else
                      echo "[boucle] WARN: existing comment body empty — posting fallback note"
                      glab api --hostname "$BOUCLE_FORGE_HOST" -X POST \
                        "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
                        -f body="Aperçu indisponible (échec lecture commentaire) — validez sur le TL;DR." >/dev/null 2>&1
                    fi
                  else
                    echo "[boucle] WARN: PNG upload failed — posting fallback note"
                    glab api --hostname "$BOUCLE_FORGE_HOST" -X POST \
                      "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
                      -f body="Aperçu indisponible (échec upload) — validez sur le TL;DR." >/dev/null 2>&1
                  fi
                else
                  echo "[boucle] WARN: Chromium render failed — posting fallback note"
                  glab api --hostname "$BOUCLE_FORGE_HOST" -X POST \
                    "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
                    -f body="Aperçu indisponible (échec rendu) — validez sur le TL;DR." >/dev/null 2>&1
                fi
              else
                echo "[boucle] WARN: Chromium install failed — posting fallback note"
                glab api --hostname "$BOUCLE_FORGE_HOST" -X POST \
                  "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
                  -f body="Aperçu indisponible (Chromium indisponible) — validez sur le TL;DR." >/dev/null 2>&1
              fi
            fi
          fi
          ;;
        NEEDS-INFO)
          set_boucle_label "$IID" "boucle:needs-info" "boucle::status::human"
          # Assign the issue to its reporter (author) so they're notified
          # and know to answer the blocking questions. For a sub-issue
          # created by the bot via NEEDS-SPLIT, the author is up-bot — so
          # resolve the PARENT issue's author instead (the human who filed
          # the original request). The loop pauses here until the reporter
          # replies, which re-triggers triage.
          AUTHOR_ID=$(resolve_reporter_id "$IID")
          if [ -n "$AUTHOR_ID" ] && [ "$AUTHOR_ID" != "null" ]; then
            # NOTE: glab's `-f "assignee_ids[]=N"` is broken (GitLab rejects
            # the form encoding). Use curl with --data-urlencode instead.
            curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$IID" \
              --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
              --data-urlencode "assignee_ids[]=$AUTHOR_ID"
          fi
          ;;
        NEEDS-SPLIT)
          # Idempotency guard: if the parent already has children via the
          # work-items hierarchy API, the split was already done — skip to
          # avoid duplicate sub-issues. Fall back to the legacy split-parent
          # marker comment for data produced by older boucle versions.
          CHILDREN_COUNT=$(get_work_item_children "$IID" | jq 'length' 2>/dev/null || echo 0)
          if [ "${CHILDREN_COUNT:-0}" -gt 0 ]; then
            echo "Parent #$IID already has $CHILDREN_COUNT child work item(s) — skipping split (idempotency guard)"
            exit 0
          fi
          # Legacy fallback: check for the old split-parent marker comment
          EXISTING_SPLIT=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
            | jq -r '[.[] | select(.body | contains("<!-- boucle:split-parent"))] | length' 2>/dev/null || echo 0)
          if [ "${EXISTING_SPLIT:-0}" -gt 0 ]; then
            echo "Parent #$IID already has a legacy boucle:split-parent marker — skipping split (idempotency guard)"
            exit 0
          fi
          # Parse sub-issues from the triage comment. Format:
          #   ## Sub-issues
          #   <!-- boucle:sub-issue v=1 -->
          #   ### Sub-issue 1: <title>
          #   <body...>
          #   Size: S | M
          #   ### Sub-issue 2: ...
          SUBISSUES_SECTION=$(echo "$COMMENT" | sed -n '/^## Sub-issues/,/^## /p' | sed -e '${/^## /d}')
          # If the selected comment has no Sub-issues section, the agent may have
          # posted a truncated duplicate. Search ALL triage comments (newest-first)
          # for one that has a parseable Sub-issues section.
          if [ -z "$SUBISSUES_SECTION" ] || ! echo "$SUBISSUES_SECTION" | grep -qE '^### Sub-issue [0-9]+[[:space:]]*:'; then
            echo "Selected triage comment has no Sub-issues section — searching all triage comments..."
            SUBISSUES_SECTION=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
              | jq -r '[.[] | select(.body | contains("<!-- boucle:triage")) | select(.body | test("### Sub-issue [0-9]+[[:space:]]*:"))] | first | .body' \
              | sed -n '/^## Sub-issues/,/^## /p' | sed -e '${/^## /d}')
          fi
          # Skip if still no parseable sub-issues after searching all comments
          if [ -z "$SUBISSUES_SECTION" ] || ! echo "$SUBISSUES_SECTION" | grep -qE '^### Sub-issue [0-9]+[[:space:]]*:'; then
            echo "NEEDS-SPLIT but no parseable sub-issues — falling back to boucle:human"
            set_boucle_label "$IID" "boucle:human" "boucle::status::human"
            glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
              -f body="Triage requested NEEDS-SPLIT but no parseable sub-issues were found in the triage comment. Please split this issue manually." > /dev/null
            exit 0
          fi

          # Extract parent context (title + URL) for the sub-issue body
          PARENT_DATA=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$IID")
          PARENT_TITLE=$(echo "$PARENT_DATA" | jq -r '.title')
          PARENT_URL=$(echo "$PARENT_DATA" | jq -r '.web_url')
          PARENT_IID="$IID"

          CREATED_IIDS=""
          # awk splits the section into records, one per sub-issue.
          # First line of each record is "TITLE:<title>"; following lines are body;
          # last non-empty line should be "Size: X".
          SUBISSUE_COUNT=0
          PARSE_FAILURES=0
          echo "$SUBISSUES_SECTION" | awk '
            BEGIN { rec = 0 }
            /^<!-- boucle:sub-issue/ { next }
            /^### Sub-issue [0-9]+[[:space:]]*:/ {
              if (rec > 0) { print "---END---" }
              rec++
              sub(/^### Sub-issue [0-9]+[[:space:]]*:[[:space:]]*/, "")
              print "TITLE:" $0
              next
            }
            /^## Sub-issues/ { next }
            { print }
            END { if (rec > 0) print "---END---" }
          ' > /tmp/subissues.parsed

          while IFS= read -r line; do
            if [ "$line" = "---END---" ]; then
              # Finalize the current sub-issue
              if [ -n "$CUR_TITLE" ]; then
                # Strip the Size: line from the body
                CUR_BODY_NO_SIZE=$(echo "$CUR_BODY" | sed '/^Size:[[:space:]]*[SML]/d')
                # Default size to M if not present
                CUR_SIZE="${CUR_SIZE_RAW:-M}"
                # Validate: if "- [ ]" appears mid-line (not at start), newlines
                # were stripped — the agent posted a single-line body that won't
                # render as markdown. Skip creation so we fall back to human
                # instead of shipping an unrenderable sub-issue.
                if echo "$CUR_BODY_NO_SIZE" | grep -qE '[^[:space:]]- \[ \]'; then
                  echo "WARN: sub-issue '$CUR_TITLE' has checkbox markers not at line start (newlines stripped) — skipping creation"
                  PARSE_FAILURES=$((PARSE_FAILURES + 1))
                else
                # Build the sub-issue body with parent reference (single-line to keep YAML literal block happy)
                SUB_BODY=$(printf 'Split from #%s (%s).\n\n%s\n\n## Parent issue\n#%s — %s' "$PARENT_IID" "$PARENT_TITLE" "$CUR_BODY_NO_SIZE" "$PARENT_IID" "$PARENT_URL")
                SUB_SIZE_LOWER=$(echo "$CUR_SIZE" | tr '[:upper:]' '[:lower:]')
                # Validate: only S or M
                if [ "$CUR_SIZE" != "S" ] && [ "$CUR_SIZE" != "M" ]; then
                  echo "WARN: sub-issue '$CUR_TITLE' has size '$CUR_SIZE' (not S/M) — defaulting to M"
                  CUR_SIZE="M"
                  SUB_SIZE_LOWER="m"
                fi
                echo "Creating sub-issue: $CUR_TITLE (Size: $CUR_SIZE)"
                CREATED_JSON=$(glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues" \
                  -f title="$CUR_TITLE" \
                  -f description="$SUB_BODY" \
                  -f labels="boucle:triage,boucle::status::bot,size:$SUB_SIZE_LOWER" 2>/dev/null) || CREATED_JSON=""
                NEW_IID=$(echo "$CREATED_JSON" | jq -r '.iid // empty' 2>/dev/null || true)
                if [ -n "$NEW_IID" ] && [ "$NEW_IID" != "null" ]; then
                  CREATED_IIDS="${CREATED_IIDS:+$CREATED_IIDS,}$NEW_IID"
                  SUBISSUE_COUNT=$((SUBISSUE_COUNT + 1))
                  echo "  → created #$NEW_IID"
                  # Assign the sub-issue to the bot (it's on the bot side from
                  # creation). Best-effort: skip silently if BOUCLE_BOT_ID unset.
                  if [ -n "${BOUCLE_BOT_ID:-}" ]; then
                    curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$NEW_IID" \
                      --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
                      --data-urlencode "assignee_ids[]=$BOUCLE_BOT_ID" 2>/dev/null || true
                  fi
                  # Set the parent via the work-items hierarchy API (child-items).
                  # This creates the real "Éléments enfants" relationship visible
                  # in the GitLab UI. Requires the parent's GLOBAL work-item ID
                  # (not its project-scoped IID). If the hierarchy API is
                  # unavailable (work_item_rest_api feature flag disabled on
                  # self-managed GitLab), fall back to a REST relates_to issue
                  # link (visible under "Linked items" on the parent). Final
                  # fallback: the ## Parent issue body text provides navigation.
                  PARENT_GLOBAL_ID=$(get_work_item_global_id "$PARENT_IID")
                  HIERARCHY_STATUS=""
                  if [ -n "$PARENT_GLOBAL_ID" ] && [ "$PARENT_GLOBAL_ID" != "null" ]; then
                    HIERARCHY_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
                      "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/-/work_items/$NEW_IID" \
                      --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
                      --header "Content-Type: application/json" \
                      --data "{\"features\":{\"hierarchy\":{\"parent_id\":$PARENT_GLOBAL_ID}}}" 2>/dev/null || echo "000")
                  fi
                  case "$HIERARCHY_STATUS" in
                    2*) : ;; # hierarchy link set — nothing more to do
                    *)
                      echo "  → hierarchy API unavailable (HTTP ${HIERARCHY_STATUS:-no-global-id}) — falling back to relates_to issue link"
                      curl -s -o /dev/null -X POST \
                        "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$PARENT_IID/links" \
                        --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
                        --header "Content-Type: application/json" \
                        --data "{\"target_project_id\":$CI_PROJECT_ID,\"target_issue_iid\":$NEW_IID,\"link_type\":\"relates_to\"}" 2>/dev/null || true
                      ;;
                  esac
                  # Trigger triage directly via trigger API (bot-created issues would
                  # hit the anti-loop guard in dispatch because ACTOR=up-bot).
                  curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
                    -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
                    -F "variables[BOUCLE_ISSUE]=$NEW_IID" > /dev/null
                else
                  echo "  → FAIL to create sub-issue: $CREATED_JSON" >&2
                  PARSE_FAILURES=$((PARSE_FAILURES + 1))
                fi
                fi
              fi
              # Reset for next record
              CUR_TITLE=""
              CUR_BODY=""
              CUR_SIZE_RAW=""
            elif [[ "$line" == TITLE:* ]]; then
              CUR_TITLE="${line#TITLE:}"
              CUR_BODY=""
              CUR_SIZE_RAW=""
            else
              # Append line to body. Direct assignment (not command
              # substitution) preserves the trailing newline: $(...) strips
              # trailing newlines, which would collapse the whole body to a
              # single line and make the mid-line checkbox guard false-positive
              # on "Acceptance criteria:- [ ] ..." (colon is non-space before
              # "- [ ]"). $'\n' keeps the newline literal.
              CUR_BODY="${CUR_BODY}${line}"$'\n'
              # Capture Size: line
              if [[ "$line" =~ ^Size:[[:space:]]*([SML]) ]]; then
                CUR_SIZE_RAW="${BASH_REMATCH[1]}"
              fi
            fi
          done < /tmp/subissues.parsed

          if [ "$SUBISSUE_COUNT" -eq 0 ]; then
            echo "NEEDS-SPLIT but zero sub-issues created — falling back to boucle:human"
            set_boucle_label "$IID" "boucle:human" "boucle::status::human"
            glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
              -f body="Triage requested NEEDS-SPLIT but no sub-issues could be created from the triage comment. Please split this issue manually." > /dev/null
          else
            # Mark the parent boucle:split FIRST so dispatch and doctor stop
            # re-triaging it even if the comment POST below fails. The parent
            # stays open and is closed by maybe_close_parent() (e2e) or the
            # doctor's split-parent cascade when all sub-issues close.
            set_boucle_label "$IID" "boucle:split" "boucle::status::bot"
            # Post ONE merged comment: human-readable sub-issue list + the
            # machine-readable split-parent marker. Merging makes the two
            # atomic (single POST) — a job failure cannot leave a human
            # comment without its marker, which caused duplicate "Split into"
            # comments and duplicate sub-issues on retry. The marker is parsed
            # by maybe_close_parent's legacy fallback path when the work-items
            # hierarchy API is unavailable (feature flag disabled on
            # self-managed GitLab).
            SPLIT_MSG=$(printf 'Split into: #%s.\n\nParent stays open until all sub-issues close. The loop closes this parent automatically when the last sub-issue completes.\n\n<!-- boucle:split-parent iids=%s -->' "$(echo "$CREATED_IIDS" | sed 's/,/, #/g')" "$CREATED_IIDS")
            glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$IID/notes" \
              -f body="$SPLIT_MSG" > /dev/null
            echo "Split parent #$IID into $SUBISSUE_COUNT sub-issue(s): $CREATED_IIDS (parent marked boucle:split)"
            if [ "$PARSE_FAILURES" -gt 0 ]; then
              echo "WARN: $PARSE_FAILURES sub-issue(s) failed to create"
            fi
          fi
          rm -f /tmp/subissues.parsed
          ;;
        *)
          echo "Unparsable disposition: $DISPOSITION → routing to human"
          set_boucle_label "$IID" "boucle:human" "boucle::status::human"
          ;;
      esac

      # Assert: triage comment exists and disposition parsable
      if [ -z "$DISPOSITION" ]; then
        echo "FAIL: disposition not parsable" >&2
        exit 1
      fi
  timeout: 10m

# ── Worker ──────────────────────────────────────────────────────────────
worker:
  stage: work
  resource_group: boucle-issue-$BOUCLE_ISSUE
  needs:
    - job: dispatch
      optional: true
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "worker"
  script:
    - |
      # Disable pipefail: grep in $(...) exits 1 on no-match, killing the script under set -eo pipefail. Without pipefail, the var is just empty (which we handle).
      set +o pipefail
      export BOUCLE_ISSUE="${BOUCLE_ISSUE:?BOUCLE_ISSUE must be set}"
      ITERATION="${BOUCLE_ITERATION:-1}"
      export BOUCLE_ITERATION

      # ── Persist .boucle/<issue>/ across iterations ───────────────────
      # .boucle/ is gitignored (state.md, iterations.md, agent-output.log
      # are NOT committed) and the worker re-triggers itself via the API
      # (new pipeline, no `needs` link → no artifact passing). On a shell
      # executor $CI_PROJECT_DIR may be wiped between runs, so we persist
      # the per-issue state dir to a stable path outside the workspace and
      # restore it here before the job does anything else. Without this,
      # every iteration starts with a fresh seed (state.md = "(to be
      # determined by worker)", iterations.md = absent) and the worker
      # rebuilds context from scratch — exhausting its step budget before
      # implementing (issue #35 on up/urgence-palestine.fr: 2 iterations
      # produced zero code changes because the worker spent all 100 steps
      # re-discovering the codebase and re-reading charter docs).
      BOUCLE_STATE_CACHE="${BOUCLE_STATE_CACHE:-${HOME}/.boucle-state-cache}"
      ISSUE_STATE_CACHE="${BOUCLE_STATE_CACHE}/${BOUCLE_ISSUE}"

      # Persist .boucle/<issue>/ back to the stable cache on job exit (any
      # path: success, no-changes re-trigger, rebase conflict, deploy fail).
      # The trap fires after the script body so it captures the latest state
      # (state.md with filled Approach, iterations.md with the new entry,
      # agent-output.log). Best-effort: never fail the job from the trap.
      save_state_cache() {
        if [ -d ".boucle/$BOUCLE_ISSUE" ]; then
          mkdir -p "$ISSUE_STATE_CACHE"
          cp -a ".boucle/$BOUCLE_ISSUE/." "$ISSUE_STATE_CACHE/" 2>/dev/null || true
        fi
      }
      trap save_state_cache EXIT

      # Label helper: preserve non-boucle labels when writing a boucle label.
      # The jq filter uses startswith("boucle:") which catches BOTH the detail
      # axis (boucle:triage) AND the gross axis (boucle::status::bot, also
      # starts with "boucle:"), so we strip all boucle-managed labels when
      # writing a new pair. Caller passes detail as $2 and gross as $3.
      set_boucle_label() {
        local iid="$1" new="$2" gross="$3"
        local current resp current_all
        resp=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid")
        if echo "$new" | grep -q "size:"; then
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") or startswith("size:") | not)) | join(",")')
        else
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") | not)) | join(",")')
        fi
        current_all=$(echo "$resp" | jq -r '.labels | join(",")')
        # Idempotence: skip the PUT when every label in "$new,$gross" is already
        # on the issue. GitLab records a Resource Label Event on every PUT even
        # if the label set is unchanged — this guard prevents the no-op writes
        # that surface as spurious "status changes" on the board.
        local all_present=true lbl
        for lbl in $(echo "$new,$gross" | tr ',' ' '); do
          [ -z "$lbl" ] && continue
          echo "$current_all" | tr ',' '\n' | grep -qx "$lbl" || { all_present=false; break; }
        done
        [ "$all_present" = true ] && return 0
        local merged="${current:+$current,}$new,$gross"
        glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$iid" -f labels="$merged" > /dev/null
        # When the issue moves to the bot side, assign it to the bot user so
        # the board reflects who owns the next action and humans aren't spammed.
        # BOUCLE_BOT_ID is the GitLab user ID of the bot (set via bin/setup).
        # Best-effort: skip silently if unset (backward compat with setups
        # that haven't run bin/setup --bot-id yet).
        if [ "$gross" = "boucle::status::bot" ] && [ -n "${BOUCLE_BOT_ID:-}" ]; then
          curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$iid" \
            --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
            --data-urlencode "assignee_ids[]=$BOUCLE_BOT_ID" 2>/dev/null || true
        fi
      }

      # Resolve the human reporter (issue author, or parent issue author for
      # sub-issues created via NEEDS-SPLIT). Used to assign the MR to the
      # reporter at creation time so they're notified even if the reviewer
      # never runs (e.g. preview URL assertion fails before reviewer chains).
      # Mirrors the definition in triage/reviewer jobs.
      resolve_reporter_id() {
        local iid="$1" data parent_iid parent_data reporter_id
        data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid" 2>/dev/null) || { echo ""; return; }
        parent_iid=$(printf '%s' "$data" | jq -r '.description // empty' | awk '/^## Parent issue[[:space:]]*$/{f=1;next}/^## /{f=0}f' | grep -oE '#[0-9]+' | head -1 | tr -d '#')
        if [ -n "$parent_iid" ]; then
          parent_data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$parent_iid" 2>/dev/null) || { echo ""; return; }
          reporter_id=$(printf '%s' "$parent_data" | jq -r '.author.id // empty')
        else
          reporter_id=$(printf '%s' "$data" | jq -r '.author.id // empty')
        fi
        echo "$reporter_id"
      }

      # Closed-issue guard: if the issue was closed (e.g. by catchup after a
      # human merged the MR directly), the worker MUST NOT re-run — it would
      # create a zombie MR on a closed issue, and the reviewer FAIL handler
      # would keep re-triggering the worker on the corpse forever (the doctor
      # can't recover it because it filters state=opened). Exit 0 so the
      # resource_group releases and no spurious failure is recorded.
      WORKER_ISSUE_STATE=$(glab api --hostname $BOUCLE_FORGE_HOST --method GET "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE" 2>/dev/null | jq -r '.state // "unknown"' 2>/dev/null || echo "unknown")
      if [ "$WORKER_ISSUE_STATE" = "closed" ]; then
        echo "boucle: issue #$BOUCLE_ISSUE is closed — worker cannot run on a closed issue (no-op)"
        exit 0
      fi

      # Set working label
      set_boucle_label "$BOUCLE_ISSUE" "boucle:working" "boucle::status::bot"

      # Fetch latest master so the branch is based on current master, not the
      # stale CI clone (master may have advanced between clone and this job).
      git fetch origin master

      # Create/checkout branch (stable name — iteration 2+ reuses the branch).
      # Preserve prior worker commits across iterations: rebase onto
      # origin/master instead of wiping. Without this, a reviewer FAIL on a
      # stale preview (not on the code) forces the next worker to re-implement
      # from scratch — 50 steps is not enough to rebuild a complex feature
      # (issue #35 on up/urgence-palestine.fr: commit 6ca8aa33 with the full
      # FeaturedFeed.astro implementation was wiped by reset --hard, the next
      # worker exhausted its step budget reconstituting context and produced
      # zero code changes). If the branch has worker commits (diff vs
      # origin/master is non-empty), rebase to incorporate master updates while
      # keeping the work. If the rebase conflicts or the branch has no worker
      # commits, reset to origin/master (clean slate).
      BRANCH="boucle/$BOUCLE_ISSUE"
      if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
        git checkout "$BRANCH"
        if git log --oneline origin/master.."$BRANCH" 2>/dev/null | grep -q .; then
          echo "[boucle] Branch has prior worker commits — rebasing onto origin/master to preserve work."
          if ! git rebase origin/master; then
            echo "[boucle] Rebase conflicted — resetting to origin/master (prior work lost)."
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/master
          fi
        else
          git reset --hard origin/master
        fi
      else
        git checkout -b "$BRANCH"
      fi

      # Restore .boucle/<issue>/ from the stable cache AFTER checkout.
      # MUST be after `git checkout`/`git reset` — otherwise the cp -a creates
      # local modifications to tracked .boucle/ files (some repos have .boucle/
      # tracked despite .gitignore) and `git checkout` refuses to overwrite
      # them, failing the worker with "Your local changes would be overwritten".
      # After checkout, .boucle/ is either absent (untracked, gitignored) or
      # at the master version (tracked) — either way, cp -a overwrites safely.
      if [ -d "$ISSUE_STATE_CACHE" ]; then
        echo "[boucle] Restoring .boucle/$BOUCLE_ISSUE/ from $ISSUE_STATE_CACHE"
        mkdir -p ".boucle/$BOUCLE_ISSUE"
        cp -a "$ISSUE_STATE_CACHE/." ".boucle/$BOUCLE_ISSUE/" 2>/dev/null || true
      fi

      # Configure git credentials for push
      git config user.email "bot@ankaboot.dev"
      git config user.name "up-bot"
      git remote set-url origin "https://up-bot:${BOUCLE_TOKEN}@${BOUCLE_FORGE_HOST}/${CI_PROJECT_PATH}.git"

      # Seed state.md on first run
      if [ ! -f ".boucle/$BOUCLE_ISSUE/state.md" ]; then
        mkdir -p ".boucle/$BOUCLE_ISSUE"
        # Seed from triage comment
        TRIAGE_COMMENT=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
          | jq -r '[.[] | select(.body | contains("<!-- boucle:triage"))] | first | .body')
        cat > ".boucle/$BOUCLE_ISSUE/state.md" << EOF
      # Issue #$BOUCLE_ISSUE

      ## Goal
      $(echo "$TRIAGE_COMMENT" | sed -n '/^## Analysis/,/^## /p' | head -n -1 | tail -n +2)

      ## Acceptance criteria
      $(echo "$TRIAGE_COMMENT" | sed -n '/^## Draft acceptance criteria/,/^## /p' | head -n -1 | tail -n +2)

      ## Approach
      (to be determined by worker)

      ## Tried and rejected
      (none yet)

      ## Awaiting human
      nothing
      EOF
      fi

      # Seed iterations.md on first run (companion to state.md). The worker
      # appends to this file (bin/oc:488) and is instructed to read it at
      # startup (worker.md) so it knows what previous iterations tried —
      # without this, each re-run starts blind and repeats the same mistakes.
      if [ ! -f ".boucle/$BOUCLE_ISSUE/iterations.md" ]; then
        cat > ".boucle/$BOUCLE_ISSUE/iterations.md" << 'EOF'
      # Iteration log — issue #$BOUCLE_ISSUE

      Each entry: timestamp — role (agent) — iteration — result + files touched.
      Read this BEFORE implementing to avoid repeating rejected approaches.
      EOF
      fi

      # ── Feedback channel: inject reviewer verdicts + human MR comments ──
      # On re-runs (reviewer FAIL, human MR comment, empty MR, rebase conflict),
      # the worker MUST see what the reviewer and humans said on the MR.
      # Without this, each re-run starts blind and repeats the same mistakes
      # (issue #35 on up/urgence-palestine.fr: 3 FAIL verdicts, same root cause,
      # never addressed). We fetch ALL non-system MR notes (reviewer verdicts
      # carry the boucle:verdict marker; human comments are plain text) and
      # inject them into the worker's prompt via BOUCLE_REVIEWER_FEEDBACK.
      # On the first run, no MR exists yet — the feedback is empty, that's fine.
      export BOUCLE_REVIEWER_FEEDBACK
      BOUCLE_REVIEWER_FEEDBACK=""
      MR_FOR_FEEDBACK=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests?source_branch=boucle%2F$BOUCLE_ISSUE&state=opened" 2>/dev/null | jq -r '.[0].iid // empty' 2>/dev/null || echo "")
      if [ -n "$MR_FOR_FEEDBACK" ]; then
        BOUCLE_REVIEWER_FEEDBACK=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests/$MR_FOR_FEEDBACK/notes?per_page=100&order_by=created_at&sort=asc" 2>/dev/null \
          | jq -r '[.[] | select(.system == false or .system == null) | "[\(.author.username // .author.name // "unknown")] \(.body)"] | .[]' 2>/dev/null || echo "")
      fi

      # Download attachments uploaded to MR comments (reviewer screenshots,
      # human mockups). Mirrors bin/fetch-issue-attachments but for MR notes.
      # Gated on MR_FOR_FEEDBACK being non-empty (no MR on first run).
      export BOUCLE_MR_IID="$MR_FOR_FEEDBACK"
      ./bin/fetch-mr-attachments || echo "[boucle] WARN: MR attachment fetch failed — continuing without MR attachments"

      # Download attachments uploaded to the issue (capped per BOUCLE_IMAGE_*_BYTES).
      # Makes them available to the worker agent via BOUCLE_ISSUE_ATTACHMENTS.
      ./bin/fetch-issue-attachments || echo "[boucle] WARN: attachment fetch failed — continuing without attachments"

      # Run the agent. Use `|| rc=$?` to suppress set -e so the script
      # continues to the safety-net commit even if the agent exits non-zero
      # (step limit, crash, etc.). The safety-net commit below captures any
      # uncommitted work the agent produced before exiting.
      rc=0
      ./bin/oc worker || rc=$?
      if [ "$rc" -ne 0 ]; then
        echo "WARN: ./bin/oc worker exited $rc — proceeding to safety-net commit."
      fi

      # ── Model/API failure detection (exit 4) ──────────────────────────
      # bin/oc exits 4 when the worker agent log is empty or shows no agent
      # activity — the model API is likely down or out of credits. opencode
      # hangs silently in this case (no stdout, no crash) and the job appears
      # "running" until the timeout kills it. Without this detection, the
      # failure is misdiagnosed as "agent likely exhausted its step budget"
      # and the loop re-triggers into the same wall (issue #35 on
      # up/urgence-palestine.fr: worker hung 40 min with empty log because
      # ollama-cloud credits were exhausted). Post a diagnostic comment on
      # the issue with the available logs and escalate to human immediately
      # — re-triggering won't help if the model is unavailable.
      if [ "$rc" -eq 4 ]; then
        AGENT_LOG_FILE="$CI_PROJECT_DIR/.boucle/$BOUCLE_ISSUE/agent-output.log"
        LOG_SNIPPET="(log file not found or empty)"
        if [ -f "$AGENT_LOG_FILE" ]; then
          # Capture last 2000 chars of the log (enough to see the error,
          # small enough for a GitLab comment). Strip ANSI escape codes.
          LOG_SNIPPET=$(tail -c 2000 "$AGENT_LOG_FILE" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' || echo "(log read failed)")
        fi
        DIAGNOSTIC_BODY=$(printf '%s\n' \
          "## ⚠️ Worker — échec du modèle (API indisponible ou crédits épuisés)" \
          "" \
          "Le worker n'a produit **aucune sortie** — le log agent est vide ou ne montre aucune activité. Cela indique que l'API du modèle est probablement **indisponible** ou **à court de crédits**." \
          "" \
          "### Logs" \
          "" \
          '```' \
          "$LOG_SNIPPET" \
          '```' \
          "" \
          "### Action requise" \
          "" \
          "- Vérifiez le statut de l'API du modèle." \
          "- Vérifiez les crédits/quota restants." \
          "- Une fois le modèle disponible, re-déclenchez le worker en remettant le label \`boucle:todo\` et en assignant l'issue au bot." \
          "" \
          "---" \
          "*Diagnostic posté par boucle (exit 4 — model/API failure).*")
        glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
          -f body="$DIAGNOSTIC_BODY" > /dev/null 2>&1 || true
        set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
        echo "FAIL: worker model/API failure (exit 4) — diagnostic posted on issue #$BOUCLE_ISSUE, escalated to human." >&2
        exit 1
      fi

      # Safety-net commit: the agent may run out of steps before committing.
      # Stage and commit any uncommitted tracked changes so the index is clean
      # before the rebase (rebase refuses to run on a dirty tree).
      # NEVER stage .boucle/ — it is runtime state (state.md, iterations.md,
      # agent-output.log), not source code. Some repos have .boucle/ tracked
      # from a past `git add -A` (gitignore doesn't untrack); staging it here
      # re-commits stale state and causes checkout conflicts on the next run.
      if ! git diff --quiet || ! git diff --cached --quiet; then
        # `|| true`: git exits 1 when an excluded pathspec matches a gitignored
        # entry (e.g. .boucle/), even though the non-ignored files ARE staged
        # correctly. Without `|| true`, that non-fatal warning aborts the
        # script under `set -e` before `git commit` runs — changes are staged
        # but never committed, and lost when CI destroys the environment.
        git add -A -- ':!.boucle' || true
        git commit -m "feat: worker changes for #$BOUCLE_ISSUE [skip ci]" --no-verify
      fi

      # Ensure wrangler cache isn't committed. Commit this change immediately
      # so the index is clean before the rebase (rebase fails on a dirty index).
      if ! grep -q '.wrangler/' .gitignore 2>/dev/null; then
        echo '.wrangler/' >> .gitignore
        git add .gitignore
        git commit -m "chore: ignore .wrangler/ cache [skip ci]" --no-verify
      fi

      # Guard: if the agent produced no changes vs master (only .gitignore
      # churn from the .wrangler chore above), don't create an empty MR.
      # This happens when the agent exhausts its step budget without writing
      # code. Re-trigger (iter < MAX) or escalate to human (iter == MAX).
      DIFF_FILES=$(git diff --name-only origin/master..HEAD 2>/dev/null | grep -v '^\.gitignore$' || true)
      if [ -z "$DIFF_FILES" ]; then
        ITERATION="${BOUCLE_ITERATION:-1}"
        MAX_ITER="${BOUCLE_MAX_ITERATIONS:-3}"
        # Update the MR TITLE to reflect the current iteration, but do NOT
        # overwrite the description. The previous description may contain a
        # detailed Approach and a working preview URL from the last successful
        # iteration — overwriting it with a "no code changes" placeholder
        # destroys useful information (issue #35 on up/urgence-palestine.fr:
        # the worker produced a full implementation on iteration 3, then the
        # no-changes handler on a later run wiped the Approach and the working
        # preview URL, replacing them with "(no commits this iteration)").
        # The iteration status is already tracked via the issue note below.
        EXISTING_MR_IID=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests?source_branch=$BRANCH&state=opened" 2>/dev/null | jq -r '.[0].iid // empty')
        if [ -n "$EXISTING_MR_IID" ]; then
          NOCHANGE_TITLE="feat: worker iteration $ITERATION — no code changes yet (#$BOUCLE_ISSUE)"
          glab mr update "$EXISTING_MR_IID" \
            --title "$NOCHANGE_TITLE" > /dev/null 2>&1 || true
        fi
        if [ "$ITERATION" -lt "$MAX_ITER" ]; then
          echo "WARN: worker produced no changes (agent exhausted step budget?) — re-triggering (iteration $((ITERATION+1))/$MAX_ITER)." >&2
          set_boucle_label "$BOUCLE_ISSUE" "boucle:todo" "boucle::status::bot"
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="🔄 Worker produced no code changes on iteration $ITERATION (agent likely exhausted its step budget). Re-running (iteration $((ITERATION+1))/$MAX_ITER)." > /dev/null
          curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
            -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
            -F "variables[BOUCLE_ISSUE]=$BOUCLE_ISSUE" -F "variables[BOUCLE_ROLE]=worker" \
            -F "variables[BOUCLE_ITERATION]=$((ITERATION+1))" > /dev/null
        else
          echo "Escalating to human (boucle:human) — worker produced no changes after $MAX_ITER attempts." >&2
          set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="⚠️ Worker produced no code changes after $MAX_ITER attempts. The agent may be unable to implement this issue within its step budget. Human intervention needed." > /dev/null
        fi
        exit 1
      fi

      # Rebase onto latest master before pushing. master may have advanced
      # (other MRs merged) since this branch was created — without a rebase
      # the MR goes stale and GitLab reports it as conflicted, blocking merge.
      # On rebase conflict: fail fast to human instead of shipping a broken MR.
      # NOTE: rebase runs BEFORE the build — build output dirties the working
      # tree (tracked files like public/), and rebase refuses to run on a dirty
      # tree ("cannot rebase: You have unstaged changes").
      git fetch origin master
      if ! git rebase origin/master; then
        echo "FAIL: rebase onto origin/master conflicted — master advanced since branch creation." >&2
        git rebase --abort 2>/dev/null || true
        ITERATION="${BOUCLE_ITERATION:-1}"
        MAX_ITER="${BOUCLE_MAX_ITERATIONS:-3}"
        if [ "$ITERATION" -lt "$MAX_ITER" ]; then
          # Closed-issue guard: if the issue was closed while this worker was
          # running (e.g. catchup closed it after a human merged another MR),
          # do NOT re-trigger — the re-trigger would create a zombie worker on
          # a closed issue. Exit 1 (the rebase failed) without chaining.
          REBASE_ISSUE_STATE=$(glab api --hostname $BOUCLE_FORGE_HOST --method GET "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE" 2>/dev/null | jq -r '.state // "unknown"' 2>/dev/null || echo "unknown")
          if [ "$REBASE_ISSUE_STATE" = "closed" ]; then
            echo "boucle: issue #$BOUCLE_ISSUE is closed — not re-triggering worker after rebase conflict (no-op on closed issue)"
            exit 1
          fi
          echo "Re-triggering worker (iteration $((ITERATION+1))/$MAX_ITER) — next run resets branch to origin/master, no rebase needed." >&2
          set_boucle_label "$BOUCLE_ISSUE" "boucle:todo" "boucle::status::bot"
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="🔄 Master advanced since this branch was created, causing a rebase conflict. Re-running the worker on fresh master (iteration $((ITERATION+1))/$MAX_ITER)." > /dev/null
          curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
            -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
            -F "variables[BOUCLE_ISSUE]=$BOUCLE_ISSUE" -F "variables[BOUCLE_ROLE]=worker" \
            -F "variables[BOUCLE_ITERATION]=$((ITERATION+1))" > /dev/null
        else
          echo "Escalating to human (boucle:human) — iteration cap ($MAX_ITER) reached after repeated rebase conflicts." >&2
          set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="⚠️ Worker could not rebase onto master (conflict) after $MAX_ITER attempts. Master keeps advancing. Human intervention needed." > /dev/null
        fi
        exit 1
      fi

      # Build (eval needed so && in BOUCLE_BUILD_CMD is interpreted as shell operator)
      # Runs AFTER the rebase so the working tree is clean during rebase, and
      # we build the rebased code (what will actually be pushed/deployed).
      eval "$BOUCLE_BUILD_CMD"

      # ── Preview freshness marker ──────────────────────────────────────
      # Write a commit-SHA marker into the build output so the deploy
      # verification can confirm the deployed content matches the head
      # commit (not a stale CDN-cached or cache-hit build from a previous
      # iteration). Without this, the worker can ship a new commit but the
      # preview keeps serving the old deployment because:
      #   - wrangler returns the same content-hash URL for identical output
      #   - the CDN edge keeps serving cached content for seconds-to-minutes
      #   - the only assertion was HTTP 200, which cached content also passes
      # The marker is a plain HTML comment injected into index.html AND a
      # standalone /__boucle_commit__.txt file (so non-HTML backends work too).
      # See AGENTS.md lesson #21.
      HEAD_SHA=$(git rev-parse HEAD)
      MARKER_HTML="<!-- boucle:commit sha=${HEAD_SHA} -->"
      MARKER_TXT="boucle:commit sha=${HEAD_SHA}"
      if [ -f "$BOUCLE_BUILD_OUTPUT/index.html" ]; then
        # Inject the marker right after <html> so it survives minifiers that
        # strip leading/trailing comments. Use a temp file to avoid sed -i
        # portability issues across GNU/BSD sed.
        sed "1i\\${MARKER_HTML}" "$BOUCLE_BUILD_OUTPUT/index.html" > "$BOUCLE_BUILD_OUTPUT/index.html.boucle" \
          && mv "$BOUCLE_BUILD_OUTPUT/index.html.boucle" "$BOUCLE_BUILD_OUTPUT/index.html"
      fi
      printf '%s\n' "$MARKER_TXT" > "$BOUCLE_BUILD_OUTPUT/__boucle_commit__.txt"

      # Push branch FIRST (agent already committed; we just push).
      # This persists the agent's work even if the deploy step later times out.
      # Use --force (not --force-with-lease): the worker resets to origin/master
      # at the start of every run, so we always want to overwrite the remote
      # branch regardless of its current state (previous failed runs, stale
      # refs, etc.). --force-with-lease fails when the remote-tracking ref is
      # stale (e.g. branch was pushed by a previous iteration that we didn't
      # fetch), causing spurious "stale info" push rejections.
      git push --force origin "$BRANCH"

      # Deploy to preview (configurable via BOUCLE_DEPLOY_CMD).
      # Happens AFTER push so the code is saved even if this step is slow or fails.
      # Capture wrangler's exit code separately from the URL extraction: the
      # `$(...) | grep | head` pipeline swallows wrangler failures because the
      # script runs with `set +o pipefail` (line 1255), so the pipeline's exit
      # code is always `head`'s (0). We run the deploy in a subshell, save its
      # full stdout+stderr to a file, then grep the URL out of the file. This
      # way a wrangler auth failure or upload error is detected instead of
      # silently treated as success. See AGENTS.md lesson #21.
      DEPLOY_LOG=$(mktemp)
      (eval "$BOUCLE_DEPLOY_CMD") > "$DEPLOY_LOG" 2>&1
      DEPLOY_RC=$?
      PREVIEW_URL=$(grep -oE "$BOUCLE_DEPLOY_URL_REGEX" "$DEPLOY_LOG" | head -1)
      if [ "$DEPLOY_RC" -ne 0 ] && [ -n "$PREVIEW_URL" ]; then
        echo "WARN: wrangler exited non-zero ($DEPLOY_RC) but emitted a preview URL — proceeding (may be a partial deploy)" >&2
      fi
      if [ "$DEPLOY_RC" -ne 0 ] && [ -z "$PREVIEW_URL" ]; then
        echo "FAIL: deploy exited $DEPLOY_RC with no preview URL" >&2
        cat "$DEPLOY_LOG" >&2
        rm -f "$DEPLOY_LOG"
        exit 1
      fi
      rm -f "$DEPLOY_LOG"

      # Build MR description with context (printf keeps YAML-valid, no multi-line string)
      # NOTE: CI checks out a detached HEAD — there is no local `master` ref.
      # Use origin/master (remote-tracking ref, refreshed by the fetch above) instead.
      ITERATION="${BOUCLE_ITERATION:-1}"
      COMMIT_COUNT=$(git log origin/master.."$BRANCH" --oneline 2>/dev/null | wc -l | tr -d ' ')
      COMMIT_SUMMARY=$(git log origin/master.."$BRANCH" --format='- %s' 2>/dev/null | head -10)
      APPROACH=""
      if [ -f ".boucle/$BOUCLE_ISSUE/state.md" ]; then
        APPROACH=$(sed -n '/^## Approach/,/^## /p' ".boucle/$BOUCLE_ISSUE/state.md" | head -n -1 | tail -n +2 | head -20)
      fi
      # Fallback: if the worker didn't fill the Approach section (still the
      # seed placeholder or empty), note it explicitly so the MR description
      # is not the literal placeholder. The worker is instructed to fill it
      # (worker.md step 8) but consistently doesn't (issue #34 on
      # up/urgence-palestine.fr: 3 reviewer FAIL verdicts, same root cause).
      if [ -z "$APPROACH" ] || [ "$APPROACH" = "(to be determined by worker)" ]; then
        APPROACH="(worker did not record an approach — see commit messages in 'What changed' above)"
      fi

      # ── MR title policy ────────────────────────────────────────────────
      # Derive a meaningful title from the issue title instead of the generic
      # "boucle: issue #N". Format: "<type>: <issue title> (#<N>)"
      #   <type>  — conventional-commit prefix inferred from issue labels
      #             (bug/defect→fix, feature/enhancement→feat, docs→docs,
      #              refactor→refactor, chore→chore; default feat)
      #   <title> — sanitized issue title (newlines stripped, whitespace
      #             collapsed, truncated to 70 chars so it stays readable in
      #             GitLab's MR list)
      # Fallback: "boucle: issue #N" if the API call fails (loop must not break).
      ISSUE_TITLE=""
      ISSUE_LABELS=""
      ISSUE_DATA=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE" 2>/dev/null || true)
      if [ -n "$ISSUE_DATA" ]; then
        ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title // empty')
        ISSUE_LABELS=$(echo "$ISSUE_DATA" | jq -r '.labels | map(. | ascii_downcase) | join(",") // empty')
      fi
      MR_TYPE="feat"
      if echo "$ISSUE_LABELS" | grep -qE 'bug|defect|fix'; then
        MR_TYPE="fix"
      elif echo "$ISSUE_LABELS" | grep -qE 'feature|enhancement|feat'; then
        MR_TYPE="feat"
      elif echo "$ISSUE_LABELS" | grep -qE 'documentation|docs'; then
        MR_TYPE="docs"
      elif echo "$ISSUE_LABELS" | grep -qE 'refactor'; then
        MR_TYPE="refactor"
      elif echo "$ISSUE_LABELS" | grep -qE 'chore|maintenance|tech-debt'; then
        MR_TYPE="chore"
      fi
      if [ -n "$ISSUE_TITLE" ]; then
        # Sanitize: strip newlines/control chars, collapse whitespace, trim,
        # strip a trailing issue-number reference if the title already has one,
        # truncate to 70 chars at a word boundary (only strip the trailing
        # partial word when truncation actually cut mid-word).
        MR_TITLE_CLEAN=$(echo "$ISSUE_TITLE" \
          | tr '\r\n\t' '   ' \
          | sed 's/  */ /g; s/^ //; s/ $//' \
          | sed 's/ *[(#][0-9]*[)]* *$//')
        if [ "${#MR_TITLE_CLEAN}" -gt 70 ]; then
          MR_TITLE_SUMMARY=$(echo "$MR_TITLE_CLEAN" | cut -c1-70 | sed 's/ [^ ]*$//')
        else
          MR_TITLE_SUMMARY="$MR_TITLE_CLEAN"
        fi
        MR_TITLE="$MR_TYPE: $MR_TITLE_SUMMARY (#$BOUCLE_ISSUE)"
      else
        MR_TITLE="boucle: issue #$BOUCLE_ISSUE"
      fi

      MR_DESCRIPTION=$(printf '## Issue #%s — iteration %s\n\nPreview: %s\n\n### What changed\n%s\n\n### Approach\n%s\n\n---\n_Closes #%s | %s commit(s) | boucle worker run %s_' \
        "$BOUCLE_ISSUE" "$ITERATION" "$PREVIEW_URL" "${COMMIT_SUMMARY:-(no commits)}" "${APPROACH:-(not recorded)}" "$BOUCLE_ISSUE" "$COMMIT_COUNT" "$ITERATION")

      # Check if a MR already exists for this branch (worker re-run / iteration 2+).
      # If so, reuse it instead of failing on a 409 from glab mr create.
      MR_IID=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests?source_branch=$BRANCH&state=opened" 2>/dev/null | jq -r '.[0].iid // empty')
      if [ -z "$MR_IID" ]; then
        # Open MR with rich description
        glab mr create --source-branch "$BRANCH" --target-branch master \
          --title "$MR_TITLE" \
          --description "$MR_DESCRIPTION" > /dev/null
        MR_IID=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests?source_branch=$BRANCH" | jq -r '.[0].iid')
      else
        echo "MR !$MR_IID already exists for $BRANCH — reusing (worker iteration $ITERATION)"
        # Update the MR description + title so the new preview URL and
        # approach are reflected. Without this, iteration 2+ keeps the stale
        # description from iteration 1 (wrong preview URL, empty Approach)
        # and the reviewer tests the wrong URL (issue #34 on
        # up/urgence-palestine.fr: MR pointed at the iteration-1 URL while
        # iteration 2 deployed to a different branch-based URL).
        glab mr update "$MR_IID" \
          --title "$MR_TITLE" \
          --description "$MR_DESCRIPTION" > /dev/null 2>&1 || true
      fi

      # NOTE: do NOT assign the MR to the issue author here. During
      # `boucle:working` the MR belongs to the bot — assigning it to the
      # human at every worker run is premature and confuses the user (issue
      # #35 on up/urgence-palestine.fr: MR was assigned to tahrir during
      # iteration 2, before any review). The MR is assigned to the author
      # only when their action is actually required: on reviewer PASS
      # (line ~1946, approval needed) or on `boucle:human` escalation
      # (reviewer FAIL after max iterations / UNCERTAIN — see reviewer job).

      # Assert: branch exists, MR open, preview returns 200 AND serves the
      # fresh commit (not a stale CDN-cached or cache-hit build from a previous
      # iteration). The marker file written above (__boucle_commit__.txt) is
      # fetched from the preview URL and compared to the head SHA. A retry
      # loop gives the CDN edge time to propagate the new deployment (up to
      # BOUCLE_PREVIEW_PROPAGATION_WAIT seconds, default 60s, 5s backoff).
      # Without this, a stale preview passes the old HTTP-200-only assertion
      # and the reviewer FAILs on "preview doesn't match the commit". See
      # AGENTS.md lesson #21.
      if [ -z "$PREVIEW_URL" ]; then
        echo "FAIL: no preview URL" >&2; exit 1
      fi
      if ! curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL" | grep -q "200"; then
        echo "FAIL: preview URL not 200" >&2; exit 1
      fi
      PROPAGATION_WAIT="${BOUCLE_PREVIEW_PROPAGATION_WAIT:-60}"
      PROPAGATION_STEP=5
      ELAPSED=0
      DEPLOYED_SHA=""
      while [ "$ELAPSED" -lt "$PROPAGATION_WAIT" ]; do
        DEPLOYED_SHA=$(curl -s "${PREVIEW_URL%/}/__boucle_commit__.txt" 2>/dev/null \
          | grep -oE 'sha=[a-f0-9]{7,40}' | head -1 | sed 's/sha=//')
        if [ "$DEPLOYED_SHA" = "$HEAD_SHA" ]; then
          echo "Preview fresh: deployed SHA ${DEPLOYED_SHA:0:12} matches head ${HEAD_SHA:0:12} (after ${ELAPSED}s)"
          break
        fi
        echo "Preview not fresh yet (got '${DEPLOYED_SHA:-none}', want '${HEAD_SHA:0:12}') — retrying in ${PROPAGATION_STEP}s (${ELAPSED}/${PROPAGATION_WAIT}s)"
        sleep "$PROPAGATION_STEP"
        ELAPSED=$((ELAPSED + PROPAGATION_STEP))
      done
      if [ "$DEPLOYED_SHA" != "$HEAD_SHA" ]; then
        echo "FAIL: preview stale after ${PROPAGATION_WAIT}s — deployed SHA '${DEPLOYED_SHA:-none}' != head '${HEAD_SHA:0:12}'" >&2
        echo "The preview URL is serving content that does not match the head commit." >&2
        echo "Likely causes: CDN cache, wrangler no-op on identical build output, or a failed redeploy." >&2
        exit 1
      fi

      # Set review label
      set_boucle_label "$BOUCLE_ISSUE" "boucle:review" "boucle::status::bot"

      # Chain to reviewer
      curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
        -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
        -F "variables[BOUCLE_ISSUE]=$BOUCLE_ISSUE" -F "variables[BOUCLE_ROLE]=reviewer" > /dev/null
  # Worker wall-clock cap. 30 min default — a stuck worker shouldn't hog the
  # data runner for an hour. The doctor re-triggers if the job times out and
  # the issue is still at boucle:working. Increase to 60m for heavy issues.
  timeout: 30m

# ── Reviewer ────────────────────────────────────────────────────────────
reviewer:
  stage: review
  resource_group: boucle-issue-$BOUCLE_ISSUE
  needs:
    - job: dispatch
      optional: true
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "reviewer"
  script:
    - |
      # Disable pipefail: grep in $(...) exits 1 on no-match, killing the script under set -eo pipefail. Without pipefail, the var is just empty (which we handle).
      set +o pipefail
      export BOUCLE_ISSUE="${BOUCLE_ISSUE:?BOUCLE_ISSUE must be set}"

      # Label helper: preserve non-boucle labels when writing a boucle label.
      # The jq filter uses startswith("boucle:") which catches BOTH the detail
      # axis (boucle:triage) AND the gross axis (boucle::status::bot, also
      # starts with "boucle:"), so we strip all boucle-managed labels when
      # writing a new pair. Caller passes detail as $2 and gross as $3.
      set_boucle_label() {
        local iid="$1" new="$2" gross="$3"
        local current resp current_all
        resp=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid")
        if echo "$new" | grep -q "size:"; then
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") or startswith("size:") | not)) | join(",")')
        else
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") | not)) | join(",")')
        fi
        current_all=$(echo "$resp" | jq -r '.labels | join(",")')
        # Idempotence: skip the PUT when every label in "$new,$gross" is already
        # on the issue. GitLab records a Resource Label Event on every PUT even
        # if the label set is unchanged — this guard prevents the no-op writes
        # that surface as spurious "status changes" on the board.
        local all_present=true lbl
        for lbl in $(echo "$new,$gross" | tr ',' ' '); do
          [ -z "$lbl" ] && continue
          echo "$current_all" | tr ',' '\n' | grep -qx "$lbl" || { all_present=false; break; }
        done
        [ "$all_present" = true ] && return 0
        local merged="${current:+$current,}$new,$gross"
        glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$iid" -f labels="$merged" > /dev/null
        # When the issue moves to the bot side, assign it to the bot user so
        # the board reflects who owns the next action and humans aren't spammed.
        # BOUCLE_BOT_ID is the GitLab user ID of the bot (set via bin/setup).
        # Best-effort: skip silently if unset (backward compat with setups
        # that haven't run bin/setup --bot-id yet).
        if [ "$gross" = "boucle::status::bot" ] && [ -n "${BOUCLE_BOT_ID:-}" ]; then
          curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$iid" \
            --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
            --data-urlencode "assignee_ids[]=$BOUCLE_BOT_ID" 2>/dev/null || true
        fi
      }

      # Find the MR for this issue
      MR_IID=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests?state=opened" \
        | jq -r '.[] | select(.source_branch == "boucle/'"$BOUCLE_ISSUE"'") | .iid' | head -1)

      if [ -z "$MR_IID" ]; then
        echo "FAIL: no open MR found for issue #$BOUCLE_ISSUE (branch boucle/$BOUCLE_ISSUE)" >&2
        # The MR was likely closed or merged while the issue is at
        # boucle:review. A bare `exit 1` would leave the issue pinned at
        # boucle:review forever, and the doctor would re-trigger the
        # reviewer every 5min — infinite loop (issue #34). Inspect the
        # MR state and transition the issue instead.
        CLOSED_MR_STATE=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests?source_branch=boucle/$BOUCLE_ISSUE&state=closed" 2>/dev/null | jq -r '.[0].state // empty' 2>/dev/null || true)
        MERGED_MR_STATE=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests?source_branch=boucle/$BOUCLE_ISSUE&state=merged" 2>/dev/null | jq -r '.[0].state // empty' 2>/dev/null || true)
        if [ -n "$MERGED_MR_STATE" ] || [ -n "$CLOSED_MR_STATE" ]; then
          echo "boucle: a $MERGED_MR_STATE$CLOSED_MR_STATE MR exists for issue #$BOUCLE_ISSUE — transitioning to boucle:done"
          set_boucle_label "$BOUCLE_ISSUE" "boucle:done" "boucle::status::done"
          glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE" -f state_event=close > /dev/null 2>&1 || true
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="✅ Reviewer: no open MR found, but a $MERGED_MR_STATE$CLOSED_MR_STATE MR exists for this issue. Marked boucle:done and closed." > /dev/null
        else
          echo "boucle: no MR at all for issue #$BOUCLE_ISSUE — escalating to boucle:human"
          set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="⚠️ Reviewer: no MR found for branch boucle/$BOUCLE_ISSUE (no opened, closed, or merged MR). Escalated to **boucle:human**." > /dev/null
        fi
        exit 1
      fi

      MR_DATA=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID")
      PREVIEW_URL=$(echo "$MR_DATA" | jq -r '.description' | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | head -1)
      MR_URL=$(echo "$MR_DATA" | jq -r '.web_url')

      # ── Feedback channel: inject human MR comments into the reviewer ──
      # state.md acceptance criteria are seeded ONCE from the triage comment
      # and never refreshed — they freeze the spec at triage time. Humans
      # amend the spec via MR comments mid-loop, and the worker sees those
      # comments (BOUCLE_REVIEWER_FEEDBACK in the worker job). Without the
      # same channel here, the reviewer grades against the frozen triage
      # spec and FAILs implementations that correctly follow the human's
      # amended spec — directly contradicting the human. Fetch ALL non-system
      # MR notes (same query as the worker job) so the reviewer can weigh
      # human amendments over the frozen criteria.
      export BOUCLE_REVIEWER_FEEDBACK
      BOUCLE_REVIEWER_FEEDBACK=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/notes?per_page=100&order_by=created_at&sort=asc" 2>/dev/null \
        | jq -r '[.[] | select(.system == false or .system == null) | "[\(.author.username // .author.name // "unknown")] \(.body)"] | .[]' 2>/dev/null || echo "")

      # Detect empty MR (worker shipped zero commits — base_sha == head_sha).
      # Re-trigger the worker instead of running the reviewer uselessly.
      MR_BASE=$(echo "$MR_DATA" | jq -r '.diff_refs.base_sha // empty')
      MR_HEAD=$(echo "$MR_DATA" | jq -r '.diff_refs.head_sha // empty')
      if [ -n "$MR_BASE" ] && [ "$MR_BASE" = "$MR_HEAD" ]; then
        ITERATION="${BOUCLE_ITERATION:-1}"
        MAX_ITER="${BOUCLE_MAX_ITERATIONS:-3}"
        echo "FAIL: worker shipped zero commits (MR !${MR_IID} empty — base_sha == head_sha). Re-triggering worker (iteration $((ITERATION+1))/$MAX_ITER)." >&2
        set_boucle_label "$BOUCLE_ISSUE" "boucle:todo" "boucle::status::bot"
        glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
          -f body="🔄 Worker shipped zero commits (MR !${MR_IID} has empty diff). Re-running the worker (iteration $((ITERATION+1))/$MAX_ITER)." > /dev/null
        if [ "$ITERATION" -lt "$MAX_ITER" ]; then
          curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
            -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
            -F "variables[BOUCLE_ISSUE]=$BOUCLE_ISSUE" -F "variables[BOUCLE_ROLE]=worker" \
            -F "variables[BOUCLE_ITERATION]=$((ITERATION+1))" > /dev/null
        else
          set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="⚠️ Worker shipped zero commits after $MAX_ITER attempts. Human intervention needed." > /dev/null
        fi
        exit 1
      fi

      export BOUCLE_PREVIEW_URL="$PREVIEW_URL"

      # Run the agent against the preview.
      # Use `|| rc=$?` to suppress set -e so the script continues to
      # verdict parsing even if the agent exits non-zero (step limit,
      # crash, etc.). The missing-verdict recovery below handles the
      # case where the agent didn't post a verdict.
      # Capture the highest reviewer verdict note ID that existed BEFORE this
      # run, so we can collapse duplicate v2 verdicts below.
      PRE_RUN_VERDICT_ID=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/notes" --paginate \
        | jq -r '[.[] | select(.body | test("<!-- boucle:verdict")) | select(.body | test("role=reviewer")) | .id] | max // 0' 2>/dev/null || echo 0)
      echo "PRE_RUN_VERDICT_ID=$PRE_RUN_VERDICT_ID"

      rc=0
      ./bin/oc reviewer || rc=$?
      if [ "$rc" -ne 0 ]; then
        echo "WARN: ./bin/oc reviewer exited $rc — checking if a verdict was posted anyway."
      fi

      # Parse verdict — agent posts on the MR, not the issue.
      # Filter by the current MR head SHA (the verdict marker includes sha=<head>)
      # so we only pick up a verdict for THIS version of the code, not a stale
      # one from a previous worker iteration. Use `last` (newest) in case the
      # agent posts multiple notes.
      # Robustness: the SHA filter uses `contains("sha=\($sha)")` which requires
      # the agent to emit the bare `sha=<hex>` substring with no quotes/whitespace.
      # As a fallback, if the SHA-anchored filter returns empty, retry WITHOUT
      # the SHA filter (accept the newest reviewer verdict regardless of SHA) —
      # this recovers cases where the agent omitted or malformed the SHA but
      # still posted a valid VERDICT line. The human-override path (dispatch
      # `approved` accepting boucle:human) handles the residual risk.
      COMMENT=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/notes?order_by=created_at&sort=desc" \
        | jq -r --arg sha "$MR_HEAD" '[.[] | select(.body | contains("<!-- boucle:verdict") and contains("role=reviewer") and contains("sha=\($sha)"))] | first | .body // empty')
      VERDICT=$(echo "$COMMENT" | grep -oE '^VERDICT: (PASS|FAIL|UNCERTAIN)' | cut -d' ' -f2)
      # Track whether the verdict we found matches the current MR head SHA.
      # The SHA-anchored parse above filters on sha=$MR_HEAD, so if VERDICT is
      # non-empty here, the verdict is fresh (matches the current head).
      VERDICT_SHA_MATCHED=true

      # SHA-filter fallback: if the SHA-anchored parse found nothing, accept
      # the newest reviewer verdict regardless of SHA. Better to act on a
      # verdict for a slightly-stale SHA than to strand the issue at human.
      if [ -z "$VERDICT" ]; then
        COMMENT=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/notes?order_by=created_at&sort=desc" \
          | jq -r '[.[] | select(.body | contains("<!-- boucle:verdict") and contains("role=reviewer"))] | first | .body // empty')
        VERDICT=$(echo "$COMMENT" | grep -oE '^VERDICT: (PASS|FAIL|UNCERTAIN)' | cut -d' ' -f2)
        # SHA-unanchored fallback → the verdict may be stale (different SHA).
        # Flag it so the log-scraping fallback below gets a chance to find the
        # current run's drafted verdict in stdout, which is fresher.
        VERDICT_SHA_MATCHED=false
        if [ -n "$VERDICT" ]; then
          echo "[boucle] WARN: SHA-anchored verdict parse empty — accepted newest reviewer verdict (SHA-unanchored fallback, may be stale)."
        fi
      fi

      # ── Log-scraping fallback (step-limit recovery) ──────────────────
      # If the agent drafted a verdict but ran out of steps before posting it
      # (VERDICT empty), scrape the drafted verdict from the agent's stdout log
      # and post it ourselves. The agent's post-early prompt rule should
      # prevent this, but this catches the residual case.
      # The reviewer may post a first-pass draft with the `boucle:draft` marker
      # (no CI action) before the final `boucle:verdict` marker. If the agent
      # exhausted its steps after the draft, we promote the draft to a verdict
      # (replace the marker) so the loop has a parsable verdict to act on.
      #
      # Run the log-scraping if VERDICT is empty OR if the verdict we found is
      # SHA-stale (VERDICT_SHA_MATCHED=false). A stale verdict from a previous
      # iteration is worse than the current run's drafted verdict in stdout.
      # (issue #35 on up/urgence-palestine.fr: reviewer posted FAIL in stdout
      # but exhausted steps before posting via glab; SHA-unanchored fallback
      # found an old UNCERTAIN verdict with a different SHA, set
      # VERDICT=UNCERTAIN, and the log-scraping was skipped — the FAIL verdict
      # was lost and the issue was wrongly escalated to human.)
      if [ -z "$VERDICT" ] || [ "$VERDICT_SHA_MATCHED" = false ]; then
        AGENT_LOG="$CI_PROJECT_DIR/.boucle/$BOUCLE_ISSUE/agent-output.log"
        if [ -f "$AGENT_LOG" ]; then
          # Extract the drafted verdict comment: from the boucle:verdict marker
          # to the VERDICT line. Try SHA-anchored first, then SHA-unanchored
          # (tolerates agent omitting/malforming the SHA in the drafted marker).
          DRAFTED_VERDICT=$(awk -v sha="$MR_HEAD" '
            $0 ~ "^<!-- boucle:verdict v=1 role=reviewer sha=" sha " -->" { found=1 }
            found { print; if ($0 ~ /^VERDICT: (PASS|FAIL|UNCERTAIN)/) { exit } }
          ' "$AGENT_LOG" 2> /dev/null || echo "")
          if [ -z "$DRAFTED_VERDICT" ]; then
            DRAFTED_VERDICT=$(awk '
              /^<!-- boucle:verdict v=1 role=reviewer/ { found=1 }
              found { print; if ($0 ~ /^VERDICT: (PASS|FAIL|UNCERTAIN)/) { exit } }
            ' "$AGENT_LOG" 2> /dev/null || echo "")
            if [ -n "$DRAFTED_VERDICT" ]; then
              echo "[boucle] WARN: SHA-anchored log scrape empty — used SHA-unanchored scrape."
            fi
          fi
          # If no boucle:verdict found, try the boucle:draft marker (first-pass
          # draft posted early per the post-early rule). Promote it to a verdict
          # by replacing the draft marker with the verdict marker.
          if [ -z "$DRAFTED_VERDICT" ]; then
            DRAFTED_VERDICT=$(awk -v sha="$MR_HEAD" '
              /^<!-- boucle:draft role=reviewer -->/ { found=1 }
              found { print; if ($0 ~ /^VERDICT: (PASS|FAIL|UNCERTAIN)/) { exit } }
            ' "$AGENT_LOG" 2> /dev/null || echo "")
            if [ -n "$DRAFTED_VERDICT" ]; then
              echo "[boucle] WARN: no boucle:verdict in log — promoting boucle:draft to verdict (step-limit fallback)."
              # Promote the draft marker to a verdict marker so the CI parser
              # recognizes it when we re-fetch after posting.
              DRAFTED_VERDICT=$(printf '%s' "$DRAFTED_VERDICT" | sed "s|<!-- boucle:draft role=reviewer -->|<!-- boucle:verdict v=1 role=reviewer sha=$MR_HEAD -->|")
              # If the promoted draft has no VERDICT line, default to UNCERTAIN
              # (the agent posted a draft but ran out of steps before posting
              # a final verdict with a VERDICT: line).
              if ! echo "$DRAFTED_VERDICT" | grep -qiE '^VERDICT: (PASS|FAIL|UNCERTAIN)'; then
                DRAFTED_VERDICT="$(printf '%s\n\nVERDICT: UNCERTAIN\n' "$DRAFTED_VERDICT")"
                echo "[boucle] WARN: promoted reviewer draft had no VERDICT line — defaulting to UNCERTAIN."
              fi
            fi
          fi
          if [ -n "$DRAFTED_VERDICT" ] && echo "$DRAFTED_VERDICT" | grep -qiE '^VERDICT: (PASS|FAIL|UNCERTAIN)'; then
            echo "[boucle] Recovering drafted reviewer verdict from agent log (step-limit fallback)."
            # Strip leading/trailing ``` fences if the agent wrapped the comment.
            DRAFTED_VERDICT=$(echo "$DRAFTED_VERDICT" | sed '/^```$/d')
            glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/notes" \
              -f body="$DRAFTED_VERDICT" > /dev/null 2>&1 || true
            # Re-fetch and re-parse the now-posted verdict (SHA-anchored, then
            # SHA-unanchored fallback — same logic as the primary parse above).
            NEW_COMMENT=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/notes?order_by=created_at&sort=desc" \
              | jq -r --arg sha "$MR_HEAD" '[.[] | select(.body | contains("<!-- boucle:verdict") and contains("role=reviewer") and contains("sha=\($sha)"))] | first | .body // empty')
            NEW_VERDICT=$(echo "$NEW_COMMENT" | grep -oE '^VERDICT: (PASS|FAIL|UNCERTAIN)' | cut -d' ' -f2)
            if [ -z "$NEW_VERDICT" ]; then
              NEW_COMMENT=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/notes?order_by=created_at&sort=desc" \
                | jq -r '[.[] | select(.body | contains("<!-- boucle:verdict") and contains("role=reviewer"))] | first | .body // empty')
              NEW_VERDICT=$(echo "$NEW_COMMENT" | grep -oE '^VERDICT: (PASS|FAIL|UNCERTAIN)' | cut -d' ' -f2)
            fi
            if [ -n "$NEW_VERDICT" ]; then
              # The log-scraping found a fresher verdict — override the stale one.
              COMMENT="$NEW_COMMENT"
              VERDICT="$NEW_VERDICT"
              VERDICT_SHA_MATCHED=true
              echo "[boucle] Step-limit fallback succeeded: recovered verdict=$VERDICT (overrode stale verdict)."
            else
              echo "[boucle] Step-limit fallback failed: drafted verdict had no parsable VERDICT line — keeping previous verdict=$VERDICT."
            fi
          else
            echo "[boucle] Step-limit fallback: no drafted verdict in log — keeping previous verdict=$VERDICT."
          fi
        fi
      fi

      # Collapse duplicate reviewer verdicts (agent may post a v2; CI replaces the first).
      ./bin/collapse-duplicate-notes reviewer "$CI_PROJECT_ID" "$MR_IID" "$PRE_RUN_VERDICT_ID" "$BOUCLE_FORGE_HOST" "$MR_HEAD"

      # Resolve the reporter id once, before the verdict case, so every branch
      # (PASS, FAIL, UNCERTAIN) can assign the MR to the author when their
      # action is required. Handles sub-issues: uses the parent issue's author.
      resolve_reporter_id() {
        local iid="$1" data parent_iid parent_data reporter_id
        data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid" 2>/dev/null) || { echo ""; return; }
        parent_iid=$(printf '%s' "$data" | jq -r '.description // empty' | awk '/^## Parent issue[[:space:]]*$/{f=1;next}/^## /{f=0}f' | grep -oE '#[0-9]+' | head -1 | tr -d '#')
        if [ -n "$parent_iid" ]; then
          parent_data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$parent_iid" 2>/dev/null) || { echo ""; return; }
          reporter_id=$(printf '%s' "$parent_data" | jq -r '.author.id // empty')
        else
          reporter_id=$(printf '%s' "$data" | jq -r '.author.id // empty')
        fi
        echo "$reporter_id"
      }
      AUTHOR_ID=$(resolve_reporter_id "$BOUCLE_ISSUE")
      assign_mr_to_author() {
        # Assign the MR to the issue author (curl — glab array-param is broken)
        if [ -n "$AUTHOR_ID" ] && [ "$AUTHOR_ID" != "null" ] && [ -n "$MR_IID" ]; then
          curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/merge_requests/$MR_IID" \
            --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
            --data-urlencode "assignee_ids[]=$AUTHOR_ID" 2>/dev/null || true
        fi
      }

      case "$VERDICT" in
        PASS)
          # Assign the MR to the original issue author so they're notified
          # that their approval is needed. The loop pauses here until the
          # author clicks "Approve" on the MR (GitLab native approval). The
          # merge_request webhook (action=approved) triggers the merger job,
          # which merges serially to avoid conflicts.
          assign_mr_to_author
          # Set boucle:approval (waits for author to approve the MR natively)
          set_boucle_label "$BOUCLE_ISSUE" "boucle:approval" "boucle::status::human"
          APPROVAL_MSG=$(printf '✅ Reviewer verdict: **PASS**. MR !%s is ready to merge.\n\nThe MR has been assigned to you for approval. To approve and merge, click the **Approve** button on [MR !%s](%s). The merger will then rebase the MR onto master and merge it serially (avoiding conflicts with other approved MRs).' "$MR_IID" "$MR_IID" "$MR_URL")
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="$APPROVAL_MSG" > /dev/null
          # Race condition recovery: the human may have approved the MR
          # BEFORE the reviewer finished (the dispatch `approved` handler
          # silently skips when the issue is at boucle:review, not
          # boucle:approval). Check if the MR is already approved natively
          # — if so, trigger the merger immediately instead of waiting for
          # an approval webhook that was already silently dropped.
          MR_APPROVALS=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/approvals" 2>/dev/null)
          MR_APPROVED_COUNT=$(echo "$MR_APPROVALS" | jq -r '[.approved_by[].user.username] | length' 2>/dev/null || echo 0)
          if [ "${MR_APPROVED_COUNT:-0}" -gt 0 ]; then
            echo "MR !${MR_IID} was already approved ($MR_APPROVED_COUNT) before reviewer PASS — triggering merger (race condition recovery)"
            curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
              -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
              -F "variables[BOUCLE_ISSUE]=$BOUCLE_ISSUE" -F "variables[BOUCLE_ROLE]=merger" > /dev/null
          fi
          ;;
        FAIL)
          ITERATION="${BOUCLE_ITERATION:-1}"
          MAX_ITER="${BOUCLE_MAX_ITERATIONS:-3}"
          # Closed-issue guard: if the issue was closed (e.g. by catchup after
          # a human merged the MR directly), do NOT re-trigger the worker —
          # it would run on a closed issue and create zombie MRs. The reviewer
          # FAIL is a dead end on a closed issue; just exit.
          REVIEW_FAIL_ISSUE_STATE=$(glab api --hostname $BOUCLE_FORGE_HOST --method GET "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE" 2>/dev/null | jq -r '.state // "unknown"' 2>/dev/null || echo "unknown")
          if [ "$REVIEW_FAIL_ISSUE_STATE" = "closed" ]; then
            echo "boucle: issue #$BOUCLE_ISSUE is closed — not re-triggering worker after reviewer FAIL (no-op on closed issue)"
            exit 0
          fi
          if [ "$ITERATION" -lt "$MAX_ITER" ]; then
            set_boucle_label "$BOUCLE_ISSUE" "boucle:todo" "boucle::status::bot"
            # Chain back to worker with incremented iteration
            curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
              -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
              -F "variables[BOUCLE_ISSUE]=$BOUCLE_ISSUE" -F "variables[BOUCLE_ROLE]=worker" \
              -F "variables[BOUCLE_ITERATION]=$((ITERATION+1))" > /dev/null
          else
            # Final reviewer FAIL after $MAX_ITER attempts: fused into boucle:human
            # (was boucle:blocked, deleted). Configurable via BOUCLE_MAX_ITERATIONS.
            set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
            # Assign the MR to the issue author so they're notified that human
            # intervention is required. Without this, the user never gets a
            # signal that the loop exhausted its iterations (issue #35 on
            # up/urgence-palestine.fr: MR stayed assigned to the bot after 3
            # reviewer FAILs, the user saw no notification).
            assign_mr_to_author
            ESCALATION_MSG=$(printf '⚠️ Reviewer verdict: **FAIL** after %s iterations. The loop could not satisfy the acceptance criteria automatically.\n\nThe MR has been assigned to you for manual review. Inspect [MR !%s](%s) and the reviewer verdicts, then either:\n- **Approve** the MR if the work is acceptable (the merger will rebase + merge), or\n- **Comment** with guidance and re-assign to the bot to re-trigger the worker.' "$MAX_ITER" "$MR_IID" "$MR_URL")
            glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
              -f body="$ESCALATION_MSG" > /dev/null
          fi
          ;;
        UNCERTAIN)
          # Genuinely UNCERTAIN verdict (agent posted VERDICT: UNCERTAIN).
          # This branch is NOT a catch-all for empty VERDICT — empty VERDICT
          # (agent crashed / step-exhausted before posting a verdict) is
          # handled by the post-case assertion below, which re-triggers the
          # reviewer instead of prematurely escalating to human. Conflating
          # the two caused MR !40 on up/urgence-palestine.fr: the reviewer
          # posted only drafts on iterations 1-2 (no VERDICT line), the
          # catch-all fired, assigned the MR to the human and set
          # boucle:human BEFORE the re-triggered reviewer could finish —
          # creating the appearance of "assigned mid-review" and 3 duplicate
          # "unparsable" notes. See AGENTS.md lesson #43.
          set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
          # Assign the MR to the issue author on escalation (same rationale as
          # the FAIL-after-max branch above).
          assign_mr_to_author
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="Verdict unparsable or uncertain. Human review needed. The MR has been assigned to you." > /dev/null
          ;;
      esac

      # Assert: verdict comment exists and VERDICT: parsable.
      # If the agent ran but didn't post a verdict for this SHA (ran out of
      # steps, crashed, etc.), re-trigger the reviewer instead of leaving the
      # issue stuck at boucle:review for the doctor to pick up 15 min later.
      # This runs AFTER the case block — but the case block no longer has a
      # catch-all, so empty VERDICT falls through the case without side
      # effects and reaches this assertion. On iter < MAX_ITER we re-trigger
      # the reviewer; on iter == MAX_ITER we escalate to human (with MR
      # assignment + note, matching the FAIL-after-max behavior).
      if [ -z "$VERDICT" ]; then
        ITERATION="${BOUCLE_ITERATION:-1}"
        MAX_ITER="${BOUCLE_MAX_ITERATIONS:-3}"
        echo "FAIL: agent did not post a verdict for sha $MR_HEAD (iteration $ITERATION/$MAX_ITER)" >&2
        if [ "$ITERATION" -lt "$MAX_ITER" ]; then
          echo "Re-triggering reviewer (iteration $((ITERATION+1))/$MAX_ITER)."
          curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
            -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
            -F "variables[BOUCLE_ISSUE]=$BOUCLE_ISSUE" -F "variables[BOUCLE_ROLE]=reviewer" \
            -F "variables[BOUCLE_ITERATION]=$((ITERATION+1))" > /dev/null
        else
          echo "Max iterations reached — escalating to human."
          set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
          assign_mr_to_author
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="⚠️ Reviewer agent failed to post a verdict after $MAX_ITER attempts. Human review needed. The MR has been assigned to you." > /dev/null
        fi
        exit 1
      fi
  # 30m to accommodate provider fallback: 12m primary timeout + 12m fallback
  # + 6m overhead (rebase, deploy, verdict post). At 15m the fallback only
  # got 3m after the 12m primary timeout — not enough to complete a review.
  timeout: 30m

# ── Merger (serial merge after author approval) ─────────────────────────
# Triggered by dispatch when an author approves a MR natively (GitLab
# merge_request webhook, action=approved). The resource_group serializes
# merges across all issues — only one MR merges at a time, so each merge
# rebases onto a master that already includes the previous merge,
# eliminating the class of conflicts we hit when merging 4 MRs in parallel.
# After merge, triggers e2e WITH BOUCLE_ISSUE set (fixes the design gap where
# deploy-triggered e2e had no issue context and maybe_close_parent never ran).
merger:
  stage: merge
  # Loop-critical: merger makes only API calls + git operations — lightweight.
  # Run on ANY available runner (tags: []) so an approved MR is never blocked
  # waiting behind a heavy worker/reviewer job on the single data runner.
  tags: []
  # Serialize all merges project-wide — one MR merges at a time.
  resource_group: boucle-merge
  needs:
    - job: dispatch
      optional: true
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "merger"
  script:
    - |
      # Disable pipefail: grep in $(...) exits 1 on no-match, killing the script under set -eo pipefail. Without pipefail, the var is just empty (which we handle).
      set +o pipefail
      export BOUCLE_ISSUE="${BOUCLE_ISSUE:?BOUCLE_ISSUE must be set}"

      # Label helper: preserve non-boucle labels when writing a boucle label.
      # The jq filter uses startswith("boucle:") which catches BOTH the detail
      # axis (boucle:triage) AND the gross axis (boucle::status::bot, also
      # starts with "boucle:"), so we strip all boucle-managed labels when
      # writing a new pair. Caller passes detail as $2 and gross as $3.
      set_boucle_label() {
        local iid="$1" new="$2" gross="$3"
        local current resp current_all
        resp=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid")
        if echo "$new" | grep -q "size:"; then
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") or startswith("size:") | not)) | join(",")')
        else
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") | not)) | join(",")')
        fi
        current_all=$(echo "$resp" | jq -r '.labels | join(",")')
        # Idempotence: skip the PUT when every label in "$new,$gross" is already
        # on the issue. GitLab records a Resource Label Event on every PUT even
        # if the label set is unchanged — this guard prevents the no-op writes
        # that surface as spurious "status changes" on the board.
        local all_present=true lbl
        for lbl in $(echo "$new,$gross" | tr ',' ' '); do
          [ -z "$lbl" ] && continue
          echo "$current_all" | tr ',' '\n' | grep -qx "$lbl" || { all_present=false; break; }
        done
        [ "$all_present" = true ] && return 0
        local merged="${current:+$current,}$new,$gross"
        glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$iid" -f labels="$merged" > /dev/null
        # When the issue moves to the bot side, assign it to the bot user so
        # the board reflects who owns the next action and humans aren't spammed.
        # BOUCLE_BOT_ID is the GitLab user ID of the bot (set via bin/setup).
        # Best-effort: skip silently if unset (backward compat with setups
        # that haven't run bin/setup --bot-id yet).
        if [ "$gross" = "boucle::status::bot" ] && [ -n "${BOUCLE_BOT_ID:-}" ]; then
          curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$iid" \
            --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
            --data-urlencode "assignee_ids[]=$BOUCLE_BOT_ID" 2>/dev/null || true
        fi
      }

      # Set merging label
      set_boucle_label "$BOUCLE_ISSUE" "boucle:merging" "boucle::status::bot"

      # Find the MR for this issue
      MR_IID=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests?state=opened" \
        | jq -r '.[] | select(.source_branch == "boucle/'"$BOUCLE_ISSUE"'") | .iid' | head -1)

      if [ -z "$MR_IID" ]; then
        echo "FAIL: no open MR found for issue #$BOUCLE_ISSUE (branch boucle/$BOUCLE_ISSUE)" >&2
        set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
        glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
          -f body="⚠️ Merger could not find an open MR for branch boucle/$BOUCLE_ISSUE. Human intervention needed." > /dev/null
        exit 1
      fi

      # Refresh master so we rebase onto the latest (another MR may have just
      # merged — the resource_group guarantees we're the only merger running,
      # but master may have advanced since this MR was created).
      # Also fetch the MR branch itself — CI clones with --depth=1 and only the
      # ref that triggered the pipeline (master for merger role), so the MR
      # branch ref is NOT present in the local clone by default.
      BRANCH="boucle/$BOUCLE_ISSUE"
      git fetch origin master "$BRANCH"

      # Set git identity BEFORE the rebase — git rebase rewrites commits and
      # needs a committer identity. On a fresh docker executor there is no
      # global git config, so the rebase fails with "Committer identity unknown".
      git config user.email "bot@ankaboot.dev"
      git config user.name "up-bot"
      git remote set-url origin "https://up-bot:${BOUCLE_TOKEN}@${BOUCLE_FORGE_HOST}/${CI_PROJECT_PATH}.git"

      # Rebase the MR branch onto latest master. This is the key conflict-
      # avoidance mechanism: because merges are serialized, each rebase is
      # against a master that already includes all previously-merged MRs.
      git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
      if ! git rebase origin/master; then
        echo "FAIL: rebase onto origin/master conflicted — even after serial merge." >&2
        git rebase --abort 2>/dev/null || true
        echo "Re-triggering worker (iteration 1) — the MR will be regenerated on fresh master, no rebase needed." >&2
        set_boucle_label "$BOUCLE_ISSUE" "boucle:todo" "boucle::status::bot"
        glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
          -f body="🔄 Merger could not rebase MR !${MR_IID} onto master (conflict). Re-running the worker on fresh master to regenerate the MR." > /dev/null
        curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
          -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
          -F "variables[BOUCLE_ISSUE]=$BOUCLE_ISSUE" -F "variables[BOUCLE_ROLE]=worker" \
          -F "variables[BOUCLE_ITERATION]=1" > /dev/null
        exit 1
      fi

      # Push the rebased branch
      # Use --force: the merger rebased onto master, so the local branch has
      # diverged from the remote. --force-with-lease fails if the remote-tracking
      # ref is stale (not fetched). We always want to overwrite with the rebased
      # branch.
      git push --force origin "$BRANCH"

      # Wait for GitLab to recompute mergeability after the force-push (poll).
      # detailed_merge_status can be "checking" for several seconds after a
      # force-push while GitLab recomputes. If the project has "Pipelines must
      # succeed" enabled, the force-push triggers a new pipeline on the MR
      # branch and GitLab refuses to merge until it completes — the status
      # stays at "pipeline_status_must_pass" (or "checking") until the pipeline
      # finishes. Poll up to ~10 min to accommodate a full CI run, tolerating
      # transient glab/jq failures (set +e around the poll).
      sleep 5
      MERGE_STATUS="unknown"
      MWPS=false
      for i in $(seq 1 60); do
        MERGE_STATUS=$(set +e; glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID" 2>/dev/null \
          | jq -r '.detailed_merge_status // .merge_status // "unknown"' 2>/dev/null) || MERGE_STATUS="unknown"
        case "$MERGE_STATUS" in
          mergeable) break ;;
          checking|pipeline_status_must_pass|pipeline_blocked)
            # Pipeline still running or GitLab recomputing — keep polling.
            ;;
          *)
            # Hard block (conflict, broken, etc.) — no point waiting.
            echo "MR !${MR_IID} merge status: $MERGE_STATUS — hard block, not waiting." >&2
            break
            ;;
        esac
        echo "MR !${MR_IID} merge status: $MERGE_STATUS — waiting 10s... (attempt $i/60)"
        sleep 10
      done

      # If the pipeline is still running after the poll window, use
      # merge-when-pipeline-succeeds (MWPS) instead of failing. GitLab will
      # merge automatically once the pipeline passes. This handles the
      # "Pipelines must succeed" project setting without requiring the merger
      # to outlast the entire CI run.
      if [ "$MERGE_STATUS" = "checking" ] || [ "$MERGE_STATUS" = "pipeline_status_must_pass" ] || [ "$MERGE_STATUS" = "pipeline_blocked" ]; then
        echo "MR !${MR_IID} pipeline still running (status: $MERGE_STATUS) — using merge-when-pipeline-succeeds."
        MWPS=true
      elif [ "$MERGE_STATUS" != "mergeable" ]; then
        echo "FAIL: MR !${MR_IID} not mergeable after rebase (status: $MERGE_STATUS)" >&2
        set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
        glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
          -f body="⚠️ MR !${MR_IID} is not mergeable after rebase (status: $MERGE_STATUS). Human intervention needed." > /dev/null
        exit 1
      fi

      # Merge the MR (squash=false to preserve commits; use merge_commit).
      # glab may return non-zero even when the merge succeeds server-side
      # (e.g. 409/405 on an already-merged MR, or transient API errors), so
      # tolerate the exit code and verify via MERGE_SHA below instead.
      # When MWPS=true, the merge is deferred until the pipeline succeeds —
      # GitLab returns merge_commit_sha=null immediately, so skip the SHA check
      # and let the deploy (triggered by the eventual merge) handle e2e.
      if [ "$MWPS" = true ]; then
        MERGE_RESULT=$(glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/merge" \
          -f merge_when_pipeline_succeeds=true 2>&1 || true)
        echo "MWPS enabled for MR !${MR_IID} — GitLab will merge when the pipeline succeeds."
        glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
          -f body="⏳ MR !${MR_IID} merge scheduled (merge-when-pipeline-succeeds). GitLab will merge automatically once the CI pipeline passes." > /dev/null
        # MWPS merge: no merge_commit_sha yet. The deploy triggered by the
        # eventual merge will run e2e with BOUCLE_ISSUE unset (no issue
        # context). The doctor's staleness check will close the loop if the
        # MWPS merge lands but no issue-context e2e runs.
        exit 0
      fi
      MERGE_RESULT=$(glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/merge" \
        -f merge_when_pipeline_succeeds=false 2>&1 || true)
      MERGE_SHA=$(echo "$MERGE_RESULT" | jq -r '.merge_commit_sha // .sha // empty' 2>/dev/null)

      if [ -z "$MERGE_SHA" ]; then
        echo "FAIL: merge API call failed: $MERGE_RESULT" >&2
        set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
        exit 1
      fi

      echo "Merged MR !${MR_IID} (merge_commit $MERGE_SHA) for issue #$BOUCLE_ISSUE"

      # The merge pushes to master → triggers deploy → deploy triggers e2e.
      # BUT deploy-triggered e2e has no BOUCLE_ISSUE context, so
      # maybe_close_parent never runs. Fix: trigger e2e directly WITH
      # BOUCLE_ISSUE set, so the issue gets boucle:done + closed + parent cascade.
      # Wait for the deploy pipeline to finish first (production must be live
      # before e2e can test it). Poll for the deploy pipeline to complete.
      echo "Waiting for deploy pipeline to complete before triggering e2e..."
      for i in $(seq 1 60); do
        # Find the latest deploy pipeline for master
        DEPLOY_PIPELINES=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/pipelines?ref=master&per_page=5" 2>/dev/null)
        DEPLOY_STATUS=$(echo "$DEPLOY_PIPELINES" | jq -r '[.[] | select(.source == "push")] | first | .status // "unknown"')
        if [ "$DEPLOY_STATUS" = "success" ] || [ "$DEPLOY_STATUS" = "failed" ] || [ "$DEPLOY_STATUS" = "canceled" ]; then
          echo "Deploy pipeline status: $DEPLOY_STATUS"
          break
        fi
        sleep 15
      done

      # Get the production URL (from the deploy's e2e trigger or fallback)
      LIVE_URL="${BOUCLE_PRODUCTION_URL:-}"
      if [ -z "$LIVE_URL" ]; then
        # Fetch the deploy pipeline's e2e job variables (best-effort)
        LIVE_URL="https://${BOUCLE_DEPLOY_PROJECT}.pages.dev"
      fi

      # Trigger e2e WITH BOUCLE_ISSUE set → enables maybe_close_parent
      curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
        -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
        -F "variables[BOUCLE_ROLE]=e2e" \
        -F "variables[BOUCLE_ISSUE]=$BOUCLE_ISSUE" \
        -F "variables[BOUCLE_LIVE_URL]=$LIVE_URL" > /dev/null 2>&1 || true
      echo "Triggered e2e for issue #$BOUCLE_ISSUE with LIVE_URL=$LIVE_URL"
  # 30m to accommodate provider fallback: 12m primary + 12m fallback + 6m overhead.
  timeout: 30m

# ── Catchup (direct merge recovery) ────────────────────────────────────
# Triggered by dispatch when a human merges a boucle/<iid> MR directly
# (merge_request webhook, action=merge), bypassing the approval circuit.
# The push to master already triggered deploy → smoke e2e (no issue
# context). This job catches up: inspects the issue state, sets
# boucle:done (if was at boucle:approval) or boucle:human (if merged
# early), posts an audit comment, closes the issue, and cascades the
# parent close. No e2e agent runs — we trust the human's merge judgment.
catchup:
  stage: merge
  # Loop-critical control-plane job: API calls only, no build. Run on ANY
  # available runner (tags: []) so a direct merge is never blocked waiting
  # behind a heavy worker/reviewer job on the single data runner.
  tags: []
  needs:
    - job: dispatch
      optional: true
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "catchup"
  script:
    - |
      # Disable pipefail: grep in $(...) exits 1 on no-match, killing the script under set -eo pipefail. Without pipefail, the var is just empty (which we handle).
      set +o pipefail
      export BOUCLE_ISSUE="${BOUCLE_ISSUE:?BOUCLE_ISSUE must be set}"

      # ── Helpers (local copies — matches the per-job pattern used by  ──
      # merger, e2e, doctor: each job duplicates set_boucle_label,
      # close_issue, maybe_close_parent in its own script block).
      # No cross-job refactoring (out of scope for a 2116-line inline file).

      # Label helper: preserve non-boucle labels when writing a boucle label.
      # The jq filter uses startswith("boucle:") which catches BOTH the detail
      # axis (boucle:triage) AND the gross axis (boucle::status::bot, also
      # starts with "boucle:"), so we strip all boucle-managed labels when
      # writing a new pair. Caller passes detail as $2 and gross as $3.
      # Tolerate glab non-zero exit (version warnings, transient API errors).
      set_boucle_label() {
        local iid="$1" new="$2" gross="$3"
        local current resp current_all
        resp=$(set +e; glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid" 2>/dev/null) || true
        if echo "$new" | grep -q "size:"; then
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") or startswith("size:") | not)) | join(",")' 2>/dev/null) || true
        else
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") | not)) | join(",")' 2>/dev/null) || true
        fi
        current_all=$(echo "$resp" | jq -r '.labels | join(",")' 2>/dev/null) || true
        # Idempotence: skip the PUT when every label in "$new,$gross" is already
        # on the issue. GitLab records a Resource Label Event on every PUT even
        # if the label set is unchanged — this guard prevents the no-op writes
        # that surface as spurious "status changes" on the board.
        local all_present=true lbl
        for lbl in $(echo "$new,$gross" | tr ',' ' '); do
          [ -z "$lbl" ] && continue
          echo "$current_all" | tr ',' '\n' | grep -qx "$lbl" || { all_present=false; break; }
        done
        [ "$all_present" = true ] && return 0
        local merged="${current:+$current,}$new,$gross"
        glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$iid" -f labels="$merged" > /dev/null 2>&1 || true
        # When the issue moves to the bot side, assign it to the bot user so
        # the board reflects who owns the next action. Best-effort: skip
        # silently if BOUCLE_BOT_ID is unset (backward compat).
        if [ "$gross" = "boucle::status::bot" ] && [ -n "${BOUCLE_BOT_ID:-}" ]; then
          curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$iid" \
            --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
            --data-urlencode "assignee_ids[]=$BOUCLE_BOT_ID" 2>/dev/null || true
        fi
      }

      # Close a GitLab issue (boucle:done is a board label, not a close state)
      close_issue() {
        local iid="$1"
        glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$iid" \
          -f state_event=close > /dev/null 2>&1 || true
      }

      # List child work items of a parent. Returns JSON array (empty on failure).
      get_work_item_children() {
        local parent_iid="$1" children out
        children=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/-/work_items/$parent_iid/children" 2>/dev/null) || { echo "[]"; return; }
        out=$(printf '%s' "$children" | jq -c 'if type == "array" then . else [] end' 2>/dev/null)
        printf '%s' "${out:-[]}"
      }

      # Parent-close cascade: if this issue is a sub-issue (has a "## Parent
      # issue" section in its body), check whether ALL its sibling sub-issues
      # are closed. If so, close the parent too. No-op if not a sub-issue.
      maybe_close_parent() {
        local child_iid="$1"
        local child_data parent_iid
        child_data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$child_iid" 2>/dev/null) || { echo "maybe_close_parent: can't fetch issue #$child_iid — skipping."; return 0; }
        parent_iid=$(echo "$child_data" | jq -r '.description // empty' | awk '/^## Parent issue[[:space:]]*$/{f=1;next}/^## /{f=0}f' | grep -oE '#[0-9]+' | head -1 | tr -d '#')
        if [ -z "$parent_iid" ]; then
          echo "maybe_close_parent: no parent issue link in #$child_iid — not a sub-issue."
          return 0
        fi
        local parent_data parent_state
        parent_data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$parent_iid" 2>/dev/null) || { echo "maybe_close_parent: can't fetch parent #$parent_iid — skipping."; return 0; }
        parent_state=$(echo "$parent_data" | jq -r '.state')
        if [ "$parent_state" = "closed" ]; then
          echo "maybe_close_parent: parent #$parent_iid already closed."
          return 0
        fi
        local children_data sibling_iids
        children_data=$(get_work_item_children "$parent_iid")
        sibling_iids=$(echo "$children_data" | jq -r '[.[].iid] | join(",")' 2>/dev/null)
        if [ -z "$sibling_iids" ]; then
          local parent_notes
          parent_notes=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$parent_iid/notes" 2>/dev/null) || { echo "maybe_close_parent: can't fetch parent notes — skipping."; return 0; }
          sibling_iids=$(echo "$parent_notes" | jq -r '[.[] | select(.body | contains("<!-- boucle:split-parent"))] | first | .body // empty' | grep -oE 'iids=[0-9,]+' | cut -d= -f2)
          if [ -z "$sibling_iids" ]; then
            echo "maybe_close_parent: no children via hierarchy API and no split-parent marker on #$parent_iid — checking REST links..."
            local links_data
            links_data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$parent_iid/links" 2>/dev/null) || links_data="[]"
            sibling_iids=$(echo "$links_data" | jq -r '[.[] | select(.iid != null) | .iid] | join(",")')
            if [ -z "$sibling_iids" ]; then
              echo "maybe_close_parent: parent #$parent_iid has no children, no marker, and no REST links — can't check siblings."
              return 0
            fi
            echo "maybe_close_parent: found $sibling_iids via REST links fallback"
            local all_closed=true iid
            for iid in $(echo "$sibling_iids" | tr ',' ' '); do
              local sib_state
              sib_state=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid" 2>/dev/null | jq -r '.state // "unknown"')
              if [ "$sib_state" != "closed" ]; then
                echo "maybe_close_parent: sibling #$iid is $sib_state — parent #$parent_iid stays open."
                all_closed=false
                break
              fi
            done
            if [ "$all_closed" = "true" ]; then
              echo "maybe_close_parent: all sub-issues of #$parent_iid are closed — closing parent."
              close_issue "$parent_iid"
            fi
            return 0
          fi
          echo "maybe_close_parent: found $sibling_iids via legacy split-parent marker"
          local all_closed=true iid
          for iid in $(echo "$sibling_iids" | tr ',' ' '); do
            local sib_state
            sib_state=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid" 2>/dev/null | jq -r '.state // "unknown"')
            if [ "$sib_state" != "closed" ]; then
              echo "maybe_close_parent: sibling #$iid is $sib_state — parent #$parent_iid stays open."
              all_closed=false
              break
            fi
          done
          if [ "$all_closed" = "true" ]; then
            echo "maybe_close_parent: all sub-issues of #$parent_iid are closed — closing parent."
            close_issue "$parent_iid"
          fi
          return 0
        fi
        local all_closed=true
        local open_count
        open_count=$(echo "$children_data" | jq '[.[] | select(.state != "closed")] | length' 2>/dev/null || echo 1)
        if [ "${open_count:-1}" -gt 0 ]; then
          local open_iids
          open_iids=$(echo "$children_data" | jq -r '[.[] | select(.state != "closed") | .iid] | join(",")')
          echo "maybe_close_parent: open sub-issue(s) #$open_iids — parent #$parent_iid stays open."
          all_closed=false
        fi
        if [ "$all_closed" = "true" ]; then
          echo "maybe_close_parent: all sub-issues of #$parent_iid are closed — closing parent."
          close_issue "$parent_iid"
        fi
      }

      # ── Main: inspect issue state, branch, close, cascade ──────────────
      # Disable errexit for the main flow: GitLab Runner runs `- |` blocks with
      # set -eo pipefail, and grep (no match) / glab (transient API error)
      # would abort before our explicit error handling can run. We handle
      # errors per-command instead (matches e2e's post-agent section pattern).
      set +e
      # Fetch the issue's current labels.
      ISSUE_DATA=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE" 2>/dev/null)
      if [ -z "$ISSUE_DATA" ]; then
        echo "FAIL: can't fetch issue #$BOUCLE_ISSUE" >&2
        exit 1
      fi
      ISSUE_STATE=$(echo "$ISSUE_DATA" | jq -r '.state // "unknown"')
      ISSUE_LABELS=$(echo "$ISSUE_DATA" | jq -r '.labels | join(",")')

      # If the issue is already closed, nothing to catch up — idempotence.
      if [ "$ISSUE_STATE" = "closed" ]; then
        echo "Issue #$BOUCLE_ISSUE already closed — nothing to catch up."
        exit 0
      fi

      # Determine the current boucle:* detail label (not the gross-axis
      # boucle::status::* labels, which also start with "boucle:").
      CURRENT_BOUCLE=$(echo "$ISSUE_LABELS" | tr ',' '\n' | grep -E '^boucle:(triage|needs-info|spec-review|todo|working|review|approval|merging|done|human|split|blocked)$' | head -1)

      case "$CURRENT_BOUCLE" in
        approval)
          # Happy path: the issue was waiting for approval and the human
          # merged directly. Trust the judgment → mark done.
          set_boucle_label "$BOUCLE_ISSUE" "boucle:done" "boucle::status::done"
          TARGET="done"
          ;;
        triage|needs-info|spec-review|todo|working|review|merging)
          # Merged before the loop finished its review. Honest signal: the
          # bot did not validate completion → mark human. Still close +
          # cascade so the issue doesn't stay stuck.
          set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
          TARGET="human"
          ;;
        done|human|split|blocked)
          # Already at a terminal state — issue was handled by another path.
          echo "Issue #$BOUCLE_ISSUE already at terminal state boucle:$CURRENT_BOUCLE — skipping."
          exit 0
          ;;
        "")
          # No boucle label — issue is outside the loop. Don't touch it.
          echo "Issue #$BOUCLE_ISSUE has no boucle label — outside the loop, skipping."
          exit 0
          ;;
      esac

      echo "Catchup: issue #$BOUCLE_ISSUE was boucle:$CURRENT_BOUCLE → now boucle:$TARGET"

      # If there is an OPEN MR with the same branch, the issue was reopened
      # for a new iteration (e.g. human requested changes after approval, or
      # a new MR was created after the first one was merged). Do NOT close —
      # the open MR is the active work. This prevents the catchup from
      # re-closing a reopened issue when an old merged MR exists alongside
      # the new open one.
      MR_OPEN_STATE=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/merge_requests?source_branch=boucle/$BOUCLE_ISSUE&state=opened" 2>/dev/null \
        | jq -r '.[0].state // empty')
      if [ "$MR_OPEN_STATE" = "opened" ]; then
        echo "Catchup: open MR exists for branch boucle/$BOUCLE_ISSUE — issue reopened for new iteration, skipping close."
        exit 0
      fi

      # Post an audit comment (with hidden tag for idempotence/audit).
      # The MR IID isn't passed as a variable (dispatch only forwards
      # BOUCLE_ISSUE + BOUCLE_ROLE); reference the issue + branch instead.
      AUDIT_BODY="<!-- boucle:catchup v=1 iid=$BOUCLE_ISSUE state=$CURRENT_BOUCLE target=$TARGET -->"$'\n'"🤖 Rattrapage automatique — la MR sur la branche \`boucle/$BOUCLE_ISSUE\` a été fusionnée directement sans passer par le circuit d'approbation."$'\n\n'"État de l'issue au moment de la fusion : \`boucle:$CURRENT_BOUCLE\`."$'\n'"Issue marquée \`boucle:$TARGET\` et fermée."
      glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
        -f body="$AUDIT_BODY" > /dev/null 2>&1 || true

      # Close the issue (boucle:done is a board label, not a GitLab close state).
      close_issue "$BOUCLE_ISSUE"
      echo "Catchup: closed issue #$BOUCLE_ISSUE"

      # Cascade: if this is a sub-issue, close the parent when all siblings are closed.
      maybe_close_parent "$BOUCLE_ISSUE"
  timeout: 5m

# ── Deploy (on push to master) ─────────────────────────────────────────
deploy:
  stage: deploy
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - |
      # Disable pipefail: grep in $(...) exits 1 on no-match, killing the script under set -eo pipefail. Without pipefail, the var is just empty (which we handle).
      set +o pipefail
      eval "$BOUCLE_BUILD_CMD"
      # Deploy to production (configurable via BOUCLE_DEPLOY_CMD, force master branch)
      BRANCH=master
      DEPLOY_URL=$(eval "$BOUCLE_DEPLOY_CMD" 2>&1 | grep -oE "$BOUCLE_DEPLOY_URL_REGEX" | head -1)

      # Assert: deployment URL returns 200 (production domain may not have DNS yet)
      if [ -z "$DEPLOY_URL" ]; then
        echo "FAIL: no deployment URL from wrangler" >&2; exit 1
      fi
      if ! curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL" | grep -q "200"; then
        echo "FAIL: deployment URL $DEPLOY_URL not 200" >&2; exit 1
      fi
      echo "Deployed to $DEPLOY_URL (200 OK)"

      # Chain to e2e with the deployment URL (production domain may not have DNS yet)
      curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
        -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
        -F "variables[BOUCLE_ROLE]=e2e" \
        -F "variables[BOUCLE_LIVE_URL]=$DEPLOY_URL" > /dev/null
  timeout: 10m

# ── E2E (after deploy) ─────────────────────────────────────────────────
e2e:
  stage: verify
  resource_group: boucle-issue-$BOUCLE_ISSUE
  needs:
    - job: dispatch
      optional: true
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "e2e"
  script:
    - |
      # Disable pipefail: grep in $(...) exits 1 on no-match, killing the script under set -eo pipefail. Without pipefail, the var is just empty (which we handle).
      set +o pipefail
      export BOUCLE_ISSUE="${BOUCLE_ISSUE:-}"
      # Use deployment URL passed from deploy job (production domain may not have DNS yet)
      LIVE_URL="${BOUCLE_LIVE_URL:-$BOUCLE_PRODUCTION_URL}"
      export BOUCLE_LIVE_URL="$LIVE_URL"
      echo "E2E testing URL: $LIVE_URL"

      # Label helper: preserve non-boucle labels when writing a boucle label.
      # The jq filter uses startswith("boucle:") which catches BOTH the detail
      # axis (boucle:triage) AND the gross axis (boucle::status::bot, also
      # starts with "boucle:"), so we strip all boucle-managed labels when
      # writing a new pair. Caller passes detail as $2 and gross as $3.
      # Tolerate glab non-zero exit (version warnings, transient API errors).
      set_boucle_label() {
        local iid="$1" new="$2" gross="$3"
        local current resp current_all
        resp=$(set +e; glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid" 2>/dev/null) || true
        if echo "$new" | grep -q "size:"; then
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") or startswith("size:") | not)) | join(",")' 2>/dev/null) || true
        else
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") | not)) | join(",")' 2>/dev/null) || true
        fi
        current_all=$(echo "$resp" | jq -r '.labels | join(",")' 2>/dev/null) || true
        # Idempotence: skip the PUT when every label in "$new,$gross" is already
        # on the issue. GitLab records a Resource Label Event on every PUT even
        # if the label set is unchanged — this guard prevents the no-op writes
        # that surface as spurious "status changes" on the board.
        local all_present=true lbl
        for lbl in $(echo "$new,$gross" | tr ',' ' '); do
          [ -z "$lbl" ] && continue
          echo "$current_all" | tr ',' '\n' | grep -qx "$lbl" || { all_present=false; break; }
        done
        [ "$all_present" = true ] && return 0
        local merged="${current:+$current,}$new,$gross"
        glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$iid" -f labels="$merged" > /dev/null 2>&1 || true
        # When the issue moves to the bot side, assign it to the bot user so
        # the board reflects who owns the next action and humans aren't spammed.
        # BOUCLE_BOT_ID is the GitLab user ID of the bot (set via bin/setup).
        # Best-effort: skip silently if unset (backward compat with setups
        # that haven't run bin/setup --bot-id yet).
        if [ "$gross" = "boucle::status::bot" ] && [ -n "${BOUCLE_BOT_ID:-}" ]; then
          curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$iid" \
            --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
            --data-urlencode "assignee_ids[]=$BOUCLE_BOT_ID" 2>/dev/null || true
        fi
      }

      # Close a GitLab issue (boucle:done is a board label, not a close state)
      close_issue() {
        local iid="$1"
        glab api --hostname $BOUCLE_FORGE_HOST -X PUT "/projects/$CI_PROJECT_ID/issues/$iid" \
          -f state_event=close > /dev/null 2>&1 || true
      }

      # List child work items of a parent. Returns JSON array (empty on failure).
      # Each child has .iid, .state ("opened"|"closed"), .title.
      # NOTE: glab may exit 0 on HTTP 403 (work_item_rest_api feature flag
      # disabled) and print the error JSON to stdout; validate array shape.
      get_work_item_children() {
        local parent_iid="$1" children out
        children=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/-/work_items/$parent_iid/children" 2>/dev/null) || { echo "[]"; return; }
        out=$(printf '%s' "$children" | jq -c 'if type == "array" then . else [] end' 2>/dev/null)
        printf '%s' "${out:-[]}"
      }

      # Parent-close cascade: if this issue is a sub-issue (has a "## Parent issue"
      # section in its body), check whether ALL its sibling sub-issues are closed.
      # If so, close the parent too. No-op if the issue is not a sub-issue.
      maybe_close_parent() {
        local child_iid="$1"
        # Parse parent IID from the sub-issue body ("## Parent issue\n#N — <url>")
        local child_data parent_iid
        child_data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$child_iid" 2>/dev/null) || { echo "maybe_close_parent: can't fetch issue #$child_iid — skipping."; return 0; }
        parent_iid=$(echo "$child_data" | jq -r '.description // empty' | awk '/^## Parent issue[[:space:]]*$/{f=1;next}/^## /{f=0}f' | grep -oE '#[0-9]+' | head -1 | tr -d '#')
        if [ -z "$parent_iid" ]; then
          echo "maybe_close_parent: no parent issue link in #$child_iid — not a sub-issue."
          return 0
        fi

        # Fetch parent; skip if already closed
        local parent_data parent_state
        parent_data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$parent_iid" 2>/dev/null) || { echo "maybe_close_parent: can't fetch parent #$parent_iid — skipping."; return 0; }
        parent_state=$(echo "$parent_data" | jq -r '.state')
        if [ "$parent_state" = "closed" ]; then
          echo "maybe_close_parent: parent #$parent_iid already closed."
          return 0
        fi

        # Check children via the work-items hierarchy API (source of truth).
        # The children endpoint returns each child's .state directly, so we
        # can check all siblings in one call. Fall back to the legacy
        # split-parent marker comment and REST links for data produced by
        # older boucle versions that didn't use the hierarchy API.
        local children_data sibling_iids
        children_data=$(get_work_item_children "$parent_iid")
        sibling_iids=$(echo "$children_data" | jq -r '[.[].iid] | join(",")' 2>/dev/null)
        if [ -z "$sibling_iids" ]; then
          # No children via hierarchy API — fall back to legacy marker comment
          local parent_notes
          parent_notes=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$parent_iid/notes" 2>/dev/null) || { echo "maybe_close_parent: can't fetch parent notes — skipping."; return 0; }
          sibling_iids=$(echo "$parent_notes" | jq -r '[.[] | select(.body | contains("<!-- boucle:split-parent"))] | first | .body // empty' | grep -oE 'iids=[0-9,]+' | cut -d= -f2)
          if [ -z "$sibling_iids" ]; then
            # No legacy marker either — fall back to REST issue links API
            echo "maybe_close_parent: no children via hierarchy API and no split-parent marker on #$parent_iid — checking REST links..."
            local links_data
            links_data=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$parent_iid/links" 2>/dev/null) || links_data="[]"
            sibling_iids=$(echo "$links_data" | jq -r '[.[] | select(.iid != null) | .iid] | join(",")')
            if [ -z "$sibling_iids" ]; then
              echo "maybe_close_parent: parent #$parent_iid has no children, no marker, and no REST links — can't check siblings."
              return 0
            fi
            echo "maybe_close_parent: found $sibling_iids via REST links fallback"
            # REST links fallback: check each sibling state individually
            local all_closed=true iid
            for iid in $(echo "$sibling_iids" | tr ',' ' '); do
              local sib_state
              sib_state=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid" 2>/dev/null | jq -r '.state // "unknown"')
              if [ "$sib_state" != "closed" ]; then
                echo "maybe_close_parent: sibling #$iid is $sib_state — parent #$parent_iid stays open."
                all_closed=false
                break
              fi
            done
            if [ "$all_closed" = "true" ]; then
              echo "maybe_close_parent: all sub-issues of #$parent_iid are closed — closing parent."
              close_issue "$parent_iid"
            fi
            return 0
          fi
          echo "maybe_close_parent: found $sibling_iids via legacy split-parent marker"
          # Legacy marker fallback: check each sibling state individually
          local all_closed=true iid
          for iid in $(echo "$sibling_iids" | tr ',' ' '); do
            local sib_state
            sib_state=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$iid" 2>/dev/null | jq -r '.state // "unknown"')
            if [ "$sib_state" != "closed" ]; then
              echo "maybe_close_parent: sibling #$iid is $sib_state — parent #$parent_iid stays open."
              all_closed=false
              break
            fi
          done
          if [ "$all_closed" = "true" ]; then
            echo "maybe_close_parent: all sub-issues of #$parent_iid are closed — closing parent."
            close_issue "$parent_iid"
          fi
          return 0
        fi

        # Hierarchy API path: children response includes .state directly,
        # so we can check all siblings in one call (no per-sibling fetch).
        local all_closed=true
        local open_count
        open_count=$(echo "$children_data" | jq '[.[] | select(.state != "closed")] | length' 2>/dev/null || echo 1)
        if [ "${open_count:-1}" -gt 0 ]; then
          local open_iids
          open_iids=$(echo "$children_data" | jq -r '[.[] | select(.state != "closed") | .iid] | join(",")')
          echo "maybe_close_parent: open sub-issue(s) #$open_iids — parent #$parent_iid stays open."
          all_closed=false
        fi
        if [ "$all_closed" = "true" ]; then
          echo "maybe_close_parent: all sub-issues of #$parent_iid are closed — closing parent."
          close_issue "$parent_iid"
        fi
      }

      # Deploy-triggered e2e: no issue context. Run a deterministic HTTP smoke test.
      if [ -z "${BOUCLE_ISSUE:-}" ]; then
        echo "Deploy-triggered e2e — no issue context. Running HTTP smoke test."
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BOUCLE_LIVE_URL")
        if [ "$HTTP_CODE" = "200" ]; then
          echo "E2E smoke test PASS — $BOUCLE_LIVE_URL returns 200"
          exit 0
        else
          echo "E2E smoke test FAIL — $BOUCLE_LIVE_URL returns $HTTP_CODE" >&2
          exit 1
        fi
      fi

      # Run the agent on the live URL.
      # Tolerate non-zero exit: the agent may post a valid verdict (PASS/FAIL)
      # yet exit non-zero (e.g. pi cleanup, glab "new version" warning on
      # stderr). We verify the verdict from the issue comment below, so the
      # agent exit code is not authoritative.
      # Capture the highest e2e verdict note ID that existed BEFORE this run,
      # so we can collapse duplicate v2 verdicts below.
      PRE_RUN_VERDICT_ID=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" --paginate \
        | jq -r '[.[] | select(.body | test("<!-- boucle:verdict")) | select(.body | test("role=e2e")) | .id] | max // 0' 2>/dev/null || echo 0)
      echo "PRE_RUN_VERDICT_ID=$PRE_RUN_VERDICT_ID"

      ./bin/oc e2e || true

      # Disable errexit for the post-agent section: the verdict parsing and
      # label/close calls below are all best-effort. GitLab Runner runs - |
      # blocks with `set -eo pipefail`, so a non-zero from grep (no match),
      # glab (API error), or jq (bad JSON) would kill the script before the
      # case statement can route to PASS/FAIL/UNCERTAIN. We handle errors
      # explicitly per-command instead.
      set +e
      # Parse verdict from agent output (bin/oc logs to stdout)
      # If BOUCLE_ISSUE is set, parse from issue comment; otherwise from agent stdout.
      # Tolerate glab/jq non-zero exit (glab may warn about version updates on
      # stderr; jq may error on unexpected JSON). An empty COMMENT → empty VERDICT
      # → UNCERTAIN branch, which is safe.
      COMMENT=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes?order_by=created_at&sort=desc" 2>/dev/null \
        | jq -r '[.[] | select(.body | contains("<!-- boucle:verdict") and contains("role=e2e"))] | first | .body // empty' 2>/dev/null)
      VERDICT=$(echo "$COMMENT" | grep -oE '^VERDICT: (PASS|FAIL|UNCERTAIN)' | cut -d' ' -f2)

      # ── Log-scraping fallback (step-limit recovery) ──────────────────
      # If the agent drafted a verdict but ran out of steps before posting it
      # (VERDICT empty), scrape the drafted verdict from the agent's stdout log
      # and post it ourselves. Mirrors the reviewer job's fallback.
      if [ -z "$VERDICT" ]; then
        AGENT_LOG="$CI_PROJECT_DIR/.boucle/$BOUCLE_ISSUE/agent-output.log"
        if [ -f "$AGENT_LOG" ]; then
          DRAFTED_VERDICT=$(awk '
            /^<!-- boucle:verdict v=1 role=e2e/ { found=1 }
            found { print; if ($0 ~ /^VERDICT: (PASS|FAIL|UNCERTAIN)/) { exit } }
          ' "$AGENT_LOG" 2>/dev/null || echo "")
          # If no boucle:verdict found, try the boucle:draft marker (first-pass
          # draft posted early per the post-early rule). Promote it to a
          # verdict by replacing the draft marker with the verdict marker.
          if [ -z "$DRAFTED_VERDICT" ]; then
            DRAFTED_VERDICT=$(awk '
              /^<!-- boucle:draft role=e2e -->/ { found=1 }
              found { print; if ($0 ~ /^VERDICT: (PASS|FAIL|UNCERTAIN)/) { exit } }
            ' "$AGENT_LOG" 2>/dev/null || echo "")
            if [ -n "$DRAFTED_VERDICT" ]; then
              echo "[boucle] WARN: no boucle:verdict in log — promoting boucle:draft to verdict (step-limit fallback)."
              DRAFTED_VERDICT=$(printf '%s' "$DRAFTED_VERDICT" | sed "s|<!-- boucle:draft role=e2e -->|<!-- boucle:verdict v=1 role=e2e sha=$MR_HEAD -->|")
              # If the promoted draft has no VERDICT line, default to UNCERTAIN
              # (the agent posted a draft checklist but ran out of steps before
              # posting a final verdict with a VERDICT: line).
              if ! echo "$DRAFTED_VERDICT" | grep -qiE '^VERDICT: (PASS|FAIL|UNCERTAIN)'; then
                DRAFTED_VERDICT="$(printf '%s\n\nVERDICT: UNCERTAIN\n' "$DRAFTED_VERDICT")"
                echo "[boucle] WARN: promoted e2e draft had no VERDICT line — defaulting to UNCERTAIN."
              fi
            fi
          fi
          if [ -n "$DRAFTED_VERDICT" ] && echo "$DRAFTED_VERDICT" | grep -qiE '^VERDICT: (PASS|FAIL|UNCERTAIN)'; then
            echo "[boucle] Recovering drafted e2e verdict from agent log (step-limit fallback)."
            DRAFTED_VERDICT=$(echo "$DRAFTED_VERDICT" | sed '/^```$/d')
            glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
              -f body="$DRAFTED_VERDICT" > /dev/null 2>&1 || true
            COMMENT=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes?order_by=created_at&sort=desc" 2>/dev/null \
              | jq -r '[.[] | select(.body | contains("<!-- boucle:verdict") and contains("role=e2e"))] | first | .body // empty' 2>/dev/null)
            VERDICT=$(echo "$COMMENT" | grep -oE '^VERDICT: (PASS|FAIL|UNCERTAIN)' | cut -d' ' -f2)
            if [ -n "$VERDICT" ]; then
              echo "[boucle] Step-limit fallback succeeded: recovered e2e verdict=$VERDICT."
            else
              echo "[boucle] Step-limit fallback failed: drafted verdict had no parsable VERDICT line."
            fi
          fi
        fi
      fi

      # Collapse duplicate e2e verdicts (agent may post a v2; CI replaces the first).
      ./bin/collapse-duplicate-notes e2e "$CI_PROJECT_ID" "$BOUCLE_ISSUE" "$PRE_RUN_VERDICT_ID" "$BOUCLE_FORGE_HOST"

      case "$VERDICT" in
        PASS)
          set_boucle_label "$BOUCLE_ISSUE" "boucle:done" "boucle::status::done"
          # boucle:done is a board label, not a GitLab close state — close the issue too
          close_issue "$BOUCLE_ISSUE"
          # If this issue is a sub-issue, check whether all siblings are closed
          # and close the parent when the last sub-issue completes.
          maybe_close_parent "$BOUCLE_ISSUE"
          ;;
        FAIL)
          # Loop closure: open a new issue in triage with the trace.
          # Title includes the original issue title so the new issue is
          # identifiable in the board without opening it.
          E2E_ORIG_DATA=$(glab api --hostname $BOUCLE_FORGE_HOST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE" 2>/dev/null || true)
          E2E_ORIG_TITLE=$(printf '%s' "$E2E_ORIG_DATA" | jq -r '.title // empty' | tr '\r\n\t' '   ' | sed 's/  */ /g; s/^ //; s/ $//' | cut -c1-60 | sed 's/ [^ ]*$//')
          # Inherit the parent linkage from the original issue so the follow-up
          # resolves to the same human author via resolve_reporter_id (which
          # walks one level up: issue → parent → parent.author.id). Without this,
          # the follow-up's author is the bot and the reviewer PASS branch
          # assigns the MR to the bot instead of the human.
          E2E_PARENT_IID=$(printf '%s' "$E2E_ORIG_DATA" | jq -r '.description // empty' | awk '/^## Parent issue[[:space:]]*$/{f=1;next}/^## /{f=0}f' | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          E2E_PARENT_SECTION=""
          if [ -n "$E2E_PARENT_IID" ]; then
            E2E_PARENT_SECTION="

      ## Parent issue
      #$E2E_PARENT_IID"
          fi
          E2E_NEW_TITLE="fix: ${E2E_ORIG_TITLE:-issue} — E2E failure (#$BOUCLE_ISSUE)"
          E2E_NEW_JSON=$(glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues" \
            -f title="$E2E_NEW_TITLE" \
            -f description="E2E verification failed for issue #$BOUCLE_ISSUE.

      ## Trace
      $(echo "$COMMENT")

      ## Live URL
      $LIVE_URL${E2E_PARENT_SECTION}" \
            -f labels="boucle:triage,boucle::status::bot" 2>/dev/null) || E2E_NEW_JSON=""
          # Assign the new follow-up issue to the bot (it's on the bot side).
          E2E_NEW_IID=$(printf '%s' "$E2E_NEW_JSON" | jq -r '.iid // empty' 2>/dev/null || true)
          if [ -n "$E2E_NEW_IID" ] && [ "$E2E_NEW_IID" != "null" ] && [ -n "${BOUCLE_BOT_ID:-}" ]; then
            curl -s -o /dev/null -X PUT "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/issues/$E2E_NEW_IID" \
              --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
              --data-urlencode "assignee_ids[]=$BOUCLE_BOT_ID" 2>/dev/null || true
          fi
          # Close the original issue: work is transferred to the follow-up.
          # Post a link comment so the human can trace from #29 → #32, then
          # close #29 and cascade the parent (mirrors PASS branch behavior).
          E2E_LINK_BODY="<!-- boucle:e2e-fail v=1 iid=$BOUCLE_ISSUE followup=$E2E_NEW_IID -->
      E2E verification FAILED. A follow-up issue #$E2E_NEW_IID has been opened in triage to fix the defect.

      ## Live URL
      ${BOUCLE_LIVE_URL:-unknown}

      ## E2E trace
      \`\`\`
      $(printf '%s' "${COMMENT:-}" | head -c 4000)
      \`\`\`

      Closing this issue — work continues in #$E2E_NEW_IID."
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="$E2E_LINK_BODY" > /dev/null 2>&1 || true
          set_boucle_label "$BOUCLE_ISSUE" "boucle:done" "boucle::status::done"
          close_issue "$BOUCLE_ISSUE"
          maybe_close_parent "$BOUCLE_ISSUE"
          ;;
        UNCERTAIN)
          # Genuinely UNCERTAIN verdict (agent posted VERDICT: UNCERTAIN).
          # NOT a catch-all for empty VERDICT — see reviewer job + AGENTS.md
          # lesson #43. Empty VERDICT is handled by the post-case assertion
          # below (re-trigger e2e or escalate to human).
          set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
          # Post a human-facing explanation so the human knows why the issue
          # landed at boucle:human. Without this, the human sees only the label
          # change with no context.
          E2E_TRACE=$(printf '%s' "${COMMENT:-}" | head -c 4000)
          E2E_ESCALATION_BODY="<!-- boucle:e2e-escalation v=1 iid=$BOUCLE_ISSUE verdict=uncertain -->
      E2E verification could not reach a confident verdict. Human review needed.

      ## Live URL
      ${BOUCLE_LIVE_URL:-unknown}

      ## Agent trace (truncated)
      \`\`\`
      ${E2E_TRACE:-no verdict comment was posted by the agent}
      \`\`\`"
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="$E2E_ESCALATION_BODY" > /dev/null 2>&1 || true
          ;;
      esac

      if [ -z "$VERDICT" ]; then
        # Post a human-facing explanation before failing the job. The agent
        # ran but posted no parsable verdict (step limit, crash, or empty
        # output). Without this comment the human sees only a failed pipeline.
        ITERATION="${BOUCLE_ITERATION:-1}"
        MAX_ITER="${BOUCLE_MAX_ITERATIONS:-3}"
        E2E_LOG_TAIL=""
        AGENT_LOG="$CI_PROJECT_DIR/.boucle/$BOUCLE_ISSUE/agent-output.log"
        if [ -f "$AGENT_LOG" ]; then
          E2E_LOG_TAIL=$(tail -c 4000 "$AGENT_LOG" 2>/dev/null || echo "")
        fi
        if [ "$ITERATION" -lt "$MAX_ITER" ]; then
          echo "Re-triggering e2e (iteration $((ITERATION+1))/$MAX_ITER)."
          curl -s -X POST "https://$BOUCLE_FORGE_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline" \
            -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
            -F "variables[BOUCLE_ISSUE]=$BOUCLE_ISSUE" -F "variables[BOUCLE_ROLE]=e2e" \
            -F "variables[BOUCLE_ITERATION]=$((ITERATION+1))" > /dev/null
        else
          set_boucle_label "$BOUCLE_ISSUE" "boucle:human" "boucle::status::human"
          E2E_ESCALATION_BODY="<!-- boucle:e2e-escalation v=1 iid=$BOUCLE_ISSUE verdict=empty -->
      E2E agent did not post a parsable verdict after $MAX_ITER attempts. Human review needed.

      The agent ran against \`${BOUCLE_LIVE_URL:-the live URL}\` but exited without posting a \`VERDICT:\` comment. This usually means it hit the step limit or crashed before completing.

      ## Live URL
      ${BOUCLE_LIVE_URL:-unknown}

      ## Agent log tail (last 4000 chars)
      \`\`\`
      ${E2E_LOG_TAIL:-no agent log was captured}
      \`\`\`"
          glab api --hostname $BOUCLE_FORGE_HOST -X POST "/projects/$CI_PROJECT_ID/issues/$BOUCLE_ISSUE/notes" \
            -f body="$E2E_ESCALATION_BODY" > /dev/null 2>&1 || true
        fi
        echo "FAIL: e2e verdict not parsable" >&2; exit 1
      fi
  timeout: 20m

# ── Doctor (scheduled recovery) ──────────────────────────────────────────
# Runs on a schedule (every 10 min). Detects orphaned triages: issues with
# boucle:needs-info label that have a human reply after the last triage
# comment. Re-triggers triage for them. Also detects stuck boucle:triage
# issues with no active pipeline (canceled before dispatch ran).
doctor:
  stage: verify
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    # Only run on scheduled pipelines (not webhook/trigger pipelines)
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      # Disable pipefail: grep in $(...) exits 1 on no-match, killing the script under set -eo pipefail. Without pipefail, the var is just empty (which we handle).
      set +o pipefail
      HOST="$BOUCLE_FORGE_HOST"
      PID="$CI_PROJECT_ID"
      RECOVERED=0
      # Emoji reactions that count as spec approval (GitLab internal alpha codes).
      # Must mirror the dispatch job's constant — each CI job runs its own shell.
      BOUCLE_SPEC_APPROVAL_EMOJIS="thumbsup|white_check_mark|ballot_box_with_check|heavy_check_mark|ok|ok_hand"

      # Label helper: preserve non-boucle labels when writing a boucle label.
      # Same definition as the other jobs — included here so the doctor can
      # call it (it calls set_boucle_label below for spec-review and orphan
      # recovery). Also assigns the issue to the bot when moving to the bot
      # side, matching the behavior of the rest of the loop.
      set_boucle_label() {
        local iid="$1" new="$2" gross="$3"
        local current resp current_all
        resp=$(glab api --hostname "$HOST" "/projects/$PID/issues/$iid")
        if echo "$new" | grep -q "size:"; then
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") or startswith("size:") | not)) | join(",")')
        else
          current=$(echo "$resp" | jq -r '.labels | map(select(startswith("boucle:") | not)) | join(",")')
        fi
        current_all=$(echo "$resp" | jq -r '.labels | join(",")')
        # Idempotence: skip the PUT when every label in "$new,$gross" is already
        # on the issue. GitLab records a Resource Label Event on every PUT even
        # if the label set is unchanged — this guard prevents the no-op writes
        # that surface as spurious "status changes" on the board.
        local all_present=true lbl
        for lbl in $(echo "$new,$gross" | tr ',' ' '); do
          [ -z "$lbl" ] && continue
          echo "$current_all" | tr ',' '\n' | grep -qx "$lbl" || { all_present=false; break; }
        done
        [ "$all_present" = true ] && return 0
        local merged="${current:+$current,}$new,$gross"
        glab api --hostname "$HOST" -X PUT "/projects/$PID/issues/$iid" -f labels="$merged" > /dev/null
        if [ "$gross" = "boucle::status::bot" ] && [ -n "${BOUCLE_BOT_ID:-}" ]; then
          curl -s -o /dev/null -X PUT "https://$HOST/api/v4/projects/$PID/issues/$iid" \
            --header "PRIVATE-TOKEN: $BOUCLE_TOKEN" \
            --data-urlencode "assignee_ids[]=$BOUCLE_BOT_ID" 2>/dev/null || true
        fi
      }

      # Check whether an active pipeline exists for a given BOUCLE_ISSUE.
      # Lists active pipelines (running/pending/created/waiting_for_resource/
      # preparing) and fetches each pipeline's variables to match
      # BOUCLE_ISSUE=<iid>. Returns 0 (true) if a matching active pipeline
      # exists, 1 (false) otherwise. Replaces the unreliable updated_at proxy:
      # updated_at is bumped by any issue activity (bot notes, label writes),
      # not just pipeline runs. The pipelines API exposes per-pipeline
      # variables via GET /projects/:id/pipelines/:pipeline_id/variables.
      issue_has_active_pipeline() {
        local iid="$1"
        local status pipeline_id vars
        for status in running pending created waiting_for_resource preparing; do
          for pipeline_id in $(glab api --hostname "$HOST" \
            "/projects/$PID/pipelines?status=$status&per_page=100" 2>/dev/null \
            | jq -r '.[].id' 2>/dev/null); do
            vars=$(glab api --hostname "$HOST" \
              "/projects/$PID/pipelines/$pipeline_id/variables" 2>/dev/null || echo "")
            if echo "$vars" | jq -e --arg iid "$iid" \
              '[.[] | select(.key == "BOUCLE_ISSUE" and .value == $iid)] | length > 0' \
              >/dev/null 2>&1; then
              return 0
            fi
          done
        done
        return 1
      }

      # Doctor-side dedup: track the last time the doctor triggered each
      # issue in $BOUCLE_STATE_CACHE/doctor-triggers/<iid>. Skip re-trigger
      # if the doctor already triggered this issue within the STALENESS
      # window — prevents the same issue from being re-fired every 10 min
      # while waiting for a queued pipeline to start. The active-pipeline
      # check (issue_has_active_pipeline) is the primary guard; this is a
      # secondary backstop for the case where a triggered pipeline is still
      # in `created`/`waiting_for_resource` but the variables API hasn't
      # caught up, or the pipeline was triggered but hasn't yet registered.
      doctor_should_skip_dedup() {
        local iid="$1" now_epoch last_epoch delta
        local cache_dir="${BOUCLE_STATE_CACHE:-.boucle-state}/doctor-triggers"
        local stamp_file="$cache_dir/$iid"
        now_epoch=$(date +%s)
        if [ -f "$stamp_file" ]; then
          last_epoch=$(cat "$stamp_file" 2>/dev/null || echo 0)
          delta=$((now_epoch - last_epoch))
          local staleness="${BOUCLE_STALENESS_THRESHOLD:-2400}"
          if [ "$delta" -lt "$staleness" ]; then
            echo "  → #$iid: doctor already triggered ${delta}s ago (< ${staleness}s) — dedup skip"
            return 0
          fi
        fi
        return 1
      }
      doctor_mark_triggered() {
        local iid="$1"
        local cache_dir="${BOUCLE_STATE_CACHE:-.boucle-state}/doctor-triggers"
        mkdir -p "$cache_dir" 2>/dev/null || true
        date +%s > "$cache_dir/$iid" 2>/dev/null || true
      }

      # Fetch all open issues with boucle:needs-info label
      NEEDS_INFO_ISSUES=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&labels=boucle:needs-info&per_page=100" \
        | jq -r '.[].iid')

      for IID in $NEEDS_INFO_ISSUES; do
        echo "Checking #$IID (boucle:needs-info)..."

        # Fetch notes for the issue (GitLab returns newest-first)
        NOTES=$(glab api --hostname "$HOST" "/projects/$PID/issues/$IID/notes")

        # Find the last triage comment (has <!-- boucle:triage marker)
        LAST_TRIAGE_NOTE_ID=$(echo "$NOTES" | jq -r '[.[] | select(.body | contains("<!-- boucle:triage"))] | first | .id // 0')

        # Find the last human (non-bot) note after the triage comment
        # A human reply means the reporter answered the blocking questions.
        # If that reply exists but the issue still has boucle:needs-info, the
        # triage pipeline was canceled/orphaned — re-trigger it.
        HUMAN_REPLY_AFTER_TRIAGE=$(echo "$NOTES" | jq -r --arg tid "$LAST_TRIAGE_NOTE_ID" '
          [.[] | select(.author.username != "up-bot") | select(.id > ($tid | tonumber))]
          | length
        ')

        if [ "$HUMAN_REPLY_AFTER_TRIAGE" -gt 0 ]; then
          echo "  → #$IID has a human reply after last triage comment — orphaned triage detected"
          # Active-pipeline guard: skip if a pipeline for this issue is
          # already running/pending/created. Prevents the doctor from
          # firing duplicate triggers every 10 min while a previous one
          # is still queued in resource_group.
          if issue_has_active_pipeline "$IID"; then
            echo "  → #$IID: active pipeline already running — skipping re-trigger"
            continue
          fi
          if doctor_should_skip_dedup "$IID"; then
            continue
          fi
          # Re-trigger: set boucle:triage label (preserve non-boucle labels)
          set_boucle_label "$IID" "boucle:triage" "boucle::status::bot"
          # Trigger triage pipeline
          curl -s -X POST "https://$HOST/api/v4/projects/$PID/trigger/pipeline" \
            -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
            -F "variables[BOUCLE_ISSUE]=$IID" > /dev/null
          doctor_mark_triggered "$IID"
          echo "  → re-triggered triage for #$IID"
          RECOVERED=$((RECOVERED + 1))
        else
          echo "  → #$IID: no human reply after triage — still waiting for reporter"
        fi
      done

      # Recover orphaned boucle:spec-review issues: the author replied
      # (any non-bot note after the last triage comment) but the dispatch
      # pipeline was canceled/orphaned before it could trigger the worker.
      # Issue still has boucle:spec-review (dispatch didn't run to strip it).
      # Worker relabels to boucle:working on start, which clears it.
      SPEC_REVIEW_ISSUES=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&labels=boucle:spec-review&per_page=100" \
        | jq -r '.[].iid')

      for IID in $SPEC_REVIEW_ISSUES; do
        echo "Checking #$IID (boucle:spec-review) for spec approval..."
        NOTES=$(glab api --hostname "$HOST" "/projects/$PID/issues/$IID/notes")
        # Find the last triage comment (same as needs-info recovery above)
        LAST_TRIAGE_NOTE_ID=$(echo "$NOTES" | jq -r '[.[] | select(.body | contains("<!-- boucle:triage"))] | first | .id // 0')
        # Detect any non-bot note after the last triage comment
        HUMAN_REPLY_AFTER_TRIAGE=$(echo "$NOTES" | jq -r --arg tid "$LAST_TRIAGE_NOTE_ID" '
          [.[] | select(.author.username != "up-bot") | select(.id > ($tid | tonumber))]
          | length
        ')
        # Check for an approval emoji on the triage comment AND any standalone
        # spec-review note. The validation instructions are appended to the
        # triage comment itself (single message to read/approve), so the
        # "React with" lookup usually resolves to the same note as the triage
        # comment. The fallback path (triage note unresolved / PUT failed)
        # posts a standalone note — poll both to cover that case too.
        # Polls the award_emoji API — recovers even if the emoji webhook was
        # missed (emoji_events disabled or webhook delivery failed).
        SPEC_INVITE_NOTE_ID=$(echo "$NOTES" | jq -r '[.[] | select(.body | contains("React with"))] | last | .id // 0')
        EMOJI_APPROVAL_FOUND=false
        for NOTE_ID in $LAST_TRIAGE_NOTE_ID $SPEC_INVITE_NOTE_ID; do
          [ "$NOTE_ID" = "0" ] || [ -z "$NOTE_ID" ] && continue
          AWARDS=$(glab api --hostname "$HOST" \
            "/projects/$PID/issues/$IID/notes/$NOTE_ID/award_emoji" 2>/dev/null)
          if echo "$AWARDS" | jq -e --arg emojis "$BOUCLE_SPEC_APPROVAL_EMOJIS" '
            [.[] | select(.user.username != "up-bot") | .name]
            | map(select(. as $n | ($emojis | split("|")) | index($n)))
            | length > 0
          ' >/dev/null 2>&1; then
            EMOJI_APPROVAL_FOUND=true
            break
          fi
        done
        if [ "$HUMAN_REPLY_AFTER_TRIAGE" -gt 0 ] || [ "$EMOJI_APPROVAL_FOUND" = true ]; then
          echo "  → #$IID approved (reply=$HUMAN_REPLY_AFTER_TRIAGE, emoji=$EMOJI_APPROVAL_FOUND) — re-triggering worker"
          if issue_has_active_pipeline "$IID"; then
            echo "  → #$IID: active pipeline already running — skipping re-trigger"
            continue
          fi
          if doctor_should_skip_dedup "$IID"; then
            continue
          fi
          set_boucle_label "$IID" "boucle:todo" "boucle::status::bot"
          curl -s -X POST "https://$HOST/api/v4/projects/$PID/trigger/pipeline" \
            -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
            -F "variables[BOUCLE_ISSUE]=$IID" -F "variables[BOUCLE_ROLE]=worker" > /dev/null
          doctor_mark_triggered "$IID"
          echo "  → re-triggered worker for #$IID"
          RECOVERED=$((RECOVERED + 1))
        else
          echo "  → #$IID: still waiting for author reply or approval emoji"
        fi
      done

      # Also check for stuck boucle:triage issues (triage label set but no
      # active pipeline running for them — e.g. pipeline was canceled).
      # These have boucle:triage but no matching running/created pipeline.
      TRIAGE_ISSUES=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&labels=boucle:triage&per_page=100" \
        | jq -r '.[].iid')

      for IID in $TRIAGE_ISSUES; do
        echo "Checking #$IID (boucle:triage) for stuck pipeline..."
        # Check if there's a running/created pipeline for this issue.
        # We can't easily map pipelines to issues, so check if the triage
        # label has been stuck for >15 min (no triage comment posted recently).
        NOTES=$(glab api --hostname "$HOST" "/projects/$PID/issues/$IID/notes")
        LAST_TRIAGE_NOTE_ID=$(echo "$NOTES" | jq -r '[.[] | select(.body | contains("<!-- boucle:triage"))] | first | .id // 0')

        # If there's a recent triage comment (within last 15 min), skip —
        # triage may still be running. Only re-trigger if no triage comment
        # exists at all, or the last one is older than 15 min.
        LAST_TRIAGE_TIME=$(echo "$NOTES" | jq -r --arg tid "$LAST_TRIAGE_NOTE_ID" '
          [.[] | select(.id == ($tid | tonumber))] | first | .created_at // empty
        ' 2>/dev/null)

        if [ -n "$LAST_TRIAGE_TIME" ]; then
          # Parse ISO timestamp and compare to now-15min
          LAST_EPOCH=$(date -d "$LAST_TRIAGE_TIME" +%s 2>/dev/null || echo 0)
          NOW_EPOCH=$(date +%s)
          AGE=$((NOW_EPOCH - LAST_EPOCH))
          if [ "$AGE" -lt 900 ]; then
            echo "  → #$IID: last triage comment is ${AGE}s old (< 15 min) — still in progress, skipping"
            continue
          fi
        fi

        # No recent triage comment — re-trigger
        echo "  → #$IID: boucle:triage with no recent triage comment — re-triggering"
        if issue_has_active_pipeline "$IID"; then
          echo "  → #$IID: active pipeline already running — skipping re-trigger"
          continue
        fi
        if doctor_should_skip_dedup "$IID"; then
          continue
        fi
        curl -s -X POST "https://$HOST/api/v4/projects/$PID/trigger/pipeline" \
          -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
          -F "variables[BOUCLE_ISSUE]=$IID" > /dev/null
        doctor_mark_triggered "$IID"
        echo "  → re-triggered triage for #$IID"
        RECOVERED=$((RECOVERED + 1))
      done

      # Also detect orphaned triages: open issues with NO boucle label that
      # have a triage comment AND a human reply after it. This is the root
      # cause of issue #2 being stuck: triage ran, asked NEEDS-INFO, the user
      # replied, but the issue never got a boucle:needs-info label (e.g. the
      # triage pipeline was interrupted before labeling). The label-based
      # recovery above can't see these issues because they have no label
      # to filter on. Scan all unlabeled open issues for this pattern.
      echo "Scanning open issues without boucle labels for orphaned triages..."
      UNLABELED_ISSUES=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&per_page=100" \
        | jq -r '[.[] | select(.labels | map(startswith("boucle:")) | any | not)] | .[].iid')

      for IID in $UNLABELED_ISSUES; do
        echo "Checking #$IID (no boucle label) for orphaned triage..."
        NOTES=$(glab api --hostname "$HOST" "/projects/$PID/issues/$IID/notes")

        # Does this issue have any triage comment at all?
        LAST_TRIAGE_NOTE_ID=$(echo "$NOTES" | jq -r '[.[] | select(.body | contains("<!-- boucle:triage"))] | first | .id // 0')
        if [ "$LAST_TRIAGE_NOTE_ID" = "0" ]; then
          # No triage comment — this is a brand-new issue that was never
          # triaged. The dispatch job should pick it up on the next webhook.
          # Skip to avoid re-triaging issues that are mid-dispatch.
          continue
        fi

        # Is there a human reply after the last triage comment?
        HUMAN_REPLY_AFTER_TRIAGE=$(echo "$NOTES" | jq -r --arg tid "$LAST_TRIAGE_NOTE_ID" '
          [.[] | select(.author.username != "up-bot") | select(.id > ($tid | tonumber))]
          | length
        ')
        if [ "$HUMAN_REPLY_AFTER_TRIAGE" -eq 0 ]; then
          echo "  → #$IID: triage comment exists but no human reply — still waiting"
          continue
        fi

        # Orphaned triage detected: triage ran, user replied, but no boucle
        # label was set. Re-trigger triage so the agent can re-read the user's
        # answers and route the issue correctly this time.
        echo "  → #$IID: orphaned triage (triage comment + human reply, no boucle label) — re-triggering"
        if issue_has_active_pipeline "$IID"; then
          echo "  → #$IID: active pipeline already running — skipping re-trigger"
          continue
        fi
        if doctor_should_skip_dedup "$IID"; then
          continue
        fi
        set_boucle_label "$IID" "boucle:triage" "boucle::status::bot"
        curl -s -X POST "https://$HOST/api/v4/projects/$PID/trigger/pipeline" \
          -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
          -F "variables[BOUCLE_ISSUE]=$IID" > /dev/null
        doctor_mark_triggered "$IID"
        echo "  → re-triggered triage for #$IID"
        RECOVERED=$((RECOVERED + 1))
      done

      # List child work items of a parent via the hierarchy API.
      # NOTE: glab may exit 0 on HTTP 403 (work_item_rest_api feature flag
      # disabled) and print the error JSON to stdout; validate array shape.
      get_work_item_children() {
        local parent_iid="$1" children out
        children=$(glab api --hostname "$HOST" "/projects/$PID/-/work_items/$parent_iid/children" 2>/dev/null) || { echo "[]"; return; }
        out=$(printf '%s' "$children" | jq -c 'if type == "array" then . else [] end' 2>/dev/null)
        printf '%s' "${out:-[]}"
      }

      # ── Recover stuck boucle:working / boucle:review issues ────────────
      # A worker/reviewer pipeline can be interrupted (runner crash, manual
      # cancel, force-push mid-run) leaving the issue stuck at boucle:working
      # or boucle:review with no active pipeline. The dispatch job does NOT
      # re-route these labels (it only handles triage/todo/needs-info/spec-
      # review), so without this recovery the issue hangs forever. Re-trigger
      # the appropriate role if the label has been stale (configurable via
      # BOUCLE_STALENESS_THRESHOLD, default 300s/5min) with no matching role
      # pipeline currently running.
      echo "Scanning for stuck boucle:working / boucle:review issues..."
      STUCK_WORKING=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&labels=boucle:working&per_page=100" \
        | jq -r '.[].iid')
      STUCK_REVIEW=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&labels=boucle:review&per_page=100" \
        | jq -r '.[].iid')

      # Deferred todo issues: re-trigger when a worker slot frees up.
      # Only applies when BOUCLE_MAX_PARALLEL_ISSUES is set (> 0).
      MAX_PARALLEL="${BOUCLE_MAX_PARALLEL_ISSUES:-0}"
      if [ "$MAX_PARALLEL" -gt 0 ] 2>/dev/null; then
        WORKING_COUNT=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&labels=boucle:working&per_page=100" 2>/dev/null | jq 'length' 2>/dev/null || echo 0)
        if [ "$WORKING_COUNT" -lt "$MAX_PARALLEL" ]; then
          TODO_ISSUES=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&labels=boucle:todo&per_page=100" | jq -r '.[].iid')
          for IID in $TODO_ISSUES; do
            # Re-check working count each iteration (a previous trigger may have flipped it)
            WORKING_COUNT=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&labels=boucle:working&per_page=100" 2>/dev/null | jq 'length' 2>/dev/null || echo 0)
            if [ "$WORKING_COUNT" -ge "$MAX_PARALLEL" ]; then
              echo "  → slots full again ($WORKING_COUNT/$MAX_PARALLEL) — stopping todo recovery"
              break
            fi
            echo "  → #$IID (boucle:todo): slot available ($WORKING_COUNT/$MAX_PARALLEL) — triggering worker"
            if issue_has_active_pipeline "$IID"; then
              echo "  → #$IID: active pipeline already running — skipping re-trigger"
              continue
            fi
            if doctor_should_skip_dedup "$IID"; then
              continue
            fi
            curl -s -X POST "https://$HOST/api/v4/projects/$PID/trigger/pipeline" \
              -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
              -F "variables[BOUCLE_ISSUE]=$IID" -F "variables[BOUCLE_ROLE]=worker" > /dev/null
            doctor_mark_triggered "$IID"
            RECOVERED=$((RECOVERED + 1))
          done
        fi
      fi

      for IID in $STUCK_WORKING $STUCK_REVIEW; do
        # Determine which role to re-trigger based on the label.
        ISSUE_LABELS=$(glab api --hostname "$HOST" "/projects/$PID/issues/$IID" | jq -r '.labels | join(",")')
        if echo "$ISSUE_LABELS" | grep -q "boucle:working"; then
          ROLE="worker"
        elif echo "$ISSUE_LABELS" | grep -q "boucle:review"; then
          ROLE="reviewer"
        else
          continue
        fi

        # Check if a MR for this issue was already merged (branch boucle/$IID).
        # If so, the issue should be closed + boucle:done, NOT re-triggered.
        # This happens when a human merged the MR manually (bypassing the
        # merger job), leaving the issue stuck at working/review forever.
        #
        # BUT: if there is also an OPEN MR with the same branch, the issue was
        # reopened for a new iteration (e.g. human requested changes after
        # approval, or a new MR was created after the first one was merged).
        # In that case, do NOT close — the open MR is the active work.
        MR_STATE=$(glab api --hostname "$HOST" "/projects/$PID/merge_requests?source_branch=boucle/$IID&state=merged" 2>/dev/null \
          | jq -r '.[0].state // empty')
        if [ "$MR_STATE" = "merged" ]; then
          MR_OPEN_STATE=$(glab api --hostname "$HOST" "/projects/$PID/merge_requests?source_branch=boucle/$IID&state=opened" 2>/dev/null \
            | jq -r '.[0].state // empty')
          if [ "$MR_OPEN_STATE" = "opened" ]; then
            echo "  → #$IID ($ROLE): merged MR exists but an open MR also exists — issue reopened for new iteration, skipping close"
            continue
          fi
          echo "  → #$IID ($ROLE): MR already merged — closing issue + boucle:done"
          set_boucle_label "$IID" "boucle:done" "boucle::status::done"
          glab api --hostname "$HOST" -X PUT "/projects/$PID/issues/$IID" -f state_event=close > /dev/null 2>&1 || true
          RECOVERED=$((RECOVERED + 1))
          continue
        fi

        # Also detect closed (non-merged) MRs: the work was abandoned or
        # the user closed the MR rather than merging it. The loop should
        # still settle the issue rather than re-triggering the worker
        # forever (issue #34/#35 — the dispatch's close action now
        # escalates to boucle:human or stays terminal, but the doctor
        # needs to land the issue at boucle:done + close if the MR is
        # already closed at the moment of recovery).
        MR_CLOSED_STATE=$(glab api --hostname "$HOST" "/projects/$PID/merge_requests?source_branch=boucle/$IID&state=closed" 2>/dev/null \
          | jq -r '.[0].state // empty')
        if [ "$MR_CLOSED_STATE" = "closed" ]; then
          MR_OPEN_STATE=$(glab api --hostname "$HOST" "/projects/$PID/merge_requests?source_branch=boucle/$IID&state=opened" 2>/dev/null \
            | jq -r '.[0].state // empty')
          if [ "$MR_OPEN_STATE" = "opened" ]; then
            echo "  → #$IID ($ROLE): closed MR exists but an open MR also exists — issue reopened for new iteration, skipping close"
            continue
          fi
          echo "  → #$IID ($ROLE): MR already closed (non-merged) — closing issue + boucle:done"
          set_boucle_label "$IID" "boucle:done" "boucle::status::done"
          glab api --hostname "$HOST" -X PUT "/projects/$PID/issues/$IID" -f state_event=close > /dev/null 2>&1 || true
          RECOVERED=$((RECOVERED + 1))
          continue
        fi

        # Active-pipeline check: skip if a pipeline with BOUCLE_ISSUE=$IID is
        # already running/pending/created. Replaces the unreliable updated_at
        # proxy (bumped by any issue activity, not just pipeline runs). The
        # pipelines API exposes per-pipeline variables, so we can confirm a
        # running worker/reviewer belongs to THIS issue — no false positives.
        if issue_has_active_pipeline "$IID"; then
          echo "  → #$IID ($ROLE): active pipeline already running — skipping re-trigger"
          continue
        fi
        # Staleness backstop: only re-trigger if the issue has been stuck
        # (no active pipeline) for longer than STALENESS. This catches the
        # case where a pipeline finished but the label was never advanced
        # (e.g. runner crashed mid-job before the label write).
        UPDATED_AT=$(glab api --hostname "$HOST" "/projects/$PID/issues/$IID" | jq -r '.updated_at')
        UPDATED_EPOCH=$(date -d "$UPDATED_AT" +%s 2>/dev/null || echo 0)
        NOW_EPOCH=$(date +%s)
        AGE=$((NOW_EPOCH - UPDATED_EPOCH))
        STALENESS="${BOUCLE_STALENESS_THRESHOLD:-2400}"
        if [ "$AGE" -lt "$STALENESS" ]; then
          echo "  → #$IID ($ROLE): issue updated ${AGE}s ago (< ${STALENESS}s) — may still be processing, skipping"
          continue
        fi
        # Doctor-side dedup: skip if the doctor already triggered this issue
        # within the STALENESS window. Secondary backstop for the case where
        # a triggered pipeline is in `created`/`waiting_for_resource` but the
        # variables API hasn't caught up yet.
        if doctor_should_skip_dedup "$IID"; then
          continue
        fi

        echo "  → #$IID ($ROLE): stuck for ${AGE}s — re-triggering $ROLE"
        curl -s -X POST "https://$HOST/api/v4/projects/$PID/trigger/pipeline" \
          -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
          -F "variables[BOUCLE_ISSUE]=$IID" -F "variables[BOUCLE_ROLE]=$ROLE" > /dev/null
        doctor_mark_triggered "$IID"
        echo "  → re-triggered $ROLE for #$IID"
        RECOVERED=$((RECOVERED + 1))
      done

      # ── Recover CLOSED issues stuck at boucle:working/boucle:review ──
      # The doctor's main scan filters state=opened, so a closed issue that
      # still has boucle:working or boucle:review is invisible. This happens
      # when a human merges the MR directly (catchup closes the issue) while
      # a worker iteration is in flight — the worker's rebase-conflict
      # re-trigger or the reviewer FAIL handler re-triggers the worker on
      # the closed issue, creating zombie MRs and failed pipeline cascades.
      # Recovery: set boucle:done + close any open zombie MRs.
      ZOMBIE_WORKING=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=closed&labels=boucle:working&per_page=100" 2>/dev/null | jq -r '.[].iid' 2>/dev/null)
      ZOMBIE_REVIEW=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=closed&labels=boucle:review&per_page=100" 2>/dev/null | jq -r '.[].iid' 2>/dev/null)
      for IID in $ZOMBIE_WORKING $ZOMBIE_REVIEW; do
        echo "  → #$IID: closed but stuck at working/review — zombie recovery"
        # Close any open MR on the boucle/$IID branch (zombie MR created by
        # the worker running on the closed issue).
        ZOMBIE_MR_IID=$(glab api --hostname "$HOST" "/projects/$PID/merge_requests?source_branch=boucle/$IID&state=opened" 2>/dev/null | jq -r '.[0].iid // empty')
        if [ -n "$ZOMBIE_MR_IID" ]; then
          echo "  → #$IID: closing zombie MR !${ZOMBIE_MR_IID}"
          glab api --hostname "$HOST" -X PUT "/projects/$PID/merge_requests/$ZOMBIE_MR_IID" -f state_event=close > /dev/null 2>&1 || true
        fi
        set_boucle_label "$IID" "boucle:done" "boucle::status::done"
        RECOVERED=$((RECOVERED + 1))
      done

      # ── Recover boucle:human AND boucle:approval issues with approved MRs ──
      # The reviewer agent may escalate to boucle:human after 3 failed
      # verdict attempts (agent step budget exhausted). But if a human has
      # manually approved the MR, the loop should still merge it — the
      # work is done, it just needs the merger to run. Also scan
      # boucle:approval: a race condition can occur where the human approves
      # the MR BEFORE the reviewer finishes (the dispatch `approved` handler
      # silently skips when the issue is at boucle:review, not boucle:approval).
      # When the reviewer then PASSes and sets boucle:approval, the already-
      # existing approval is stranded — the loop waits for an approval that
      # already happened. This recovery path catches that race.
      # Accept both `mergeable` and `conflict` MRs: the merger handles rebase
      # conflicts by re-triggering the worker (rebase conflict → boucle:todo
      # → worker iteration 1), so triggering the merger on a conflicted MR
      # is safe — it either merges (after successful rebase) or re-runs the
      # worker on fresh master.
      echo "Scanning boucle:human + boucle:approval issues for approved MRs..."
      RECOVERY_IIDS=""
      for RECOV_LABEL in boucle:human boucle:approval; do
        RECOV_IIDS=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&labels=$RECOV_LABEL&per_page=100" \
          | jq -r '.[].iid' 2>/dev/null)
        RECOVERY_IIDS="$RECOVERY_IIDS $RECOV_IIDS"
      done

      for IID in $RECOVERY_IIDS; do
        [ -z "$IID" ] && continue
        echo "Checking #$IID (boucle:human/approval) for approved MR..."
        # Find an open MR for this issue (branch boucle/$IID)
        MR_DATA=$(glab api --hostname "$HOST" "/projects/$PID/merge_requests?state=opened" \
          | jq -c --arg branch "boucle/$IID" '[.[] | select(.source_branch == $branch)] | first // empty' 2>/dev/null)
        if [ -z "$MR_DATA" ] || [ "$MR_DATA" = "null" ]; then
          echo "  → #$IID: no open MR — skipping"
          continue
        fi
        MR_IID=$(echo "$MR_DATA" | jq -r '.iid')
        MR_MERGE_STATUS=$(echo "$MR_DATA" | jq -r '.detailed_merge_status // .merge_status // "unknown"')
        # Check approvals on the MR
        APPROVALS=$(glab api --hostname "$HOST" "/projects/$PID/merge_requests/$MR_IID/approvals" 2>/dev/null)
        APPROVED_COUNT=$(echo "$APPROVALS" | jq -r '[.approved_by[].user.username] | length' 2>/dev/null || echo 0)
        if [ "$APPROVED_COUNT" -gt 0 ] && { [ "$MR_MERGE_STATUS" = "mergeable" ] || [ "$MR_MERGE_STATUS" = "conflict" ]; }; then
          echo "  → #$IID: MR !$MR_IID is approved ($APPROVED_COUNT) + $MR_MERGE_STATUS — triggering merger"
          set_boucle_label "$IID" "boucle:merging" "boucle::status::bot"
          curl -s -X POST "https://$HOST/api/v4/projects/$PID/trigger/pipeline" \
            -F "token=$BOUCLE_TRIGGER_TOKEN" -F "ref=master" \
            -F "variables[BOUCLE_ISSUE]=$IID" -F "variables[BOUCLE_ROLE]=merger" > /dev/null
          echo "  → triggered merger for #$IID"
          RECOVERED=$((RECOVERED + 1))
        else
          echo "  → #$IID: MR !$MR_IID status=$MR_MERGE_STATUS, approvals=$APPROVED_COUNT — not ready, skipping"
        fi
      done

      # Also check boucle:split parents: close the parent when all its
      # sub-issues are closed. This is the fallback cascade for sub-issues
      # closed via MR merge (Closes #N) where the deploy-triggered e2e
      # had no BOUCLE_ISSUE context and maybe_close_parent() never ran.
      SPLIT_PARENTS=$(glab api --hostname "$HOST" "/projects/$PID/issues?state=opened&labels=boucle:split&per_page=100" \
        | jq -r '.[].iid')

      for IID in $SPLIT_PARENTS; do
        echo "Checking #$IID (boucle:split) for parent-close cascade..."
        # Check children via the work-items hierarchy API (source of truth).
        CHILDREN_DATA=$(get_work_item_children "$IID")
        SIBLING_IIDS=$(echo "$CHILDREN_DATA" | jq -r '[.[].iid] | join(",")' 2>/dev/null)
        if [ -z "$SIBLING_IIDS" ]; then
          # No children via hierarchy API — fall back to legacy marker comment
          NOTES=$(glab api --hostname "$HOST" "/projects/$PID/issues/$IID/notes")
          SIBLING_IIDS=$(echo "$NOTES" | jq -r '[.[] | select(.body | contains("<!-- boucle:split-parent"))] | first | .body // empty' | grep -oE 'iids=[0-9,]+' | cut -d= -f2)
          if [ -z "$SIBLING_IIDS" ]; then
            # No legacy marker — fall back to REST issue links API
            echo "  → #$IID: no children via hierarchy API and no split-parent marker — checking REST links..."
            LINKS_DATA=$(glab api --hostname "$HOST" "/projects/$PID/issues/$IID/links" 2>/dev/null) || LINKS_DATA="[]"
            SIBLING_IIDS=$(echo "$LINKS_DATA" | jq -r '[.[] | select(.iid != null) | .iid] | join(",")')
            if [ -z "$SIBLING_IIDS" ]; then
              echo "  → #$IID: no children, no marker, and no REST links — skipping"
              continue
            fi
            echo "  → #$IID: found siblings $SIBLING_IIDS via REST links fallback"
            # REST links fallback: check each sibling individually
            ALL_CLOSED=true
            for SIB in $(echo "$SIBLING_IIDS" | tr ',' ' '); do
              SIB_STATE=$(glab api --hostname "$HOST" "/projects/$PID/issues/$SIB" 2>/dev/null | jq -r '.state // "unknown"')
              if [ "$SIB_STATE" != "closed" ]; then
                echo "  → #$IID: sibling #$SIB is $SIB_STATE — parent stays open"
                ALL_CLOSED=false
                break
              fi
            done
            if [ "$ALL_CLOSED" = "true" ]; then
              echo "  → #$IID: all sub-issues closed — closing parent"
              glab api --hostname "$HOST" -X PUT "/projects/$PID/issues/$IID" -f state_event=close > /dev/null 2>&1 || true
              RECOVERED=$((RECOVERED + 1))
            fi
            continue
          fi
          echo "  → #$IID: found siblings $SIBLING_IIDS via legacy split-parent marker"
          # Legacy marker fallback: check each sibling individually
          ALL_CLOSED=true
          for SIB in $(echo "$SIBLING_IIDS" | tr ',' ' '); do
            SIB_STATE=$(glab api --hostname "$HOST" "/projects/$PID/issues/$SIB" 2>/dev/null | jq -r '.state // "unknown"')
            if [ "$SIB_STATE" != "closed" ]; then
              echo "  → #$IID: sibling #$SIB is $SIB_STATE — parent stays open"
              ALL_CLOSED=false
              break
            fi
          done
          if [ "$ALL_CLOSED" = "true" ]; then
            echo "  → #$IID: all sub-issues closed — closing parent"
            glab api --hostname "$HOST" -X PUT "/projects/$PID/issues/$IID" -f state_event=close > /dev/null 2>&1 || true
            RECOVERED=$((RECOVERED + 1))
          fi
          continue
        fi

        # Hierarchy API path: children response includes .state directly
        OPEN_COUNT=$(echo "$CHILDREN_DATA" | jq '[.[] | select(.state != "closed")] | length' 2>/dev/null || echo 1)
        if [ "${OPEN_COUNT:-1}" -eq 0 ]; then
          echo "  → #$IID: all sub-issues closed — closing parent"
          glab api --hostname "$HOST" -X PUT "/projects/$PID/issues/$IID" -f state_event=close > /dev/null 2>&1 || true
          RECOVERED=$((RECOVERED + 1))
        else
          OPEN_IIDS=$(echo "$CHILDREN_DATA" | jq -r '[.[] | select(.state != "closed") | .iid] | join(",")')
          echo "  → #$IID: open sub-issue(s) #$OPEN_IIDS — parent stays open"
        fi
      done

      echo "Doctor complete. Recovered $RECOVERED orphaned issue(s)."
  timeout: 5m
