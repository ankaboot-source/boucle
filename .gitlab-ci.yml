# boucle engine — the boucle CI pipeline.
# Consumers install the engine as a git submodule at .boucle/ and include
# this file from a one-line root .gitlab-ci.yml shim (generated by
# bin/setup). The "boucle engine" marker lets bin/setup detect a repo that
# already runs this file directly (dogfood) and skip shim generation.
# Spec: issue #1 (boucle MVP spec)
# Five jobs: triage, worker, reviewer, deploy, e2e
# Dispatcher: single entry, parses webhook payload, routes to triage
# Runner: shared shell executor — before_script bootstraps tools

stages:
  - check
  - dispatch
  - triage
  - work
  - review
  - merge
  - deploy
  - verify

variables:
  # Required by lib/boucle-ci.sh, which exits 1 when it is unset — jobs that
  # call `bin/boucle-ci <stage>` cannot bootstrap without it. Overridable, but
  # this file IS the GitLab pipeline, so gitlab is the only sane default.
  BOUCLE_FORGE: "gitlab"
  BOUCLE_FORGE_HOST: gitlab.example.com
  # NOTE: there is deliberately no BOUCLE_RUNNER_TAG here. Jobs run UNTAGGED by
  # default, so the instance's shared runners pick them up and a fresh install
  # needs no runner of its own. A variable cannot express this: GitLab expands
  # `tags: [$VAR]` with an empty VAR into `tags: [""]`, which matches no runner
  # and strands the job. Routing to a dedicated runner is therefore opt-in at
  # the consumer's root shim, which overrides `default:` key-by-key:
  #
  #   default:
  #     tags: [boucle]
  #
  # `bin/setup --runner-tag <tag>` writes that block for you. See README
  # "Advanced — dedicated runners".
  BOUCLE_BUILD_CMD: "npm ci && npm run build"
  BOUCLE_BUILD_OUTPUT: "public"
  # Deploy: swap to any deploy command. Use $$BRANCH (escaped so eval expands it at runtime with
  # the job-local BRANCH var: "$CI_DEFAULT_BRANCH" for deploy, "boucle/$BOUCLE_ISSUE" for worker preview).
  # Examples:
  #   CF Pages:  "npx wrangler pages deploy $BOUCLE_BUILD_OUTPUT --project-name $BOUCLE_DEPLOY_PROJECT --branch $$BRANCH"
  #   Netlify:   "npx netlify deploy --dir $BOUCLE_BUILD_OUTPUT --alias $$BRANCH"
  #   Vercel:    "npx vercel deploy $BOUCLE_BUILD_OUTPUT --prod=false"
  #   GitLab Pages: "rsync -a $BOUCLE_BUILD_OUTPUT/ /srv/pages/$$BRANCH/"
  BOUCLE_DEPLOY_CMD: "npx wrangler pages deploy $BOUCLE_BUILD_OUTPUT --project-name $BOUCLE_DEPLOY_PROJECT --branch $$BRANCH"
  BOUCLE_DEPLOY_PROJECT: ""
  # Regex to extract the deployed URL from the deploy command's stdout
  BOUCLE_DEPLOY_URL_REGEX: "https://[a-z0-9.-]+\\.pages\\.dev"
  # Production URL (for e2e fallback when deploy doesn't pass a live URL)
  BOUCLE_PRODUCTION_URL: ""
  # Attachment policy: max size per attachment (bytes) and total per issue (bytes).
  # Applies to ALL uploads fetched by bin/fetch-issue-attachments (images, PDFs,
  # archives, etc.), not just images. Variable names retain the IMAGE prefix for
  # backward compatibility with consumers that override them via GitLab UI.
  # Defaults: 10 MiB per attachment, 50 MiB total. Attachments over either cap are skipped.
  BOUCLE_IMAGE_MAX_BYTES: "10485760"
  BOUCLE_IMAGE_TOTAL_MAX_BYTES: "52428800"
  # Concurrency: max issues allowed in boucle:working state simultaneously.
  # Default 5. 0 = unlimited (GitLab runner tag + resource_group are the only
  # limits) if you explicitly override it back. Triage won't trigger a new
  # worker if the cap is reached — the issue stays at boucle:todo and the
  # doctor re-triggers it when a slot frees.
  BOUCLE_MAX_PARALLEL_ISSUES: "5"
  # Iteration cap: max worker re-runs per issue (rebase conflicts, empty MRs,
  # reviewer FAIL). Default 5. Override per-project if you want more/fewer retries.
  BOUCLE_MAX_ITERATIONS: "5"
  # Doctor staleness threshold (seconds): how long before a boucle:working or
  # boucle:review issue is considered stuck and re-triggered. Default 2400
  # (40 min). MUST be strictly greater than the longest job timeout
  # (worker/reviewer = 30 min) plus a buffer, per AGENTS.md (lesson 33) —
  # otherwise the doctor fires while a job is legitimately still running,
  # producing parasitic duplicate triggers. Lower = faster recovery but
  # more false-positive re-triggers.
  BOUCLE_STALENESS_THRESHOLD: "2400"
  # Disable Chromium visual preview in triage (saves ~120 MiB per triage job).
  # true = skip preview rendering entirely. false = default (mandatory for UI/UX issues via RENDER_REQUEST).
  BOUCLE_PREVIEW_DISABLE: "false"
  # Provider profile (generic): the name of the [providers.<profile>] section
  # in the jcode config. bin/jc generates ~/.jcode/config.toml at runtime from
  # BOUCLE_LLM_BASE_URL + BOUCLE_LLM_API_KEY (below) — no config file on the
  # runner. Default "boucle" is the generic profile name; override only if you
  # pre-install a named profile on the runner (local dev, backward compat).
  BOUCLE_PROVIDER_PROFILE: "boucle"
  # LLM provider credentials (generic — not hardcoded to any provider).
  # bin/jc generates ~/.jcode/config.toml from these 2 env vars at runtime.
  # Set both as GitLab CI/CD variables (BOUCLE_LLM_API_KEY = masked+protected).
  # To switch provider: change these 2 vars + BOUCLE_PROVIDER_PROFILE — zero
  # code changes. Works with any OpenAI-compatible endpoint.
  BOUCLE_LLM_BASE_URL: "https://ollama.com/v1"
  # BOUCLE_LLM_API_KEY: ""  # set as masked+protected CI variable
  # Provider fallback: when the primary provider is down —
  # empty log / no agent activity, the exit-4 condition (LESSONS.yml lesson #29) —
  # retry with this fallback provider before escalating to a human. Empty = disabled.
  # Per-role model overrides: BOUCLE_FALLBACK_MODEL_{TRIAGE,WORKER,REVIEWER,E2E}.
  BOUCLE_FALLBACK_PROVIDER: ""
  # ── Vision model routing (capability-based, workaround for jcode #819) ──
  # When issue/MR attachments contain images, override the role's model to a
  # vision-capable model so the agent can actually see the images instead of
  # crashing (jcode #755) or fabricating descriptions.
  # BOUCLE_VISION_ROUTING: "enabled" (default) or "disabled" — master switch.
  # BOUCLE_VISION_MODEL: vision model to use (default: minimax-m3, on OpenRouter).
  # BOUCLE_VISION_ROLES: comma-separated eligible roles (default: triage,worker,reviewer).
  # e2e is excluded (curl+grep, no image consumption).
  BOUCLE_VISION_ROUTING: "enabled"
  BOUCLE_VISION_MODEL: "minimax-m3"
  BOUCLE_VISION_ROLES: "triage,worker,reviewer"
  # Deploy mode: "self" (boucle runs BOUCLE_DEPLOY_CMD) or "external" (consumer's own CI deploys)
  BOUCLE_DEPLOY_MODE: "self"
  # Review mode: "preview" (review tests against deployed preview) or "diff" (review PR diff + check suites)
  BOUCLE_REVIEW_MODE: "preview"
  # External deploy: max seconds to wait for consumer's own CI run on merged commit
  BOUCLE_EXTERNAL_DEPLOY_WAIT: "600"
  # Diff review: max seconds to wait for PR check suites before proceeding
  BOUCLE_REVIEW_CHECKS_WAIT: "900"
  # SHA marker probe path (relative to preview/live URL root)
  BOUCLE_PREVIEW_MARKER_PATH: "__boucle_commit__.txt"
  # Check out the engine submodule in consumer repos (.boucle/). No-op when
  # the repo has no submodule (dogfood).
  GIT_SUBMODULE_STRATEGY: recursive

# ── Agent transcript artifact (#33) ─────────────────────────────────────
# The agent log is the only record of WHAT the agent actually did. Without
# it, every escalation comment ("agent likely exhausted its step budget",
# "produced no code changes") is unactionable — the human is told the loop
# stopped, not why.
#
# when: always is the point. A failed run is exactly the one whose
# transcript gets read; uploading only on success would protect nothing.
#
# Safe to upload: bin/jc scrub_agent_log redacts known secret values and
# token shapes from the log before any exit path. The LLM key cannot be
# unset from the agent's environment (jcode reads it via api_key_env), so
# that redaction is the only barrier between it and this artifact.
#
# Short expiry: transcripts are for debugging, not archival.
.agent_artifacts: &agent_artifacts
  when: always
  expire_in: 1 week
  paths:
    - .boucle/**/agent-output.log
    - .boucle-state/**/agent-output.log

# ── Default: use node:22-slim (has node, npm, curl — much smaller than node:22) ─
# The shared runner is a docker executor. node:22-slim is ~250MB vs ~1GB.
# before_script installs glab + jcode + wrangler (not in the image).
default:
  # Pre-baked agent toolchain (glab/jq/git/node/python3/jcode/codebase-memory-mcp)
  # so docker-based runners skip the ~60s of downloads in the before_script
  # below. Shell executors ignore `image:` entirely and fall back to that
  # before_script, which probes `command -v` before installing anything — so
  # the same configuration serves both executor types.
  image: docker.io/ankabootops/boucle-agents:latest
  # NO `tags:` here, on purpose: jobs run UNTAGGED so the instance's shared
  # runners can pick them up. A fresh install therefore needs no runner of its
  # own — see README "Advanced — dedicated runners" to route to one instead.
  before_script:
    - |
      # Trace commands only when CI_DEBUG_TRACE is set (GitLab's native debug flag).
      # Default: silent — keeps logs readable and avoids dumping JSON/code in trace output.
      [[ "${CI_DEBUG_TRACE:-false}" == "true" ]] && set -x
      export PATH="$HOME/.local/bin:$PATH"
      export GITLAB_TOKEN="$BOUCLE_TOKEN"
      export GITLAB_HOST="$BOUCLE_FORGE_HOST"
      # Silence glab update notifier (spams stderr on every call otherwise).
      export GLAB_NO_UPDATE_NOTIFIER=true

      # ── curl + jq (slim image / shell host may lack both) ──────────
      if ! command -v curl &>/dev/null || ! command -v jq &>/dev/null || ! command -v git &>/dev/null; then
        echo "Installing curl + jq + git..."
        apt-get update -qq && apt-get install -y -qq curl jq git
      fi

      # ── node + npm (needed for wrangler/build/preview — and for pi) ──
      # Persists across runs on shell executor — only downloads once.
      # Only install if something actually needs node.
      _NEED_NODE=0
      echo "$BOUCLE_DEPLOY_CMD" | grep -q wrangler && _NEED_NODE=1
      echo "$BOUCLE_BUILD_CMD"  | grep -q npm      && _NEED_NODE=1
      [ "${BOUCLE_PREVIEW_DISABLE:-false}" != "true" ] && _NEED_NODE=1
      if [ "$_NEED_NODE" = "1" ] && { ! command -v node &>/dev/null || ! command -v npm &>/dev/null; }; then
        echo "Installing Node.js (shell executor has no image support)..."
        NODE_VER="v22.19.0"
        mkdir -p "$HOME/.local"
        NODE_TMP="/tmp/node-${CI_JOB_ID:-local}.tar.xz"
        curl -sL "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-linux-x64.tar.xz" -o "$NODE_TMP"
        tar xf "$NODE_TMP" -C "$HOME/.local" --strip-components=1
        rm -f "$NODE_TMP"
      fi
      unset _NEED_NODE

      # ── glab CLI ───────────────────────────────────────────────────
      # Install or upgrade: the shell executor caches $HOME/.local/bin across
      # runs, so a pinned old version would otherwise never update. Reinstall
      # when the cached version differs from GLAB_VER (cheap, ~3MB tarball).
      GLAB_VER="1.111.0"
      _GLAB_INSTALLED="$(glab version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
      if [ -z "$_GLAB_INSTALLED" ] || [ "$_GLAB_INSTALLED" != "$GLAB_VER" ]; then
        echo "Installing glab v${GLAB_VER} (was: ${_GLAB_INSTALLED:-MISSING})..."
        mkdir -p "$HOME/.local/bin"
        GLAB_TMP="/tmp/glab-${CI_JOB_ID:-local}"
        curl -sL "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VER}/downloads/glab_${GLAB_VER}_linux_amd64.tar.gz" -o "$GLAB_TMP.tar.gz"
        mkdir -p "$GLAB_TMP"
        tar xzf "$GLAB_TMP.tar.gz" -C "$GLAB_TMP"
        cp "$GLAB_TMP/bin/glab" "$HOME/.local/bin/glab" 2>/dev/null || cp "$GLAB_TMP/glab" "$HOME/.local/bin/glab"
        chmod +x "$HOME/.local/bin/glab"
        rm -rf "$GLAB_TMP" "$GLAB_TMP.tar.gz"
      fi
      unset _GLAB_INSTALLED

      # ── Locate the boucle engine ───────────────────────────────────
      # Consumers install boucle as a git submodule at .boucle/ — engine
      # files (bin/, lib/, .jcode/) resolve via $BOUCLE_HOME. The boucle
      # repo itself (dogfood) runs with the engine at the repo root, so
      # fall back to $CI_PROJECT_DIR. Per-issue state stays OUT of the
      # submodule: .boucle-state/ (gitignored) keeps `git submodule update`
      # from ever clobbering in-flight work.
      if [ -d "$CI_PROJECT_DIR/.boucle/bin" ]; then
        export BOUCLE_HOME="$CI_PROJECT_DIR/.boucle"
      else
        export BOUCLE_HOME="$CI_PROJECT_DIR"
      fi
      # Put the engine's bin/ on PATH so script references (boucle-ci,
      # check-bootstrap.sh, ...) resolve in both dogfood (engine at root)
      # and consumer (engine at .boucle/) layouts. Without this, the
      # `bin/boucle-ci` relative path only works when the engine IS the
      # repo root — a consumer with .boucle/ gets "No such file or
      # directory".
      export PATH="$BOUCLE_HOME/bin:$PATH"
      # Isolate jcode's config + prompt overlay per project (shared
      # runners): bin/jc writes config.toml and prompt-overlay.md under
      # JCODE_HOME, which never touches the consumer repo root or ~/.jcode.
      export JCODE_HOME="$CI_PROJECT_DIR/.boucle-state/.jcode"

      # ── Self-update (consumers only) ───────────────────────────────
      # bin/update fetches the latest engine from upstream and applies it
      # to $BOUCLE_HOME. Fail-open: any error → warning, pipeline continues
      # with the current version. Skipped on:
      # - the dogfood repo (BOUCLE_HOME = $CI_PROJECT_DIR, no .boucle/)
      # - push pipelines (BOUCLE_PIPELINE_SOURCE=push) to avoid a feedback
      #   loop (push → pipeline → bin/update → push → pipeline → ...)
      # - when BOUCLE_UPDATE_DISABLE=true (opt-out for pinned installs)
      # Self-update MUST only run on the default branch — on a worker
      # branch (boucle/<iid>) the self-update commit pollutes the MR
      # with chore(boucle): commits that are the bot's engine-sync work,
      # not the issue's work (observed on MR !105: 6 chore(boucle):
      # commits landed on boucle/79, attributed to the human because
      # the clone inherited their git identity).
      if [ "${BOUCLE_UPDATE_DISABLE:-false}" != "true" ] \
         && [ "$BOUCLE_HOME" != "$CI_PROJECT_DIR" ] \
         && [ "${BOUCLE_PIPELINE_SOURCE:-}" != "push" ] \
         && [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-master}" ]; then
        bash "$BOUCLE_HOME/bin/update" || echo "[boucle] WARN: self-update failed, continuing with current version" >&2
      fi

      # ── Shared boucle helpers (single source of truth) ────────────
      # lib/boucle.sh exports set_boucle_label, resolve_reporter_id,
      # get_work_item_children, close_issue, maybe_close_parent,
      # preview_url_for_changed_files, and chain_to_role. Previously
      # these were copy-pasted into each job's script block (8 copies of
      # set_boucle_label, 3 of resolve_reporter_id, etc.) with subtle
      # drift between variants. Now sourced once here.
      # ── Forge abstraction (MUST precede lib/boucle.sh — it calls forge_*) ──
      source "$BOUCLE_HOME/bin/forge/common.sh"
      forge_init
      # chain_to_role/forge_trigger_role rely on BOUCLE_DEFAULT_BRANCH — never
      # set by GitLab; resolve from the native CI_DEFAULT_BRANCH (fallback
      # master) so triggers target the real default branch, not "main".
      export BOUCLE_DEFAULT_BRANCH="${BOUCLE_DEFAULT_BRANCH:-${CI_DEFAULT_BRANCH:-master}}"
      # BOUCLE_PROJECT_ID is normalized by lib/boucle-ci.sh for bin/boucle-ci
      # jobs; INLINE jobs (merger, doctor, ...) must get it here too, or the
      # forge_* triggers/notes POST to an empty project id (silently dropped
      # by `|| true`) — observed re-trigger failure on framagit, 2026-08.
      export BOUCLE_PROJECT_ID="${BOUCLE_PROJECT_ID:-${CI_PROJECT_ID:-}}"
      export BOUCLE_WORKSPACE="${BOUCLE_WORKSPACE:-${CI_PROJECT_DIR:-$(pwd)}}"
      source "$BOUCLE_HOME/lib/boucle.sh"

      # ── jcode coding agent (standalone Rust binary) ──────────────
      # jcode replaces both opencode and pi. It is a Rust binary shipped as
      # a tarball on GitHub Releases — no Node/npm/Bun dependency.
      # bin/jc wires jcode into the boucle role matrix (triage/worker/
      # reviewer/e2e). Provider config is generated at runtime by bin/jc
      # from BOUCLE_LLM_BASE_URL + BOUCLE_LLM_API_KEY env vars — no
      # config file needed on the runner host.
      # Asset names follow the pattern jcode-<os>-<arch>.tar.gz (e.g.
      # jcode-linux-x86_64.tar.gz). The tarball contains a single binary
      # named jcode-linux-x86_64.bin at its root.
      #
      # Version check: the runner REUSES the repo between jobs, so a stale
      # jcode binary from a previous run persists. The old `if ! command -v`
      # guard skipped the install when ANY jcode was present — leaving the
      # runner pinned to an old version indefinitely (observed: consumer
      # ran v0.68.0 for days despite JCODE_VER=v0.73.0 in the config). Now
      # we check the installed version matches JCODE_VER and reinstall if not.
      JCODE_VER="${JCODE_VERSION:-v0.75.3}"
      if ! command -v jcode &>/dev/null || ! jcode --version 2>/dev/null | grep -q "$JCODE_VER"; then
        echo "Installing jcode coding agent (standalone binary, $JCODE_VER)..."
        mkdir -p "$HOME/.local/bin"
        JCODE_TMP="/tmp/jcode-${CI_JOB_ID:-local}"
        curl -fsSL "https://github.com/1jehuang/jcode/releases/download/${JCODE_VER}/jcode-linux-x86_64.tar.gz" -o "$JCODE_TMP.tar.gz"
        mkdir -p "$JCODE_TMP"
        tar xzf "$JCODE_TMP.tar.gz" -C "$JCODE_TMP"
        # The tarball contains jcode-linux-x86_64.bin at its root.
        mv "$JCODE_TMP/jcode-linux-x86_64.bin" "$HOME/.local/bin/jcode"
        chmod +x "$HOME/.local/bin/jcode"
        rm -rf "$JCODE_TMP" "$JCODE_TMP.tar.gz"
      fi

      # ── codebase-memory-mcp (codebase knowledge graph) ──
      # Static binary — no node needed. codebase-memory-mcp: installed for repo indexing only (pi has no MCP support)
      # Agents query it via CLI (`codebase-memory-mcp cli ...`) for code
      # discovery (search_graph, trace_path, get_code_snippet, etc.) — pi
      # does not load it as an MCP server.
      if ! command -v codebase-memory-mcp &>/dev/null; then
        echo "Installing codebase-memory-mcp..."
        curl -fsSL "https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh" | bash 2>/dev/null || true
      fi

      # ── wrangler (only for jobs that deploy: worker + deploy) ──────
      # BOUCLE_DEPLOY_CMD is a global var that always contains wrangler,
      # so the old grep check installed it on every job. Gate on job name
      # instead — only worker (preview deploy) and deploy (prod deploy) use it.
      case "$CI_JOB_NAME" in
        worker|deploy)
          if echo "$BOUCLE_DEPLOY_CMD" | grep -q "wrangler" && ! command -v wrangler &>/dev/null; then
            echo "Installing wrangler (job: $CI_JOB_NAME)..."
            npm install -g wrangler 2>/dev/null || true
          fi
          ;;
      esac
      # ── codebase-memory-mcp (codebase knowledge graph) ──
      # Static binary — no node needed. codebase-memory-mcp: installed for repo indexing only (pi has no MCP support)
      # Agents query it via CLI (`codebase-memory-mcp cli ...`) for code
      # discovery (search_graph, trace_path, get_code_snippet, etc.) — pi
      # does not load it as an MCP server.
      if ! command -v codebase-memory-mcp &>/dev/null; then
        echo "Installing codebase-memory-mcp..."
        curl -fsSL "https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh" | bash 2>/dev/null || true
      fi

      # ── wrangler (only for jobs that deploy: worker + deploy) ──────
      # BOUCLE_DEPLOY_CMD is a global var that always contains wrangler,
      # so the old grep check installed it on every job. Gate on job name
      # instead — only worker (preview deploy) and deploy (prod deploy) use it.
      case "$CI_JOB_NAME" in
        worker|deploy)
          if echo "$BOUCLE_DEPLOY_CMD" | grep -q "wrangler" && ! command -v wrangler &>/dev/null; then
            echo "Installing wrangler (job: $CI_JOB_NAME)..."
            npm install -g wrangler 2>/dev/null || true
          fi
          ;;
      esac

      # ── Verify ────────────────────────────────────────────────────
      echo "=== Environment ==="
      node --version 2>/dev/null || echo "node: MISSING"
      npm --version 2>/dev/null || echo "npm: MISSING"
      glab version 2>/dev/null | head -1 || echo "glab: MISSING"
      jcode --version 2>/dev/null || echo "jcode: MISSING"
      echo "BOUCLE_PROVIDER_PROFILE=${BOUCLE_PROVIDER_PROFILE:-ollama-cloud}"
      case "$CI_JOB_NAME" in worker|deploy) echo "$BOUCLE_DEPLOY_CMD" | grep -q wrangler && { wrangler --version 2>/dev/null || echo "wrangler: MISSING"; } || echo "wrangler: not needed";; *) echo "wrangler: not needed (job: $CI_JOB_NAME)";; esac
      codebase-memory-mcp --version 2>/dev/null || echo "codebase-memory-mcp: MISSING"
      echo "==================="

      # ── Index repo for codebase-memory-mcp (agents query the graph) ──
      # Fast (<30s for this repo size). Only index for agent jobs that have
      # the CLI fallback documented in their prompts (triage, worker, reviewer).
      # Non-agent jobs (dispatch, merger, catchup, e2e, doctor, deploy) never
      # query the graph — skip the index to save ~30s per job.
      case "$CI_JOB_NAME" in
        triage|worker|reviewer)
          if command -v codebase-memory-mcp &>/dev/null; then
            echo "Indexing repo for codebase-memory-mcp (job: $CI_JOB_NAME)..."
            codebase-memory-mcp cli index_repository --repo_path "${CI_PROJECT_DIR:-$(pwd)}" --json >/dev/null 2>&1 || true
          fi
          ;;
        *)
          echo "Skipping codebase-memory-mcp index (job: $CI_JOB_NAME — not an agent job)"
          ;;
      esac

# ── Quality gate (lint + unit tests) ─────────────────────────────────────
# Runs shellcheck + shfmt + bats on push/MR pipelines only. Never runs on
# webhook triggers (the autonomous loop) or schedules — those are the dev-loop
# pipeline and the doctor sweep, which don't touch the harness source.
# Uses the default node:22-slim image and installs its own tools (shellcheck,
# shfmt, bats) so it's self-contained and doesn't depend on the shell executor.
check:
  stage: check
  # Run on any available runner (including the shared docker runner) so a
  # busy data runner never blocks the quality gate. The job is lightweight.
  tags: []
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    # Skip on webhook/trigger pipelines (the autonomous loop) and schedules.
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Run on pushes and MRs to $CI_DEFAULT_BRANCH.
    # NOTE (framagit, 2026-08): the merge-request rule MUST reference
    # $CI_PIPELINE_SOURCE == "merge_request_event" as a STANDALONE comparison —
    # GitLab's MR-pipeline creation only triggers on the simple reference.
    # A combined rule ("... == X && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == ...")
    # lints valid but NEVER creates a merge-request pipeline (the check job
    # never runs; verified: MR with && rule = no pipeline, MR with pure rule =
    # pipeline created instantly). Keep the rule pure and guard the *script*
    # below for the target-branch case instead.
    - if: $CI_COMMIT_BRANCH == "$CI_DEFAULT_BRANCH"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
    # Resolve BOUCLE_HOME so check-bootstrap.sh is on PATH in consumer
    # layouts (engine at .boucle/) as well as dogfood (engine at root).
    - |
      if [ -d "$CI_PROJECT_DIR/.boucle/bin" ]; then
        export BOUCLE_HOME="$CI_PROJECT_DIR/.boucle"
      else
        export BOUCLE_HOME="$CI_PROJECT_DIR"
      fi
      export PATH="$BOUCLE_HOME/bin:$PATH"
    # No git submodule update here: GitLab's get_sources already initialized
    # the test submodules, and tags: [] jobs can land on runners without git
    # in the job PATH (the bootstrap installs/verifies git itself).
    # Toolchain (shellcheck/shfmt/bats, pinned) — root-safe bootstrap:
    # falls back to $HOME/.local/bin when /usr/local/bin is not writable
    # (shared shell executors, e.g. framagit's non-root runner). Fails with
    # an actionable message when a system tool (make/tar/xz/...) is missing.
    - check-bootstrap.sh
    - shellcheck --version
    - shfmt --version
    - bats --version
  script:
    # Pure merge_request_event rule above must create the pipeline; this guard
    # keeps the MR gate scoped to MRs targeting the default branch.
    - if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" != "$CI_DEFAULT_BRANCH" ]; then echo "check skipped (MR targets $CI_MERGE_REQUEST_TARGET_BRANCH_NAME, not default)"; exit 0; fi
    # Reject any commit that modified .boucle/ without an authorized bot
    # subject (chore(boucle): ...). .boucle/ is the engine dir owned by
    # bin/update — manual edits get overwritten on the next sync.
    - check-boucle-sync
    - make check

# ── Dispatcher ──────────────────────────────────────────────────────────
dispatch:
  stage: dispatch
  # Loop-critical entry point: must run on ANY available runner (including
  # a shared runner) so webhooks are never blocked waiting
  # for the single tagged runner to free up. Without this, a long-running
  # worker job can stall the entire loop by hogging the data runner.
  tags: []
  # Serialize dispatch jobs so a webhook storm (many issue/MR events firing
  # trigger pipelines in quick succession) cannot saturate the runner pool
  # with concurrent no-op dispatches. A no-op dispatch exits in seconds, so
  # the queue drains fast; without this, 40 concurrent no-ops paralyze the
  # shared runner for ~20 min (observed on a consumer repo, 2026-08).
  # Unlike worker/reviewer (boucle-issue-$BOUCLE_ISSUE), this is a STATIC
  # name — BOUCLE_ISSUE is not available at dispatch eval time, and ALL
  # dispatches should queue regardless of which issue they target.
  resource_group: boucle-dispatch
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    # Only run dispatch on webhook triggers (no BOUCLE_ROLE set).
    # Role-specific chains (worker/reviewer/e2e) set BOUCLE_ROLE and skip dispatch.
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
    # All other pipeline sources (push, schedule, web, etc.) → skip.
    # Without this final guard, GitLab adds the job by default on push
    # pipelines, creating dispatch+triage jobs that saturate the runner
    # pool and starve the deploy job (which legitimately runs on push).
    - when: never
  # Anti-accumulation: a no-op dispatch (bot event, MR action that chains
  # via API, unhandled event) exits 0 without writing .boucle-issue, then the
  # EXIT trap flips it to exit 1. We do NOT use allow_failure here because
  # GitLab treats allow_failure jobs as "soft success" and still runs
  # downstream jobs that need them. A hard failure on dispatch is the
  # signal that skips triage (needs: [dispatch] without optional). The
  # pipeline will show as "failed" on no-op webhook events — that's
  # expected and harmless: it just means "nothing to do".
  #
  # No before_script override: the global `default:` before_script installs
  # the full toolchain (glab, jcode, jq, git, forge layer, lib/boucle.sh).
  # dispatch only needs glab + jq + git + lib/boucle.sh, but the overhead of
  # installing the rest is negligible on the pre-baked agents image and the
  # shared runner caches $HOME/.local/bin across runs.
  script:
    - boucle-ci dispatch
  artifacts:
    paths:
      - .boucle-issue

# ── Triage ──────────────────────────────────────────────────────────────
triage:
  stage: triage
  # Auto-retry transient runner failures (broken/offline runner, OOM, daemon restart).
  # The triage job runs untagged (default has no tags) — if the assigned runner is broken,
  # the job fails instantly with runner_system_failure and the issue is stranded.
  # retry lets GitLab reassign to another runner.
  # See AGENTS.md and GitLab docs: retry:when: runner_system_failure.
  retry:
    max: 2
    when: runner_system_failure
  artifacts: *agent_artifacts
  # resource_group omitted — BOUCLE_ISSUE not available at pipeline eval time for triage
  needs:
    - job: dispatch
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    # Only run triage on webhook triggers (no BOUCLE_ROLE set).
    # Role-specific chains (worker/reviewer/e2e) set BOUCLE_ROLE and skip triage.
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
    # All other pipeline sources (push, schedule, web, etc.) → skip.
    # See dispatch rules for the rationale (runner pool starvation).
    - when: never
  variables:
    BOUCLE_ITERATION: 1
  script:
    - boucle-ci triage
  timeout: 10m

# ── Worker ──────────────────────────────────────────────────────────────
worker:
  stage: work
  # Pin to docker runners (tags: []) — the Astro compiler (Go-WASM) OOMs on
  # small shell executors (~1GB RAM). Docker runners have enough memory.
  # Without tags: [], a shell executor picks up the untagged job and the
  # build crashes with "runtime: out of memory" in @astrojs/compiler.
  tags: []
  # Auto-retry transient runner failures (broken/offline runner, OOM, daemon restart).
  retry:
    max: 2
    when: runner_system_failure
  artifacts: *agent_artifacts
  resource_group: boucle-issue-$BOUCLE_ISSUE
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm-${CI_JOB_NAME}
    paths:
      - .npm/
    policy: pull-push
  variables:
    npm_config_cache: .npm
  needs:
    - job: dispatch
      optional: true
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "worker"
  script:
    - boucle-ci worker
  # Worker wall-clock cap. 30 min default — a stuck worker shouldn't hog the
  # data runner for an hour. The doctor re-triggers if the job times out and
  # the issue is still at boucle:working. Increase to 60m for heavy issues.
  timeout: 30m

# ── Reviewer ────────────────────────────────────────────────────────────
reviewer:
  stage: review
  # Auto-retry transient runner failures (broken/offline runner, OOM, daemon restart).
  # The reviewer job runs untagged (default has no tags) — if the assigned runner is broken,
  # the job fails instantly with runner_system_failure and the MR is stranded.
  # retry lets GitLab reassign to another runner.
  # See AGENTS.md and GitLab docs: retry:when: runner_system_failure.
  retry:
    max: 2
    when: runner_system_failure
  artifacts: *agent_artifacts
  resource_group: boucle-issue-$BOUCLE_ISSUE
  needs:
    - job: dispatch
      optional: true
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "reviewer"
  script:
    - boucle-ci reviewer
  # 30m to accommodate provider fallback: 12m primary timeout + 12m fallback
  # + 6m overhead (rebase, deploy, verdict post). At 15m the fallback only
  # got 3m after the 12m primary timeout — not enough to complete a review.
  timeout: 30m

# ── Merger (serial merge after author approval) ─────────────────────────
# Triggered by dispatch when an author approves a MR natively (GitLab
# merge_request webhook, action=approved). The resource_group serializes
# merges across all issues — only one MR merges at a time, so each merge
# rebases onto a $CI_DEFAULT_BRANCH that already includes the previous merge,
# eliminating the class of conflicts we hit when merging 4 MRs in parallel.
# After merge, triggers e2e WITH BOUCLE_ISSUE set (fixes the design gap where
# deploy-triggered e2e had no issue context and maybe_close_parent never ran).
merger:
  stage: merge
  # Loop-critical: merger makes only API calls + git operations — lightweight.
  # Run on ANY available runner (tags: []) so an approved MR is never blocked
  # waiting behind a heavy worker/reviewer job on the single data runner.
  tags: []
  # Serialize all merges project-wide — one MR merges at a time.
  resource_group: boucle-merge
  needs:
    - job: dispatch
      optional: true
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "merger"
  script:
    - boucle-ci merger
  timeout: 10m

# ── Post-merge (deploy-wait + e2e trigger, unlocked) ───────────────────
# Runs in the same trigger pipeline as the merger (needs: [merger]) but
# WITHOUT the resource_group: boucle-merge lock. The merger releases the
# lock as soon as the merge API call succeeds; post-merge then polls the
# deploy pipeline and triggers e2e in parallel, so the next approved MR
# can start merging immediately instead of waiting 2+ min for deploy.
post-merge:
  stage: merge
  tags: []
  needs:
    - job: merger
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "merger"
  # No before_script override: the global `default:` one already installs the
  # toolchain, resolves BOUCLE_BOT_ID, locates $BOUCLE_HOME and sources the
  # forge layer. The copy that used to live here duplicated all of it and had
  # drifted (glab 1.50.0 vs 1.111.0).
  script:
    # Shared stage (lib/boucle-ci/post-merge.sh) — same code path as GitHub
    # Actions. It also implements BOUCLE_DEPLOY_MODE=external (wait on the
    # consumer's check suites for the merged commit), which the inline copy
    # this replaces never had: on GitLab, external mode silently skipped
    # straight to e2e without waiting for the consumer's own CI.
    - boucle-ci post-merge
  # 30m to accommodate provider fallback: 12m primary + 12m fallback + 6m overhead.
  timeout: 30m

# ── Catchup (direct merge recovery) ────────────────────────────────────
# Triggered by dispatch when a human merges a boucle/<iid> MR directly
# (merge_request webhook, action=merge), bypassing the approval circuit.
# The push to $CI_DEFAULT_BRANCH already triggered deploy → smoke e2e (no issue
# context). This job catches up: inspects the issue state, sets
# boucle:done (if was at boucle:approval) or boucle:human (if merged
# early), posts an audit comment, closes the issue, and cascades the
# parent close. No e2e agent runs — we trust the human's merge judgment.
catchup:
  stage: merge
  # Loop-critical control-plane job: API calls only, no build. Run on ANY
  # available runner (tags: []) so a direct merge is never blocked waiting
  # behind a heavy worker/reviewer job on the single data runner.
  tags: []
  needs:
    - job: dispatch
      optional: true
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "catchup"
  script:
    - boucle-ci catchup
  timeout: 5m

# ── Deploy (on push to $CI_DEFAULT_BRANCH) ─────────────────────────────────────────
deploy:
  stage: deploy
  # Auto-retry transient runner failures (runner busy/offline, OOM, daemon restart).
  # The deploy job runs untagged (default has no tags). On an install pinned to a
  # dedicated runner it contends with worker jobs, which produces
  # runner_system_failure; retrying recovers without human intervention.
  # See AGENTS.md and GitLab docs: retry:when: runner_system_failure.
  # Cap at 2 (GitLab hard limit for retry.max is 2).
  retry:
    max: 2
    when: runner_system_failure
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm-${CI_JOB_NAME}
    paths:
      - .npm/
    policy: pull-push
  variables:
    npm_config_cache: .npm
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  needs:
    - job: build-site
  script:
    # Shared stage (lib/boucle-ci/deploy.sh) — same code path as GitHub
    # Actions. It skips the build when $BOUCLE_BUILD_OUTPUT is already
    # populated, which is the case here: build-site hands it over as an
    # artifact (rebuilding OOMs WASM toolchains on shell executors).
    - boucle-ci deploy
  timeout: 10m

# ── E2E (after deploy) ─────────────────────────────────────────────────
e2e:
  stage: verify
  # Auto-retry transient runner failures (broken/offline runner, OOM, daemon restart).
  # The e2e job runs untagged (default has no tags) — if the assigned runner is broken,
  # the job fails instantly with runner_system_failure and the issue is stranded.
  # retry lets GitLab reassign to another runner.
  # See AGENTS.md and GitLab docs: retry:when: runner_system_failure.
  retry:
    max: 2
    when: runner_system_failure
  artifacts: *agent_artifacts
  resource_group: boucle-issue-$BOUCLE_ISSUE
  needs:
    - job: dispatch
      optional: true
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $BOUCLE_ROLE == "e2e"
  script:
    - boucle-ci e2e
  timeout: 20m

# ── Doctor (scheduled recovery) ──────────────────────────────────────────
# Runs on a schedule (every 10 min). Detects orphaned triages: issues with
# boucle:needs-info label that have a human reply after the last triage
# comment. Re-triggers triage for them. Also detects stuck boucle:triage
# issues with no active pipeline (canceled before dispatch ran).
doctor:
  stage: verify
  # Loop-critical control-plane job: makes only API calls, no build.
  # Explicit `tags: []` — the doctor runs on ANY available runner and is never
  # blocked by a busy dedicated one, same pattern as dispatch, merger and
  # catchup. It stays explicit even though `default:` is now untagged, so an
  # install that pins `default: tags:` to its own runner (README "Advanced —
  # dedicated runners") does not strand the doctor behind a running worker.
  tags: []
  # resource_group: prevents concurrent doctor runs. On shared runners
  # (framagit, GitLab.com SaaS), the doctor schedule fires every 10 min
  # and each run occupies a runner slot. Without this group, a slow
  # doctor run overlaps with the next schedule and consumes 2+ slots,
  # starving webhook-triggered dispatch/triage pipelines.
  resource_group: boucle-doctor
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    # Only run on scheduled pipelines (not webhook/trigger pipelines)
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - boucle-ci doctor
  timeout: 10m

# ── build-site: one build, many publishers (W1.7 + memory fix) ───────────
# The site is built ONCE here on a docker runner (node:22-slim, tags: []) and
# published via artifact. Both `pages` (GitLab Pages) and `deploy` (CF/other)
# consume public/ instead of re-building — this fixes the WASM Out-of-memory
# failures seen when the build ran on small shell executors (framagit 2026-08).
build-site:
  stage: deploy
  image: node:22-slim
  tags: []
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - eval "$BOUCLE_BUILD_CMD"
  artifacts:
    paths:
      - public
    expire_in: 4h

# ── GitLab Pages (W1.7) ───────────────────────────────────────────────────
# Declarative GitLab Pages publish — the only token-less deploy path: the
# pipeline builds $BOUCLE_BUILD_OUTPUT (default: public/) and GitLab serves
# it at $CI_PAGES_URL. Opt-in: BOUCLE_DEPLOY_PROVIDER=gitlab-pages.
# Runs on the default branch (Pages = production site) incl. manual/API
# pipelines on it (CI_COMMIT_BRANCH is set there; merge_request pipelines
# fail the CI_COMMIT_BRANCH rule, so this never touches MR previews).
pages:
  stage: deploy
  tags: []
  rules:
    - if: $BOUCLE_ENABLED != "true"
      when: never
    - if: $BOUCLE_DEPLOY_PROVIDER != "gitlab-pages"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  needs:
    - job: build-site
  script:
    - echo "Publishing the site to GitLab Pages"
  artifacts:
    paths:
      - public
  pages: true
