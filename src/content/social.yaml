# =============================================================================
# Urgence Palestine — global social handles
# -----------------------------------------------------------------------------
# This file is the single source of truth for the collectif's official
# accounts. It is editable from the Sveltia admin at `/admin/` via the
# "Réseaux sociaux" singleton, and consumed at build time by:
#
#   - src/components/SocialCTA.astro      (in-page social block on the home)
#   - src/components/SocialSidebar.astro  (fixed sidebar on every page)
#
# The legacy footer (`src/components/Footer.astro`) keeps its own hardcoded
# Instagram / TikTok / Telegram / Facebook row per issue #30 acceptance
# criteria; the X/Twitter handle introduced here is the one referenced by
# the new components only.
#
# Keep this file in sync with the matching `singletons[].fields` block in
# `sveltia-cms.config.yml` and the Zod schema for the `social` collection
# in `src/content.config.ts`.
# =============================================================================

instagram: https://instagram.com/urgencepalestine
tiktok: https://tiktok.com/@urgencepalestine
telegram: https://t.me/urgencepalestine
facebook: https://facebook.com/urgencepalestine
twitter: https://twitter.com/urgencepalestine
