# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS configuration for Urgence Palestine.
#
# This file is the canonical configuration. It is also exposed at
# `/sveltia-cms.config.yml` by the static site through the symlink
# `static/sveltia-cms.config.yml -> ../sveltia-cms.config.yml`, so the
# admin page at `/admin/` can fetch it via the
# `<link rel="cms-config-url">` tag in `static/admin/index.html`.
#
# See: https://sveltiacms.app/en/docs/start
#
# Note: the `test-repo` backend keeps the login UI renderable in
# development without requiring a real Git OAuth provider. Swap it for
# `github` (or `gitlab` / `gitea`) when an OAuth app is wired up.

backend:
  name: test-repo
  branch: master

# Media storage — internal, served from the same origin.
media_folder: /static/media
public_folder: /media

# =============================================================================
# Singletons (global, root-level config editable from the Sveltia admin)
# =============================================================================
# A Sveltia "singleton" is a single file managed by the admin at the root of
# the sidebar (it does not live inside a `collections:` block). We use one
# to centralise the site's social-network handles: the same file is read by
# `src/components/SocialCTA.astro` and `src/components/SocialSidebar.astro`
# at build time, so editors can change a handle from the admin without
# shipping a new release. Mirrored by the Zod schema in
# `src/content.config.ts` (`social`).
# See: https://sveltiacms.app/en/docs/collections/singletons
singletons:
  - name: social
    label: Réseaux sociaux
    icon: share
    description: Comptes officiels du collectif (Instagram, TikTok, Telegram, Facebook, X/Twitter).
    file: src/content/social.yaml
    format: yaml
    fields:
      - { name: instagram, label: Instagram, widget: string, required: false }
      - { name: tiktok, label: TikTok, widget: string, required: false }
      - { name: telegram, label: Telegram, widget: string, required: false }
      - { name: facebook, label: Facebook, widget: string, required: false }
      - { name: twitter, label: X / Twitter, widget: string, required: false }

# =============================================================================
# Collections
# =============================================================================
# Three content streams:
#   - communiques  → Communiqués / Prises de parole
#   - collectif    → Collectif (sections locales par ville + mobilisation étudiante)
#   - mobilisation → Événements / Mobilisation
#
# The `folder` path is relative to the repository root, so it matches the
# `src/content/<name>/` path used by Astro's `glob()` loader in
# `src/content.config.ts`.
# =============================================================================

collections:
  # ---------------------------------------------------------------------------
  # Prises de parole (anciennement « communiqués »)
  # ---------------------------------------------------------------------------
  # Single bucket that groups the collectif's public voice under one
  # taxonomy (`communique` | `analyse` | `appel-a-mobilisation`). The
  # `category` enum mirrors the Zod enum in `src/content.config.ts` —
  # keep both in sync.
  - name: prises-de-parole
    label: Prises de parole
    label_singular: Prise de parole
    description: Communiqués de presse, analyses politiques et appels à mobilisation du collectif.
    folder: src/content/prises-de-parole
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, picker_utc: true }
      - { name: description, label: Résumé, widget: text, required: false }
      - name: category
        label: Catégorie
        widget: select
        required: false
        default: communique
        options:
          - { label: Communiqué, value: communique }
          - { label: Analyse, value: analyse }
          - { label: Appel à mobilisation, value: appel-a-mobilisation }
      - { name: body, label: Contenu, widget: markdown }

  # ---------------------------------------------------------------------------
  # Collectif — sections locales + mobilisation étudiante
  # ---------------------------------------------------------------------------
  # One collection that holds both flavours of "Collectif" entry exposed by
  # the legacy WordPress site (per-city local chapters + the student
  # mobilisation hub). The `kind` discriminator lets editors pick which
  # type they're creating; the CMS uses `city` as the entry identifier.
  - name: collectif
    label: Collectif
    label_singular: Entrée collectif
    description: Fiches des sections locales (par ville) et de la mobilisation étudiante.
    folder: src/content/collectif
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: city
    fields:
      - { name: city, label: Ville (ou "Étudiants"), widget: string }
      - { name: title, label: Titre, widget: string, required: false }
      - { name: contact_email, label: Email de contact, widget: string, required: false }
      - { name: description, label: Description, widget: text, required: false }
      - { name: image, label: Image (chemin /static/…), widget: image, required: false, allow_none: true }
      - { name: instagram, label: Instagram, widget: string, required: false }
      - { name: telegram, label: Telegram, widget: string, required: false }
      - { name: twitter, label: Twitter/X, widget: string, required: false }
      - { name: facebook, label: Facebook, widget: string, required: false }
      - { name: website, label: Site web, widget: string, required: false }
      - name: kind
        label: Type d'entrée
        widget: select
        default: section-locale
        options:
          - { label: "Section locale (par ville)", value: section-locale }
          - { label: "Mobilisation étudiante", value: mobilisation-etudiante }
      - { name: body, label: Présentation, widget: markdown, required: false }

  # ---------------------------------------------------------------------------
  # Événements / Mobilisation
  # ---------------------------------------------------------------------------
  # Mixes time-bound events (rassemblements) and campaign landing pages
  # migrated from the legacy urgence-palestine.com site. The `category`
  # enum groups the migrated entries (kit-militant, boycott, prisonniers)
  # on the `/mobilisation/` index page. New events without a category are
  # still valid (e.g. one-off rassemblements).
  - name: mobilisation
    label: Mobilisation
    label_singular: Événement
    description: Manifestations, rassemblements, actions de mobilisation.
    folder: src/content/mobilisation
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, picker_utc: true }
      - { name: location, label: Lieu, widget: string }
      - { name: description, label: Résumé, widget: text, required: false }
      - name: featured_image
        label: Image à la une
        widget: image
        required: false
        description: Chemin local sous /public, ex. /mobilisation/boycott/2025-visuel-boycott.png
      - name: category
        label: Catégorie
        widget: select
        required: false
        default: evenement
        options:
          - { label: Événement, value: evenement }
          - { label: Kit militant, value: kit-militant }
          - { label: Boycott, value: boycott }
          - { label: Prisonniers, value: prisonniers }
      - { name: body, label: Détails, widget: markdown }
