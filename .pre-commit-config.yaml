# .pre-commit-config.yaml — boucle quality gates
# Works with both prek (Rust, recommended) and pre-commit (Python).
# Install:  prek install   (or: pre-commit install)
# Run all:  prek run --all-files   (or: pre-commit run --all-files)

# Scope: boucle is a portable dev-loop harness that ships to consumer repos.
# The harness lives in bin/, scripts/, test/, Makefile, .gitlab-ci.yml, and
# this config. Everything else (src/ content, docs/, .jcode/ vendored
# skills) is either upstream-synced or project content — not ours to reformat.
# EXCLUDE re-anchors the hooks onto harness files only.
repos:
  # ── Hygiene (pre-commit-hooks; prek auto-replaces with builtin Rust impl) ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: ^\.jcode/
      - id: end-of-file-fixer
        exclude: ^(src/|docs/|\.jcode/|\.boucle-version$)
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(src/|docs/|\.jcode/)
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]
        exclude: ^\.jcode/
      - id: check-yaml
        # .gitlab-ci.yml contains shell heredocs (cat << EOF ... EOF) whose
        # body text is NOT valid YAML (lines without colons, `---` separators
        # parsed as doc boundaries). GitLab validates the file server-side;
        # the hook would reject every commit that touches a heredoc body.
        exclude: ^\.gitlab-ci\.yml$
      - id: check-json
      - id: check-case-conflict
      - id: detect-private-key

  # ── shellcheck (static analysis, local system binary) ──
  # Local hook: the koalaman/shellcheck-precommit hook pulls a Docker image,
  # which fails in CI/hosts without a daemon. We use the system binary
  # (brew install shellcheck) via the Makefile's lint target instead.
  # Exclude .jcode/ — upstream-vendored scripts synced by bin/update.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (system)
        entry: bash -c 'shellcheck -x --severity=warning "$@"' --
        language: system
        types: [shell]
        exclude: ^\.jcode/

  # ── shfmt (formatting) ──
  # Exclude .jcode/ — reformatting vendored scripts creates churn that
  # the next bin/update overwrites.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-bn", "-ci", "-sr"]
        exclude: ^\.jcode/

  # ── bats unit tests (local hook, pre-push so commits stay fast) ──
  - repo: local
    hooks:
      - id: bats
        name: bats unit tests
        entry: bash scripts/test.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

default_install_hook_types: [pre-commit, pre-push]
