26:
  title: Attachment framing conflates "inspect for context" with "ship as asset"
  ✅: 'DO: `bin/jc` and `worker.md` frame attachments as dual-nature. The worker decides based on the comment''s intent: "use this file as the separator" → ship-as-asset (`cp` to `public/`, reference in
    build); "this is what''s wrong" → inspect-for-context. The worker uses `file <path>` (not `Read`) to get dimensions/metadata on binaries — `Read` on a PNG returns base64 garbage on text-only models.
    The worker does NOT need to *see* the image to *ship* it — `cp` + reference is enough.'
  ❌: 'DO NOT frame all attachments (issue + MR) as "Read each file to inspect them… use them as context for addressing reviewer feedback". Attachments have a **dual nature**: they may be (a) source assets
    the user wants shipped (logos, photos, illustrations — copy to `public/` and reference in the build), OR (b) mockups/screenshots for context (reviewer feedback, bug reports — inspect for guidance, do
    not ship). A single "use as context" framing primes the worker to *consult* the file, not to *adopt* it. When the worker cannot see the image (text-only model — `Read` on a PNG returns garbage), it
    fabricates a substitute instead of copying the uploaded file.'
27:
  title: Re-scrape logs when the found verdict is stale
  ✅: 'DO: track `VERDICT_SHA_MATCHED`; re-scrape when empty OR SHA mismatched; let a fresher SHA-anchored stdout verdict override the stale one.'
  ❌: DO NOT gate log-scraping on `if [ -z "$VERDICT" ]` alone — a stale verdict blocks recovery of the current run's stdout.
28:
  title: Persist worker state across iterations
  ✅: 'DO: persist `.boucle-state/<issue>/` to `$BOUCLE_STATE_CACHE/<issue>/` and restore it at startup; the worker reads `iterations.md` to know what was already tried. Per-issue state lives in `.boucle-state/`
    (gitignored), NEVER in `.boucle/` — `.boucle/` is the engine submodule on consumers and `git submodule update` clobbers anything inside it.'
  ❌: DO NOT assume `.boucle-state/<issue>/` survives between iterations (gitignored, no artifact passing, `$CI_PROJECT_DIR` may be wiped).
29:
  title: Distinguish API outage from step exhaustion (empty log + no activity traces)
  ✅:
  - 'DO: exit `4` on empty log / no agent activity → post a diagnostic naming the model, escalate to `boucle:human`, do not re-trigger.'
  - 'DO: `is_api_down` in `bin/jc` returns "down" when the agent log is empty or contains no activity traces (tool calls, file reads, git operations, source paths, comment markers). A working agent always
    leaves activity in its log; a dead provider leaves silence. This is provider-agnostic — it holds for any transcript format, so a working run is never false-flagged as "down". On "down", `bin/jc` exits
    `4`, the fallback provider is tried before any human escalation, and a diagnostic comment is posted on the issue.'
  ❌:
  - DO NOT treat an empty worker log as "agent exhausted its step budget".
  - DO NOT rely on error-pattern greps to decide a provider is down — a hung or dead provider produces no error lines at all, only silence, so an error-grep passes and the loop waits on a run that will
    never produce output.
30:
  title: Fall back to a second provider before escalating
  ✅:
  - 'DO: treat persistent quota exhaustion (HTTP 429/402 or explicit quota/credit messages, detected by `is_quota_exhausted`) as a provider-down condition on the exit-4 path, gated on a non-zero run exit
    so a successful run that merely quotes "429" is not misclassified.'
  - 'DO: when `BOUCLE_FALLBACK_PROVIDER` is set, retry with `$BOUCLE_FALLBACK_MODEL_<ROLE>` on the exit-4 condition; mark the iteration `[FALLBACK: provider/model]`. Escalate only if the fallback also fails.
    Each attempt is wrapped in `timeout` (per-role `AGENT_TIMEOUT`) so a hanging primary is killed before the job timeout eats the whole run — without this, the fallback block never executes because `run_with_retry`
    never returns.'
  ❌:
  - DO NOT escalate to a human the moment the primary provider is down.
  - DO NOT rely on `is_api_down` (empty log / no agent activity) as the only fallback trigger. A persistent quota error (HTTP 429/402, "you have reached your weekly usage limit") leaves activity traces
    in the agent log, so `is_api_down` reports the provider as "up" and the loop escalates to a human instead of falling back — even though retrying cannot fix an exhausted quota.
31:
  title: Download uploads via the GitLab API, not the raw /uploads/ URL
  ✅: 'DO: use `glab api --method GET "/projects/$PROJECT_ID/uploads/:secret/:filename" -H "Accept: application/octet-stream"` which returns the binary blob with proper token-based auth. Applies to both
    `bin/fetch-issue-attachments` and `bin/fetch-mr-attachments`.'
  ❌: 'DO NOT `curl -H "PRIVATE-TOKEN: $TOKEN" "https://$HOST/uploads/..."` to download attachments from issue/MR notes. The `/uploads/` endpoint uses cookie-based session auth — the `PRIVATE-TOKEN` header
    is ignored and the response is a GitLab login page (HTML), not the binary blob. The worker sees `file <path>` → "HTML document" and correctly refuses to ship it, falling back to a synthetic asset.'
