18:
  pruned: true
  reason: boucle is now public — bin/update succeeds unauthenticated
19:
  title: MR description not refreshed on worker re-run
  ✅: 'DO: the worker job calls `glab mr update` on the reused MR to refresh both the title and the description (new preview URL + new Approach + new commit summary) on every iteration. The reuse branch
    in `.gitlab-ci.yml` now updates the MR instead of silently reusing it.'
  ❌: DO NOT reuse an existing MR on iteration 2+ without updating its description. The worker deploys to a branch-based preview URL that changes between iterations, and the MR description carries the preview
    URL the reviewer tests against. A stale description points the reviewer at the wrong (old) URL — the reviewer may PASS a deployment that no longer exists, or FAIL a deployment that was never tested.
20:
  merged_into: 36
  reason: 'Approach section formatting — same class as #36 (bullet points + non-placeholder)'
21:
  title: Preview stale passes HTTP-200-only assertion
  ✅: 'DO: the worker job writes a commit-SHA marker into the build output (`__boucle_commit__.txt` + an HTML comment in `index.html`) right after the build, captures the wrangler exit code separately from
    the URL extraction (subshell + log file, not a swallowing pipeline), and the deploy assertion fetches the marker from the preview URL with a retry loop (`BOUCLE_PREVIEW_PROPAGATION_WAIT`, default 60s,
    5s backoff) until the deployed SHA matches the head SHA. A stale preview now FAILs the worker job instead of passing through to the reviewer.'
  ❌: 'DO NOT trust an HTTP 200 on the preview URL as proof that the deployed content matches the head commit. Three failure modes produce a 200 with stale content: (a) the deploy step''s exit code is swallowed
    by a `$(...) | grep | head` pipeline under `set +o pipefail`, so a failed redeploy is silently treated as success; (b) the CDN edge keeps serving cached content for seconds-to-minutes after a new deployment;
    (c) if the build output is byte-identical to the previous iteration (Astro/Vite cache hit on the shell executor), `wrangler pages deploy` returns the same content-hash URL and the preview never updates.'
22:
  title: Prefer rebase over hard reset
  ✅:
  - 'DO: `git rebase origin/master` when worker commits exist; on conflict, `git rebase --abort` and PRESERVE the branch (hand the conflict to the bounded re-trigger path). Fall back to hard reset ONLY
    on a true clean slate (no worker commits).'
  - 'DO: on rebase conflict, `git rebase --abort` and PRESERVE the branch — never reset it. Hand the conflict to the bounded re-trigger path (worker iteration budget, then `boucle:human`). `git reset --hard`
    is allowed ONLY for a true clean slate (no worker commits).'
  - 'DO: treat `commits_status` as a worker problem, not a merger problem — recover by re-triggering the WORKER (it regenerates the MR content from the preserved `state.md`/`iterations.md`), in both the
    merger and the doctor. Admission: class — destructive rebase-fallback reset on a committed branch; recurrence — any future backport/refactor may reintroduce a reset fallback; stable — no line numbers;
    distinct from lesson #22 which covers the unconditional start-of-run reset (this covers the rebase-CONFLICT fallback and the recovery side).'
  ❌:
  - DO NOT unconditionally `git reset --hard origin/master` at the start of every worker iteration — it wipes validated commits on non-code FAILs.
  - DO NOT fall back to `git reset --hard` when a rebase CONFLICTS on a branch that holds worker commits — the reset orphans the pushed commit, empties the MR (`detailed_merge_status=commits_status`) and
    sends the merger/doctor into an infinite escalation loop.
  - 'DO NOT let a rebase-fallback `git reset --hard origin/$CI_DEFAULT_BRANCH` run on a branch that contains worker commits. The commit becomes orphaned (still on the remote, but unreferenced): the MR goes
    empty (`detailed_merge_status=commits_status`), the merger cannot fix it (nothing to rebase or merge), escalates to `boucle:human`, and the doctor re-triggers the merger forever on the same empty MR
    — an infinite escalation loop.'
  - DO NOT trigger the merger on an MR in `commits_status` — the merger cannot repair an empty MR; re-triggering it is precisely the infinite loop.
23:
