36:
  title: Approach MUST use bullet points AND be filled (not placeholder)
  ✅:
  - 'DO: write the Approach as 3-6 bullet points (`- item`), one per aspect of the implementation. Each bullet cites the charter doc section it conforms to (e.g. "Conforms to the visual charter §2 — sharp
    corners via `--radius-sharp`"). Bullet points and blank lines render properly in GitLab markdown.'
  - 'DO: the worker MUST fill the Approach section with 2-5 sentences explaining the implementation approach and citing the specific charter doc sections it conformed to (`worker.md` step 8). The CI extraction
    (`APPROACH=$(sed -n ''/^## Approach/,/^## /p'' state.md...`) now falls back to an explicit note when the section is still the placeholder, so the MR description is never the literal seed text.'
  ❌:
  - DO NOT write the `## Approach` section as a paragraph of 2-5 sentences. GitLab markdown renders single newlines (soft breaks) as spaces, so a paragraph becomes an unreadable wall of text in the MR description.
    The worker prompt said "Write 2-5 sentences" — the worker wrote one long paragraph, and the MR description was a single 500-char block with no visual structure.
  - DO NOT leave the `## Approach` section of `state.md` as the seed placeholder `(to be determined by worker)`. The Approach section becomes the MR description's `### Approach` block, which the reviewer
    reads to verify doc conformance (e.g. visual charter §2 and §4 citations). An empty Approach causes repeated reviewer FAIL verdicts on the same criterion, wasting the iteration budget (`BOUCLE_MAX_ITERATIONS`).
37:
  title: Push consumer fixes upstream in the SAME session
  ✅:
  - 'DO: See [SKILL.md](SKILL.md) §I9 (Upstream-first). When a fix lands on consumer `master`, push it upstream **in the same session**: branch from `origin/main`, cherry-pick the consumer commit(s), push
    the branch, open a PR. This is mandatory — not optional, not "later".'
  - 'DO: accept that consumer `master` and upstream `main` are **intentionally divergent** — consumer has consumer-specific features (`feat:` commits) that will never go upstream, and upstream has its own
    commit history. The goal is not zero divergence but **no unpushed fixes** — every fix on consumer must have a corresponding upstream PR (merged or open).'
  ❌:
  - DO NOT land a fix on the consumer repo (`master`) and defer the upstream push to "later". The upstream-first workflow (`.jcode/UPSTREAM-FIX-WORKFLOW.md`) says "fix upstream FIRST, then update consumer"
    — but in practice fixes land on consumer `master` first (that's where the work happens) and the upstream push is forgotten. This grows the divergence between consumer `master` and upstream `main` (100+
    commits behind/ahead on a consumer repo as of 2026-08) until the two lines become unmanageable.
  - DO NOT push consumer `master` directly to upstream (`origin/main`). The two repos use different default branches (`master` vs `main`) and have divergent histories — a direct push is non-fast-forward
    and will be rejected (or worse, force-pushed, destroying upstream history).
  - DO NOT trust the commit-count divergence as a measure of real drift. `bin/update` syncs upstream → consumer via `cp -r` (file replacement, not git merge), so each sync creates a new commit SHA on consumer
    that doesn't match the upstream SHA. Git then reports upstream commits as "not present" even though their **content** is already there. Check file content, not commit count, to assess real drift.
38:
  title: Never leak consumer information in upstream contributions
  ✅:
  - 'DO: use generic language in upstream contributions: "consumer work", "a consumer repo", "discovered during consumer testing" — never the actual consumer name.'
  - 'DO: strip consumer issue references from commit messages before cherry-picking upstream. A consumer issue `(#35)` becomes nothing or a generic `(consumer)` when pushed upstream.'
  - 'DO: ask the human explicitly if a consumer name MUST be shared upstream for context — otherwise it stays private.'
  - 'DO: keep the origin benchmark documented. Boucle was extracted from a real product — a static Astro site (GitLab, Cloudflare Pages). The origin-era history has been ANONYMIZED (owner decision, 2026-08):
    all pre-extraction author/committer identities and forge references were rewritten to the maintainer''s identity in a history rewrite. The rules above protect *third-party consumers* — never re-introduce
    consumer-identifying content in upstream contributions.'
  ❌:
  - 'DO NOT include consumer-identifying information in upstream (boucle) contributions — PRs, issues, commits, branch names, or any artifact visible on the upstream repo. The upstream boucle repo is shared/public;
    consumer project information is private. This includes:'
  - DO NOT write "fixes from work on <consumer-name>" or "found on <consumer-domain>" in PR descriptions. This leaks the consumer identity to anyone reading the upstream repo.
