<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Urgence Palestine — Sveltia CMS</title>

		<!--
		  Sveltia auto-discovers /admin/config.yml by default. The same
		  configuration is also kept at the repo root as
		  `sveltia-cms.config.yml` for editor convenience — both must stay
		  in sync, but the served copy is the one under `static/admin/`.
		-->
	</head>
	<body>
		<!--
		  Sveltia CMS is a single-page application distributed as a small
		  JavaScript bundle via unpkg. The script auto-mounts a
		  <sveltia-cms-root> custom element (with its own shadow root) on
		  page load. Do NOT add `type="module"`: Sveltia explicitly
		  documents that the bundle is a classic script, not an ES module.
		-->
		<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
	</body>
</html>
